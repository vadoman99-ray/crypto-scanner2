<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ 多週期策略 (帶移動止損) + 防限流版</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=JetBrains+Mono:wght@800&family=Shippori+Mincho:wght@800&display=swap');

        :root {
            --manga-dark: #0a0e1a;
            --manga-navy: #121b2d;
            --manga-pink: #ff007f;
            --manga-cyan: #00f0ff;
            --manga-yellow: #ffe600;
            --manga-green: #00ff66;
            --manga-red: #ff3366;
            --pop-shadow: 4px 4px 0px #000;
        }

        * { box-sizing: border-box; outline: none; }
        
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: var(--manga-dark); 
            background-image: radial-gradient(rgba(0, 240, 255, 0.15) 15%, transparent 16%);
            background-size: 16px 16px;
            color: #fff; margin: 0; padding-bottom: 40px; 
        }

        .app-header { 
            position: sticky; top: 0; z-index: 100; 
            background: #101424; border-bottom: 3px solid var(--manga-cyan); 
            padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.3);
        }
        .header-title { 
            font-family: 'Shippori Mincho', serif; font-size: 1.1rem; font-weight: 900;
            color: #fff; text-shadow: 0 0 8px var(--manga-cyan);
        }
        
        .scan-btn { 
            background: linear-gradient(135deg, #ff007f 0%, #ff5500 100%); 
            color: #fff; border: 2px solid #fff; padding: 8px 16px; border-radius: 6px; 
            font-weight: 900; font-size: 0.9rem; cursor: pointer; 
            box-shadow: var(--pop-shadow);
        }
        .scan-btn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }

        .api-panel {
            background: var(--manga-navy); border: 2px solid var(--manga-cyan);
            margin: 14px 16px 0 16px; padding: 12px; border-radius: 8px; box-shadow: var(--pop-shadow);
        }
        .api-panel h3 { margin: 0 0 10px 0; font-size: 0.95rem; color: var(--manga-yellow); display: flex; justify-content: space-between; align-items: center; }
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .input-group input {
            background: #070a12; border: 1px solid var(--manga-cyan); color: #fff;
            padding: 8px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
        }
        .param-row { display: flex; gap: 8px; font-size: 0.8rem; margin-bottom: 8px; flex-wrap: wrap; }
        .param-row input { background: #070a12; border: 1px solid #2a3a5c; color: var(--manga-yellow); padding: 4px 6px; border-radius: 4px; width: 60px; text-align: center; font-family: 'JetBrains Mono'; }

        .toggle-container { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 900; }

        .progress-container { height: 6px; background: #090d16; width: 100%; margin-top: 10px; }
        .progress-fill { height: 100%; width: 0%; background: var(--manga-cyan); transition: width 0.1s; }

        .dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 14px 16px; }
        .stat-card {
            background: rgba(18, 27, 45, 0.85); border: 2px solid var(--manga-cyan);
            border-radius: 8px; padding: 10px; text-align: center; box-shadow: var(--pop-shadow);
        }
        .stat-card .val { font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; font-weight: 900; }
        .stat-card.entry { border-color: var(--manga-pink); }
        .stat-card.entry .val { color: var(--manga-pink); }

        .container { padding: 0 16px; }
        .symbol-card { 
            background: rgba(20, 30, 50, 0.9); border: 2px solid #2a3a5c; 
            border-left: 6px solid var(--manga-pink); border-radius: 8px; 
            padding: 12px 14px; margin-bottom: 12px; 
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: var(--pop-shadow); cursor: pointer;
        }

        .symbol-name { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: 900; }
        .symbol-price { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; color: var(--manga-yellow); }
        .badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: 900; background: var(--manga-pink); color: #fff; }
        .badge.traded { background: var(--manga-green); color: #000; }

        .modal-backdrop {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 8, 17, 0.85); backdrop-filter: blur(8px);
            z-index: 999; display: none; justify-content: center; align-items: center; padding: 16px;
        }
        .modal-card {
            background: var(--manga-navy); border: 2px solid var(--manga-cyan);
            border-radius: 12px; width: 100%; max-width: 520px; padding: 18px; position: relative;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .chart-container { width: 100%; height: 240px; background: #070a12; border: 2px solid #2a3a5c; border-radius: 8px; }
        canvas { width: 100%; height: 100%; display: block; }
        .info-row { display: flex; justify-content: space-between; font-size: 0.78rem; margin-top: 10px; font-family: 'JetBrains Mono', monospace; }
        .action-btn {
            width: 100%; margin-top: 12px; padding: 10px; background: var(--manga-green); color: #000;
            border: none; border-radius: 6px; font-weight: 900; font-size: 1rem; cursor: pointer; box-shadow: var(--pop-shadow);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>

    <div class="app-header">
        <div class="header-title">⚡ 多週期策略 (防限流優化版)</div>
        <button id="scanBtn" class="scan-btn" onclick="startScan()">發動監控</button>
    </div>

    <div class="api-panel">
        <h3>🔑 幣安 API 實盤自動下單設定 <span>(U本位合約)</span></h3>
        <div class="input-group">
            <input type="password" id="apiKey" placeholder="Binance API Key">
            <input type="password" id="apiSecret" placeholder="Binance API Secret">
        </div>
        
        <div class="param-row">
            <span>下單(USDT): <input type="number" id="tradeUsdt" value="100"></span>
            <span>啟動倍數: <input type="number" id="trailTrigger" value="1.0" step="0.1"></span>
            <span>追蹤距離: <input type="number" id="trailOffset" value="1.0" step="0.1"></span>
        </div>

        <div style="display: flex; gap: 10px; align-items: center; margin-top: 6px;">
            <div class="toggle-container">
                <input type="checkbox" id="autoTradeToggle" style="width:18px; height:18px; cursor:pointer;">
                <label for="autoTradeToggle" style="color:var(--manga-pink); cursor:pointer;">開啟觸發即自動下單</label>
            </div>
        </div>
    </div>

    <div class="progress-container"><div id="progress" class="progress-fill"></div></div>

    <div class="dashboard">
        <div class="stat-card">
            <div class="val" id="statTotal">0</div>
            <div style="font-size:0.75rem;">掃描目標數</div>
        </div>
        <div class="stat-card entry">
            <div class="val" id="statEntry">0</div>
            <div style="font-size:0.75rem;">符合條件標的</div>
        </div>
    </div>

    <div class="container" id="symbolList"></div>

    <div class="modal-backdrop" id="chartModal" onclick="if(event.target.id==='chartModal') closeModal()">
        <div class="modal-card">
            <div class="modal-header">
                <span id="modalSymbol" style="font-family:'JetBrains Mono'; font-weight:900; font-size:1.2rem;">BTCUSDT</span>
                <button onclick="closeModal()" style="background:var(--manga-pink); color:#fff; border:none; border-radius:4px; font-weight:900; cursor:pointer;">✕</button>
            </div>
            <div class="chart-container">
                <canvas id="strategyCanvas"></canvas>
            </div>
            <div class="info-row">
                <span>現價: <b id="valPrice" style="color:var(--manga-yellow);">0</b></span>
                <span>初始止損: <b id="valStop" style="color:var(--manga-red);">0</b></span>
                <span>移動啟動點: <b id="valTrigger" style="color:var(--manga-cyan);">0</b></span>
                <span>止盈(2.5): <b id="valTake" style="color:var(--manga-green);">0</b></span>
            </div>
            <button class="action-btn" id="manualTradeBtn" onclick="executeManualTrade()">立即依此風控下單 (U本位做多)</button>
        </div>
    </div>

<script>
    const API_BASE = 'https://fapi.binance.com';
    let rawResults = [];
    let currentSelectedItem = null;

    // 延遲函式：防禦 IP 被封鎖
    const delay = ms => new Promise(res => setTimeout(res, ms));

    // --- 1. 技術指標計算 ---
    async function fetchKlines(symbol, interval, limit = 30) {
        try {
            const res = await fetch(`${API_BASE}/fapi/v1/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`);
            if (!res.ok) return null;
            return await res.json();
        } catch { return null; }
    }

    function calcBollingerUpper(closes, period = 20, mult = 2.0) {
        if (closes.length < period) return 0;
        const slice = closes.slice(-period);
        const mean = slice.reduce((a, b) => a + b, 0) / period;
        const variance = slice.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / period;
        return mean + (mult * Math.sqrt(variance));
    }

    function calcSMA(closes, period) {
        if (closes.length < period) return 0;
        const slice = closes.slice(-period);
        return slice.reduce((a, b) => a + b, 0) / period;
    }

    function calcATR(klines, period = 14) {
        if (klines.length < period + 1) return 0;
        let trSum = 0;
        for (let i = klines.length - period; i < klines.length; i++) {
            const high = parseFloat(klines[i][2]);
            const low = parseFloat(klines[i][3]);
            const prevClose = parseFloat(klines[i - 1][4]);
            const tr = Math.max(high - low, Math.abs(high - prevClose), Math.abs(low - prevClose));
            trSum += tr;
        }
        return trSum / period;
    }

    // --- 2. 階段過濾策略邏輯 (降低 60%+ API 請求) ---
    async function evaluateSymbol(symbol) {
        // 第一階段：先抓 1h K 線評估趨勢，不符合就直接跳過，減少不必要的 API 請求
        const k1h = await fetchKlines(symbol, '1h', 20);
        if (!k1h) return null;

        const c1h = k1h.map(k => parseFloat(k[4]));
        const close1h = c1h[c1h.length - 1];
        const ma5_1h = calcSMA(c1h, 5);
        if (close1h <= ma5_1h) return null; // 1h 不符合，直接放棄

        // 第二階段：1h 通過後，才發送短週期 5m 與 15m 的請求
        const [k5m, k15m] = await Promise.all([
            fetchKlines(symbol, '5m', 25),
            fetchKlines(symbol, '15m', 25)
        ]);

        if (!k5m || !k15m) return null;

        const c5m = k5m.map(k => parseFloat(k[4]));
        const h5m = parseFloat(k5m[k5m.length - 1][2]);
        const upper5m = calcBollingerUpper(c5m);

        const c15m = k15m.map(k => parseFloat(k[4]));
        const h15m = parseFloat(k15m[k15m.length - 1][2]);
        const upper15m = calcBollingerUpper(c15m);

        if (h5m >= upper5m && h15m >= upper15m) {
            const price = c5m[c5m.length - 1];
            const atr = calcATR(k5m, 14);
            
            const triggerMult = parseFloat(document.getElementById('trailTrigger').value) || 1.0;
            const offsetMult = parseFloat(document.getElementById('trailOffset').value) || 1.0;

            const stopDist = atr * 1.5;
            const initialStop = price - stopDist;
            const trailTrigger = price + (atr * triggerMult);
            const takeProfit = price + (stopDist * 2.5);

            let dynamicStop = initialStop;
            let highestP = price;

            for (let i = k5m.length - 5; i < k5m.length; i++) {
                const h = parseFloat(k5m[i][2]);
                if (h > highestP) highestP = h;
                if (highestP >= trailTrigger) {
                    const trailedStop = highestP - (atr * offsetMult);
                    if (trailedStop > dynamicStop) dynamicStop = trailedStop;
                }
            }

            return {
                symbol,
                price,
                atr,
                initialStop,
                dynamicStop,
                trailTrigger,
                takeProfit,
                klines5m: k5m.slice(-20),
                traded: false
            };
        }
        return null;
    }

    // --- 3. 下單邏輯 ---
    function sendSignedRequest(endpoint, method, params = {}) {
        const key = document.getElementById('apiKey').value;
        const secret = document.getElementById('apiSecret').value;

        if (!key || !secret) {
            alert('請先輸入 API Key 與 API Secret！');
            return null;
        }

        params.timestamp = Date.now();
        const queryString = Object.keys(params).map(k => `${k}=${encodeURIComponent(params[k])}`).join('&');
        const signature = CryptoJS.HmacSHA256(queryString, secret).toString();

        return fetch(`${API_BASE}${endpoint}?${queryString}&signature=${signature}`, {
            method: method,
            headers: { 'X-MBX-APIKEY': key }
        }).then(r => r.json());
    }

    async function placeBinanceOrder(item) {
        const usdtAmount = parseFloat(document.getElementById('tradeUsdt').value) || 100;
        const qty = (usdtAmount / item.price).toFixed(3);
        const offsetMult = parseFloat(document.getElementById('trailOffset').value) || 1.0;

        try {
            const buyOrder = await sendSignedRequest('/fapi/v1/order', 'POST', {
                symbol: item.symbol,
                side: 'BUY',
                type: 'MARKET',
                quantity: qty
            });

            if (buyOrder.code) {
                alert(`下單失敗: ${buyOrder.msg}`);
                return false;
            }

            const callbackRate = ((item.atr * offsetMult) / item.price * 100).toFixed(1);
            await sendSignedRequest('/fapi/v1/order', 'POST', {
                symbol: item.symbol,
                side: 'SELL',
                type: 'TRAILING_STOP_MARKET',
                callbackRate: Math.max(0.1, Math.min(5.0, callbackRate)),
                closePosition: 'true'
            });

            await sendSignedRequest('/fapi/v1/order', 'POST', {
                symbol: item.symbol,
                side: 'SELL',
                type: 'TAKE_PROFIT_MARKET',
                stopPrice: item.takeProfit.toFixed(4),
                closePosition: 'true'
            });

            item.traded = true;
            renderList();
            alert(`✅ ${item.symbol} 市價買進成功！已成功設定移動止損與盈虧比止盈。`);
            return true;
        } catch (err) {
            alert(`下單過程發生異常: ${err}`);
            return false;
        }
    }

    // --- 4. 防限流併發控制 (Pool Control & Delay) ---
    async function startScan() {
        const btn = document.getElementById('scanBtn');
        btn.disabled = true; btn.innerText = "掃描中...";
        rawResults = [];

        try {
            const exchangeInfo = await fetch(`${API_BASE}/fapi/v1/exchangeInfo`).then(r => r.json());
            const symbols = exchangeInfo.symbols
                .filter(s => s.quoteAsset === 'USDT' && s.contractType === 'PERPETUAL' && s.status === 'TRADING')
                .map(s => s.symbol);

            document.getElementById('statTotal').innerText = symbols.length;

            let completed = 0;
            const poolLimit = 6; // 降低併發數到 6，避免觸發 429 Rate Limit
            let index = 0;

            async function worker() {
                while (index < symbols.length) {
                    const sym = symbols[index++];
                    const res = await evaluateSymbol(sym);
                    
                    if (res) {
                        rawResults.push(res);
                        if (document.getElementById('autoTradeToggle').checked && !res.traded) {
                            await placeBinanceOrder(res);
                        }
                    }
                    completed++;
                    document.getElementById('progress').style.width = `${(completed / symbols.length) * 100}%`;
                    document.getElementById('statEntry').innerText = rawResults.length;
                    if (completed % 5 === 0) renderList();

                    // 每次請求完成後，強制交出線程並微幅延遲 30ms，保持 UI 流暢與防限流
                    await delay(30);
                }
            }

            await Promise.all(Array(poolLimit).fill(0).map(() => worker()));
        } catch (e) {
            alert("掃描過程發生錯誤，請檢查網路連線或 API 狀態。");
        }

        btn.disabled = false; btn.innerText = "發動監控";
        renderList();
    }

    function renderList() {
        const container = document.getElementById('symbolList');
        if (rawResults.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:40px; color:#5a7094; font-weight:900;">尚未開啟掃描或無符合標的</div>`;
            return;
        }

        container.innerHTML = rawResults.map(item => `
            <div class="symbol-card" onclick="openModal('${item.symbol}')">
                <div>
                    <div class="symbol-name">${item.symbol.replace('USDT','')}</div>
                    <span class="badge ${item.traded ? 'traded' : ''}">${item.traded ? '已下單成功' : '🎯 多週期觸發 + 移動止損ready'}</span>
                </div>
                <div style="text-align:right;">
                    <div class="symbol-price">${item.price}</div>
                </div>
            </div>
        `).join('');
    }

    function openModal(symbol) {
        currentSelectedItem = rawResults.find(r => r.symbol === symbol);
        if (!currentSelectedItem) return;

        document.getElementById('modalSymbol').innerText = symbol;
        document.getElementById('valPrice').innerText = currentSelectedItem.price.toFixed(4);
        document.getElementById('valStop').innerText = currentSelectedItem.dynamicStop.toFixed(4);
        document.getElementById('valTrigger').innerText = currentSelectedItem.trailTrigger.toFixed(4);
        document.getElementById('valTake').innerText = currentSelectedItem.takeProfit.toFixed(4);

        document.getElementById('chartModal').style.display = 'flex';
        requestAnimationFrame(() => drawChart(currentSelectedItem));
    }

    function executeManualTrade() {
        if (currentSelectedItem) {
            placeBinanceOrder(currentSelectedItem);
            closeModal();
        }
    }

    function drawChart(item) {
        const canvas = document.getElementById('strategyCanvas');
        const ctx = canvas.getContext('2d');
        const rect = canvas.parentElement.getBoundingClientRect();
        
        canvas.width = rect.width * 2; canvas.height = rect.height * 2;
        ctx.scale(2, 2);

        const width = rect.width; const height = rect.height;
        const padding = { top: 20, bottom: 20, left: 10, right: 10 };

        const klines = item.klines5m.map(k => ({
            high: parseFloat(k[2]), low: parseFloat(k[3]),
            open: parseFloat(k[1]), close: parseFloat(k[4])
        }));

        let maxP = Math.max(...klines.map(k => k.high), item.takeProfit);
        let minP = Math.min(...klines.map(k => k.low), item.initialStop);
        const pRange = (maxP - minP) || 1;

        function getY(p) {
            return height - padding.bottom - ((p - minP) / pRange) * (height - padding.top - padding.bottom);
        }

        ctx.clearRect(0, 0, width, height);

        ctx.strokeStyle = '#ff3366'; ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(0, getY(item.dynamicStop)); ctx.lineTo(width, getY(item.dynamicStop)); ctx.stroke();

        ctx.strokeStyle = '#00f0ff'; ctx.setLineDash([2, 2]); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, getY(item.trailTrigger)); ctx.lineTo(width, getY(item.trailTrigger)); ctx.stroke();

        ctx.strokeStyle = '#00ff66'; ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(0, getY(item.takeProfit)); ctx.lineTo(width, getY(item.takeProfit)); ctx.stroke();
        ctx.setLineDash([]);

        const step = (width - padding.left - padding.right) / klines.length;
        klines.forEach((k, i) => {
            const x = padding.left + i * step + step / 2;
            const isUp = k.close >= k.open;
            const color = isUp ? '#00f0ff' : '#ff3366';

            ctx.strokeStyle = color; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(x, getY(k.high)); ctx.lineTo(x, getY(k.low)); ctx.stroke();

            const yOpen = getY(k.open); const yClose = getY(k.close);
            ctx.fillStyle = color;
            ctx.fillRect(x - (step * 0.3), Math.min(yOpen, yClose), step * 0.6, Math.max(Math.abs(yOpen - yClose), 2));
        });
    }

    function closeModal() {
        document.getElementById('chartModal').style.display = 'none';
    }
</script>
</body>
</html>
