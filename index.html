<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>加密貨幣多週期 DIF 共振掃描器</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f121d] text-gray-200 min-h-screen p-4 flex justify-center items-center font-sans">

  <!-- 主容器 -->
  <div class="w-full max-w-md bg-[#131722] rounded-xl p-4 shadow-2xl border border-gray-800 space-y-4">
    
    <!-- 頂部標題區 -->
    <div class="border-b border-gray-800 pb-3">
      <div class="flex items-center gap-2 text-xl font-bold text-white">
        <span class="text-amber-400">⚡</span>
        <span>加密貨幣共振掃描 (DIF > 0)</span>
      </div>
      <div class="flex justify-between items-center text-xs text-gray-400 mt-1">
        <span>掃描更新：<span id="update-time">載入中...</span></span>
        <span>自動更新：每 60 秒</span>
      </div>
    </div>

    <!-- 1H + 4H 共振多頭區塊 -->
    <div class="bg-[#181c28] rounded-lg p-3 border border-gray-800/60">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2 text-amber-400 font-bold">
          <span>🚀</span>
          <span>1H + 4H DIF 多頭共振</span>
        </div>
        <span class="text-[10px] bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded border border-amber-500/20">雙週期共振</span>
      </div>
      
      <div class="overflow-x-auto">
        <table class="w-full text-xs text-left border-collapse">
          <thead>
            <tr class="text-gray-400 border-b border-gray-800 pb-1">
              <th class="py-1">標的</th>
              <th class="text-right">價格</th>
              <th class="text-right">1H DIF</th>
              <th class="text-right">4H DIF</th>
              <th class="text-right">24H漲跌</th>
              <th class="text-center">狀態</th>
            </tr>
          </thead>
          <tbody id="bull-1h4h-tbody" class="divide-y divide-gray-800/40">
            <tr>
              <td colspan="6" class="text-center py-4 text-gray-500">行情資料載入中...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 1H + 4H + 8H 共振多頭區塊 -->
    <div class="bg-[#181c28] rounded-lg p-3 border border-amber-500/30">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2 text-rose-400 font-bold">
          <span>🔥</span>
          <span>1H + 4H + 8H DIF 多頭共振</span>
        </div>
        <span class="text-[10px] bg-rose-500/10 text-rose-400 px-2 py-0.5 rounded border border-rose-500/20">三週期強共振</span>
      </div>
      
      <div class="overflow-x-auto">
        <table class="w-full text-xs text-left border-collapse">
          <thead>
            <tr class="text-gray-400 border-b border-gray-800 pb-1">
              <th class="py-1">標的</th>
              <th class="text-right">價格</th>
              <th class="text-right">1H DIF</th>
              <th class="text-right">4H DIF</th>
              <th class="text-right">8H DIF</th>
              <th class="text-center">狀態</th>
            </tr>
          </thead>
          <tbody id="bull-1h4h8h-tbody" class="divide-y divide-gray-800/40">
            <tr>
              <td colspan="6" class="text-center py-4 text-gray-500">行情資料載入中...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 頁尾免責聲明 -->
    <div class="text-center text-[10px] text-gray-500 pt-2 space-y-0.5">
      <div>💡 <b>篩選條件：</b> 各週期 DIF (EMA12 - EMA26) 皆大於 0；<span class="text-amber-400">💥 爆量</span> (當前成交量 > 前一根 1.5 倍)</div>
      <div>資料來源：幣安 USDT 永續合約 API。</div>
    </div>

  </div>

  <!-- 幣安 API 多週期 DIF 計算與串接腳本 -->
  <script>
    const BINANCE_TICKER_URL = 'https://fapi.binance.com/fapi/v1/ticker/24hr';
    const BINANCE_KLINES_URL = 'https://fapi.binance.com/fapi/v1/klines';

    // 計算指數移動平均線 (EMA)
    function calculateEMA(data, period) {
      if (data.length < period) return [];
      const k = 2 / (period + 1);
      let emaArray = [data[0]];
      for (let i = 1; i < data.length; i++) {
        emaArray.push(data[i] * k + emaArray[i - 1] * (1 - k));
      }
      return emaArray;
    }

    // 計算 MACD DIF (EMA12 - EMA26)
    function calculateDIF(closePrices) {
      if (closePrices.length < 26) return 0;
      const ema12 = calculateEMA(closePrices, 12);
      const ema26 = calculateEMA(closePrices, 26);
      const latestEMA12 = ema12[ema12.length - 1];
      const latestEMA26 = ema26[ema26.length - 1];
      return latestEMA12 - latestEMA26;
    }

    // 取得指定時間週期的 DIF 與爆量狀態
    async function fetchTimeframeData(symbol, interval, limit = 35) {
      try {
        const res = await fetch(`${BINANCE_KLINES_URL}?symbol=${symbol}&interval=${interval}&limit=${limit}`);
        const data = await res.json();
        
        const closePrices = data.map(item => parseFloat(item[4]));
        const volumes = data.map(item => parseFloat(item[5]));
        
        const dif = calculateDIF(closePrices);

        // 判斷當前 K 線是否爆量 (當前量 > 前一根 1.5 倍)
        const currVol = volumes[volumes.length - 1];
        const prevVol = volumes[volumes.length - 2];
        const isHighVol = prevVol > 0 ? (currVol > prevVol * 1.5) : false;

        return { dif, isHighVol };
      } catch (err) {
        console.error(`無法取得 ${symbol} ${interval} 資料`, err);
        return { dif: 0, isHighVol: false };
      }
    }

    // 核心數據分析與篩選
    async function updateMarketScanner() {
      try {
        const res = await fetch(BINANCE_TICKER_URL);
        const tickers = await res.json();

        // 僅保留幣安 U 本位永續合約 (排除 USDC、交割合約及槓桿代幣)
        const usdtPairs = tickers
          .filter(t => t.symbol.endsWith('USDT') && !t.symbol.includes('_'))
          .sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
          .slice(0, 30);

        // 同步並行查詢各週期 K 線
        const marketData = await Promise.all(
          usdtPairs.map(async (item) => {
            const symbol = item.symbol.replace('USDT', '');
            const fullSymbol = item.symbol;
            const price = parseFloat(item.lastPrice);
            const change24h = parseFloat(item.priceChangePercent);
            
            // 多週期平行請求：1h, 4h, 8h (取得 DIF 值)
            const [tf1h, tf4h, tf8h] = await Promise.all([
              fetchTimeframeData(item.symbol, '1h'),
              fetchTimeframeData(item.symbol, '4h'),
              fetchTimeframeData(item.symbol, '8h')
            ]);
            
            return {
              symbol,
              fullSymbol,
              price,
              change24h,
              dif1h: tf1h.dif,
              dif4h: tf4h.dif,
              dif8h: tf8h.dif,
              isHighVol: tf1h.isHighVol || tf4h.isHighVol || tf8h.isHighVol
            };
          })
        );

        // 條件 1：1H 與 4H 的 DIF 皆 > 0
        const list1h4h = marketData
          .filter(d => d.dif1h > 0 && d.dif4h > 0)
          .sort((a, b) => (b.dif1h + b.dif4h) - (a.dif1h + a.dif4h))
          .slice(0, 8);

        // 條件 2：1H、4H 與 8H 的 DIF 皆 > 0
        const list1h4h8h = marketData
          .filter(d => d.dif1h > 0 && d.dif4h > 0 && d.dif8h > 0)
          .sort((a, b) => (b.dif1h + b.dif4h + b.dif8h) - (a.dif1h + a.dif4h + a.dif8h))
          .slice(0, 8);

        // 渲染畫面
        render1h4hTable(list1h4h);
        render1h4h8hTable(list1h4h8h);
        
        // 更新時間
        document.getElementById('update-time').innerText = new Date().toLocaleTimeString('zh-TW', { hour12: false });

      } catch (error) {
        console.error('更新多週期資料失敗:', error);
      }
    }

    // 渲染 1H + 4H 表格
    function render1h4hTable(dataList) {
      const tbody = document.getElementById('bull-1h4h-tbody');
      if (dataList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-3 text-gray-500">無雙週期 DIF 共振標的</td></tr>`;
        return;
      }

      tbody.innerHTML = dataList.map(item => {
        const binanceUrl = `https://www.binance.com/zh-TC/futures/${item.fullSymbol}`;
        const c24Class = item.change24h >= 0 ? 'text-rose-500' : 'text-emerald-400';

        return `
          <tr class="hover:bg-gray-800/20 transition-colors">
            <td class="py-2 font-medium">
              <a href="${binanceUrl}" target="_blank" rel="noopener noreferrer" class="text-gray-200 hover:text-amber-400 underline underline-offset-2 decoration-gray-600">
                ${item.symbol}
              </a>
            </td>
            <td class="text-right font-mono">${item.price < 1 ? item.price.toFixed(4) : item.price.toFixed(2)}</td>
            <td class="text-right text-rose-500 font-mono">+${item.dif1h.toFixed(3)}</td>
            <td class="text-right text-rose-500 font-mono">+${item.dif4h.toFixed(3)}</td>
            <td class="text-right ${c24Class}">${item.change24h > 0 ? '+' : ''}${item.change24h.toFixed(2)}%</td>
            <td class="text-center">${item.isHighVol ? '💥' : '-'}</td>
          </tr>
        `;
      }).join('');
    }

    // 渲染 1H + 4H + 8H 表格
    function render1h4h8hTable(dataList) {
      const tbody = document.getElementById('bull-1h4h8h-tbody');
      if (dataList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-3 text-gray-500">無三週期 DIF 強共振標的</td></tr>`;
        return;
      }

      tbody.innerHTML = dataList.map(item => {
        const binanceUrl = `https://www.binance.com/zh-TC/futures/${item.fullSymbol}`;

        return `
          <tr class="hover:bg-gray-800/20 transition-colors">
            <td class="py-2 font-medium">
              <a href="${binanceUrl}" target="_blank" rel="noopener noreferrer" class="text-gray-200 hover:text-amber-400 underline underline-offset-2 decoration-gray-600">
                ${item.symbol}
              </a>
            </td>
            <td class="text-right font-mono">${item.price < 1 ? item.price.toFixed(4) : item.price.toFixed(2)}</td>
            <td class="text-right text-rose-500 font-mono">+${item.dif1h.toFixed(3)}</td>
            <td class="text-right text-rose-500 font-mono">+${item.dif4h.toFixed(3)}</td>
            <td class="text-right text-rose-500 font-mono">+${item.dif8h.toFixed(3)}</td>
            <td class="text-center">${item.isHighVol ? '💥' : '-'}</td>
          </tr>
        `;
      }).join('');
    }

    // 啟動分析程序 (每 60 秒刷新一次)
    updateMarketScanner();
    setInterval(updateMarketScanner, 60000);
  </script>
</body>
</html>
