<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MA多頭排列掃描 (1H) - Terminal Pro Ultra</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

        :root {
            --bg-color: #06080a;
            --card-bg: rgba(18, 22, 28, 0.7);
            --card-hover: rgba(26, 32, 41, 0.9);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f0f4f8;
            --text-sub: #828f9e;
            --yellow: #f0b90b;
            --yellow-glow: rgba(240, 185, 11, 0.35);
            --green: #0ecb81;
            --green-bg: rgba(14, 203, 129, 0.15);
            --red: #f6465d;
            --red-bg: rgba(246, 70, 93, 0.15);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding-bottom: 30px; 
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* 頂部導覽列模糊玻璃質感 */
        .app-header { 
            position: sticky; top: 0; z-index: 100; 
            background-color: rgba(10, 12, 16, 0.8); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            padding: 12px 16px; 
            border-bottom: 1px solid var(--card-border); 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .header-title { 
            font-weight: 800; font-size: 1.05rem; letter-spacing: -0.3px;
            display: flex; align-items: center; gap: 8px; 
            background: linear-gradient(135deg, #ffffff 30%, var(--yellow) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .scan-btn { 
            background: linear-gradient(135deg, var(--yellow), #f39c12); 
            color: #000; border: none; 
            padding: 8px 18px; border-radius: 20px; font-weight: 700; 
            font-size: 0.85rem; cursor: pointer; 
            box-shadow: 0 4px 15px var(--yellow-glow);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); 
        }
        .scan-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px var(--yellow-glow); }
        .scan-btn:active { transform: scale(0.92); }
        .scan-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

        /* 進度條動態粒子光芒 */
        .progress-bar { height: 3px; background: rgba(255,255,255,0.03); width: 100%; overflow: hidden; position: relative; }
        .progress-fill { 
            height: 100%; width: 0%; 
            background: linear-gradient(90deg, var(--yellow), var(--green)); 
            transition: width 0.2s cubic-bezier(0.1, 0.9, 0.2, 1); 
            box-shadow: 0 0 10px var(--green);
        }
        
        /* Dashboard 數據統計卡片 */
        .dashboard {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
            padding: 14px 16px 4px 16px;
        }
        .stat-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 12px; padding: 12px; text-align: center;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .stat-card:hover { border-color: rgba(255,255,255,0.15); transform: translateY(-1px); }
        .stat-card .val { 
            font-family: 'JetBrains Mono', monospace; font-size: 1.25rem; font-weight: 700; color: #fff;
            transition: transform 0.2s ease;
        }
        .stat-card .lbl { font-size: 0.7rem; color: var(--text-sub); margin-top: 2px; font-weight: 500; }
        .stat-card.perfect .val { color: var(--green); text-shadow: 0 0 10px rgba(14, 203, 129, 0.3); }

        /* 工具列 */
        .toolbar { padding: 10px 16px 12px 16px; display: flex; gap: 8px; align-items: center; }
        .search-wrapper { position: relative; flex: 1; display: flex; align-items: center; }
        .search-input { 
            width: 100%; background: var(--card-bg); border: 1px solid var(--card-border); 
            color: var(--text-main); padding: 8px 30px 8px 12px; border-radius: 10px; 
            font-size: 0.85rem; transition: all 0.25s ease;
            backdrop-filter: blur(10px);
        }
        .search-input:focus { border-color: var(--yellow); box-shadow: 0 0 0 3px var(--yellow-glow); }
        .clear-btn { position: absolute; right: 10px; background: none; border: none; color: var(--text-sub); cursor: pointer; font-size: 0.9rem; display: none; }
        
        .tool-btn { 
            background: var(--card-bg); border: 1px solid var(--card-border); 
            color: var(--text-sub); padding: 8px 12px; border-radius: 10px; 
            font-size: 0.75rem; cursor: pointer; font-weight: 600; white-space: nowrap; 
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }
        .tool-btn:hover { color: var(--text-main); border-color: rgba(255,255,255,0.2); }
        .tool-btn:active { transform: scale(0.95); }

        .status-bar { padding: 0 16px 8px 16px; font-size: 0.75rem; color: var(--text-sub); display: flex; justify-content: space-between; align-items: center; }
        .container { padding: 0 16px; }
        
        /* 幣種卡片動畫 */
        .symbol-card { 
            background: var(--card-bg); border: 1px solid var(--card-border); 
            border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; 
            display: flex; justify-content: space-between; align-items: center; 
            text-decoration: none; color: inherit; 
            backdrop-filter: blur(12px);
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
            animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(12px);
        }
        .symbol-card:hover { 
            transform: translateY(-2px) scale(1.005); 
            border-color: rgba(240, 185, 11, 0.4); 
            background: var(--card-hover);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .symbol-card:active { transform: scale(0.98); }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .symbol-info .name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .symbol-info .name { font-size: 1.1rem; font-weight: 800; letter-spacing: 0.3px; }
        
        .symbol-metrics { text-align: right; }
        .symbol-metrics .price { font-size: 1.05rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
        
        /* 呼吸燈動畫 Badge */
        .badge-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
        .badge { font-size: 0.65rem; padding: 3px 8px; border-radius: 6px; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; }
        .badge-ma { 
            background-color: var(--green-bg); 
            color: var(--green); 
            border: 1px solid rgba(14, 203, 129, 0.3);
        }
        .pulse-dot {
            width: 6px; height: 6px; border-radius: 50%; background-color: var(--green);
            box-shadow: 0 0 6px var(--green);
            animation: pulsate 1.5s infinite ease-in-out;
        }

        @keyframes pulsate {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }

        .change-badge { font-size: 0.75rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; }
        .change-up { color: var(--green); background-color: var(--green-bg); }
        .change-down { color: var(--red); background-color: var(--red-bg); }
        
        .empty-tip { text-align: center; padding: 60px 0; color: var(--text-sub); font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="header-title">📈 1H MA 多頭排列掃描</div>
        <button id="scanBtn" class="scan-btn" onclick="startScan()">極速掃描</button>
    </div>

    <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>

    <!-- 數據概覽 Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="stat-card">
            <div class="val" id="statTotal">0</div>
            <div class="lbl">掃描總數</div>
        </div>
        <div class="stat-card perfect">
            <div class="val" id="statMaBull">0</div>
            <div class="lbl">1H MA 多頭排列</div>
        </div>
    </div>

    <div class="toolbar" id="toolbar">
        <div class="search-wrapper">
            <input type="text" id="searchInput" class="search-input" placeholder="搜尋幣種 (例: BTC)..." oninput="onSearchInput()">
            <button id="clearBtn" class="clear-btn" onclick="clearSearch()">✕</button>
        </div>
        <button class="tool-btn" id="sortBtn" onclick="toggleSort()">漲幅 ⬇</button>
    </div>

    <div class="status-bar" id="statusBar">
        <span id="statusText">點擊「極速掃描」啟動高效算力引擎</span>
        <span id="countText">符合 0 筆</span>
    </div>

    <div class="container" id="symbolList"></div>

<script>
    let rawResults = [];
    let ticker24hMap = {};
    let sortDesc = true;
    let isScanning = false;
    let totalSymbolCount = 0;

    // 優化超時控制至 1800ms
    async function fetchWithTimeout(url, timeoutMs = 1800) {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeoutMs);
        try {
            const response = await fetch(url, { signal: controller.signal });
            clearTimeout(id);
            if (response.ok) return await response.json();
        } catch (e) { clearTimeout(id); }
        return null;
    }

    function calculateSMA(closes, period) {
        const len = closes.length;
        if (len < period) return 0;
        let sum = 0;
        for (let i = len - period; i < len; i++) {
            sum += closes[i];
        }
        return sum / period;
    }

    async function fetch24hTickers() { 
        const data = await fetchWithTimeout('https://fapi.binance.com/fapi/v1/ticker/24hr', 2500); 
        if (!data || !Array.isArray(data)) return {};
        const map = {}; 
        for (let i = 0; i < data.length; i++) {
            map[data[i].symbol] = parseFloat(data[i].priceChangePercent);
        }
        return map; 
    }

    async function getUSDTFuturesSymbols() { 
        const data = await fetchWithTimeout('https://fapi.binance.com/fapi/v1/exchangeInfo', 2500); 
        if (!data || !data.symbols) return [];
        return data.symbols
            .filter(s => s.quoteAsset === 'USDT' && s.contractType === 'PERPETUAL' && s.status === 'TRADING')
            .map(s => s.symbol); 
    }

    async function processSymbol(symbol) {
        try {
            const res1h = await fetchWithTimeout(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=1h&limit=70`);
            if (!res1h || res1h.length < 60) return null;

            const len = res1h.length;
            const closes = new Float64Array(len);
            for (let i = 0; i < len; i++) closes[i] = parseFloat(res1h[i][4]);

            const ma30 = calculateSMA(closes, 30);
            const ma45 = calculateSMA(closes, 45);
            const ma60 = calculateSMA(closes, 60);

            if (ma30 > ma45 && ma45 > ma60) {
                return { 
                    symbol, 
                    price: closes[len - 1], 
                    priceChange24h: ticker24hMap[symbol] || 0 
                };
            }
            return null;
        } catch (e) { return null; }
    }

    // 將併發數調升至 30 提升總掃描速度
    async function runFastScanner(symbols, chunkSize = 30, onProgress) {
        let completed = 0;
        const results = [];

        for (let i = 0; i < symbols.length; i += chunkSize) {
            const chunk = symbols.slice(i, i + chunkSize);
            const chunkPromises = chunk.map(s => processSymbol(s));
            const settled = await Promise.allSettled(chunkPromises);
            
            for (let res of settled) {
                if (res.status === 'fulfilled' && res.value) {
                    results.push(res.value);
                }
            }
            completed += chunk.length;
            onProgress(completed, symbols.length);
        }
        return results;
    }

    function updateDashboard() {
        document.getElementById('statTotal').innerText = totalSymbolCount;
        document.getElementById('statMaBull').innerText = rawResults.length;
    }

    async function startScan() {
        if (isScanning) return;
        isScanning = true;

        const btn = document.getElementById('scanBtn');
        const statusText = document.getElementById('statusText');
        btn.disabled = true; btn.innerText = "極速計算中"; 
        statusText.innerText = "建立全量行情通道...";
        rawResults = [];
        
        // 並行化獲取基礎行情
        const [tickers, symbols] = await Promise.all([fetch24hTickers(), getUSDTFuturesSymbols()]);
        ticker24hMap = tickers;
        totalSymbolCount = symbols.length;
        
        if (symbols.length === 0) {
            statusText.innerText = "網路異常，未能載入合約資料";
            btn.disabled = false; btn.innerText = "極速掃描";
            isScanning = false;
            return;
        }

        let lastRenderTime = 0;

        rawResults = await runFastScanner(symbols, 30, (completed, total) => {
            const pct = Math.floor((completed / total) * 100);
            document.getElementById('progress').style.width = `${pct}%`;
            statusText.innerText = `多核心運算中 (${completed}/${total})...`;

            const now = Date.now();
            if (now - lastRenderTime > 200) {
                lastRenderTime = now;
                updateDashboard();
                renderList();
            }
        });

        updateDashboard();
        statusText.innerText = "掃描完畢，即時數據已同步";
        btn.disabled = false; btn.innerText = "極速掃描";
        isScanning = false;
        renderList();
    }

    function toggleSort() { 
        sortDesc = !sortDesc; 
        document.getElementById('sortBtn').innerText = sortDesc ? "漲幅 ⬇" : "漲幅 ⬆";
        renderList(); 
    }

    function onSearchInput() {
        const input = document.getElementById('searchInput');
        document.getElementById('clearBtn').style.display = input.value ? 'block' : 'none';
        renderList();
    }

    function clearSearch() {
        const input = document.getElementById('searchInput');
        input.value = '';
        document.getElementById('clearBtn').style.display = 'none';
        renderList();
    }

    function getFilteredData() {
        const query = document.getElementById('searchInput').value.toUpperCase().trim();
        return rawResults.filter(item => item.symbol.includes(query));
    }

    function renderList() {
        const container = document.getElementById('symbolList');
        let data = getFilteredData();
        data.sort((a, b) => sortDesc ? b.priceChange24h - a.priceChange24h : a.priceChange24h - b.priceChange24h);
        
        document.getElementById('countText').innerText = `顯示 ${data.length} / 符合 ${rawResults.length} 筆`;

        if (data.length === 0) {
            container.innerHTML = `<div class="empty-tip">${rawResults.length === 0 ? '點擊右上角「極速掃描」開啟運算' : '無符合條件的標的'}</div>`;
            return;
        }

        container.innerHTML = data.map((item, index) => {
            // 加入 stagger 動畫延遲，限制前 15 筆動態入場避免卡頓
            const animDelay = index < 15 ? (index * 0.03).toFixed(2) : 0;
            return `
            <a class="symbol-card" href="https://www.binance.com/zh-TC/futures/${item.symbol}" target="_blank" style="animation-delay: ${animDelay}s;">
                <div class="symbol-info">
                    <div class="name-row">
                        <span class="name">${item.symbol.replace('USDT', '')}</span>
                        <span class="change-badge ${item.priceChange24h >= 0 ? 'change-up' : 'change-down'}">
                            ${item.priceChange24h >= 0 ? '+' : ''}${item.priceChange24h.toFixed(2)}%
                        </span>
                    </div>
                    <div class="badge-list">
                        <span class="badge badge-ma">
                            <span class="pulse-dot"></span>
                            1H 多頭排列 (MA30 > MA45 > MA60)
                        </span>
                    </div>
                </div>
                <div class="symbol-metrics">
                    <div class="price">${item.price}</div>
                </div>
            </a>
            `;
        }).join('');
    }
</script>
</body>
</html>
