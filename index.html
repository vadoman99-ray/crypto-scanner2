<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幣安合約動能掃描器</title>
    <style>
        :root {
            --bg-color: #0b0e11;
            --card-bg: #1e2329;
            --card-hover: #2b313a;
            --card-border: #2b313a;
            --text-main: #eaecef;
            --text-sub: #848e9c;
            --yellow: #f0b90b;
            --green: #0ecb81;
            --green-bg: rgba(14, 203, 129, 0.15);
            --red: #f6465d;
            --red-bg: rgba(246, 70, 93, 0.15);
            --fire: #ff6d00;
            --fire-bg: rgba(255, 109, 0, 0.15);
            --breakout: #e040fb;
            --breakout-bg: rgba(224, 64, 251, 0.18);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding-bottom: 70px; }
        
        .app-header { position: sticky; top: 0; z-index: 100; background-color: var(--card-bg); padding: 12px 16px; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        .header-title { font-weight: 800; font-size: 1.05rem; display: flex; align-items: center; gap: 6px; }
        .scan-btn { background-color: var(--yellow); color: #000; border: none; padding: 8px 18px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
        
        /* 新增：當前篩選標題欄 */
        .filter-header { padding: 12px 16px; font-size: 0.85rem; color: var(--yellow); font-weight: 600; background: rgba(240,185,11,0.05); border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
        
        .toolbar { padding: 8px 16px; background: var(--bg-color); display: flex; gap: 8px; align-items: center; }
        .search-input { flex: 1; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; }
        
        .container { padding: 8px 16px; }
        .symbol-card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .badge { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 600; display: inline-block; margin-right: 4px; }
        
        /* 底部導覽列增強 */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background-color: #161a1e; border-top: 1px solid var(--card-border); display: flex; z-index: 100; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-sub); font-size: 0.65rem; cursor: pointer; border: none; background: none; transition: 0.2s; }
        .nav-item.active { color: var(--yellow); background: rgba(240,185,11,0.05); }
        
        .about-card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .about-title { font-size: 0.95rem; font-weight: 700; color: var(--yellow); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .about-content { font-size: 0.85rem; color: #c0c6d0; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="header-title">⚡ 1H 動能掃描</div>
        <button id="scanBtn" class="scan-btn" onclick="startScan()">重新掃描</button>
    </div>

    <div id="filterLabel" class="filter-header">當前篩選：全部</div>

    <div class="toolbar" id="toolbar">
        <input type="text" id="searchInput" class="search-input" placeholder="搜尋幣種..." oninput="renderList()">
    </div>

    <div id="mainView" class="container"></div>

    <div class="bottom-nav">
        <button class="nav-item active" onclick="setFilter('ALL', this, '全部')"><div>🌐</div>全部</button>
        <button class="nav-item" onclick="setFilter('ABOVE_5MA', this, '5MA 上')"><div>🟢</div>5MA上</button>
        <button class="nav-item" onclick="setFilter('BELOW_5MA', this, '5MA 下')"><div>🟡</div>5MA下</button>
        <button class="nav-item" onclick="setFilter('BREAKOUT', this, '剛突破')"><div>⚡</div>突破</button>
        <button class="nav-item" onclick="setFilter('ABOVE_BB', this, '上軌之上')"><div>🔥</div>上軌</button>
        <button class="nav-item" onclick="setFilter('INFO', this, '說明頁')"><div>ℹ️</div>說明</button>
    </div>

<script>
    let rawResults = [];
    let currentFilter = 'ALL';

    // 模擬資料獲取
    async function startScan() {
        rawResults = [];
        const symbols = ['BTC', 'ETH', 'SOL', 'XRP', 'ADA', 'DOGE', 'BNB'];
        symbols.forEach(s => {
            rawResults.push({ symbol: s+'USDT', price: (Math.random()*100).toFixed(2), isAboveMa5: Math.random()>0.5, isJustBreakout15mBB: Math.random()>0.8, isAbove15mBB: Math.random()>0.7, change: (Math.random()-0.5)*10 });
        });
        renderList();
    }

    function setFilter(filter, el, title) {
        currentFilter = filter;
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('filterLabel').innerText = `當前篩選：${title}`;
        
        const isInfo = filter === 'INFO';
        document.getElementById('toolbar').style.display = isInfo ? 'none' : 'flex';
        
        if (isInfo) renderInfoPage(); else renderList();
    }

    function renderInfoPage() {
        document.getElementById('mainView').innerHTML = `
            <div class="about-card">
                <div class="about-title">🎯 工具核心設計理念</div>
                <div class="about-content">本工具專為幣安 USDT 永續合約打造，協助交易者迅速篩選多頭趨勢與短期爆發標的。</div>
            </div>
            <div class="about-card">
                <div class="about-title">💡 操作說明</div>
                <div class="about-content">點擊底部標籤即可快速切換不同篩選策略，左上角會顯示您當前正在觀察的類別。</div>
            </div>
        `;
    }

    function renderList() {
        const container = document.getElementById('mainView');
        let filtered = rawResults.filter(item => {
            if (currentFilter === 'ABOVE_5MA') return item.isAboveMa5;
            if (currentFilter === 'BELOW_5MA') return !item.isAboveMa5;
            if (currentFilter === 'BREAKOUT') return item.isJustBreakout15mBB;
            if (currentFilter === 'ABOVE_BB') return item.isAbove15mBB;
            return true;
        });
        
        container.innerHTML = filtered.map(item => `
            <div class="symbol-card">
                <div>
                    <div style="font-weight:700; font-size:1.1rem;">${item.symbol.replace('USDT', '')}</div>
                    <div style="font-size:0.7rem; color:var(--text-sub)">USDT永續</div>
                </div>
                <div style="text-align:right">
                    <div style="font-weight:700">${item.price}</div>
                    <div style="color:${item.change>=0?'var(--green)':'var(--red)'}">${item.change.toFixed(2)}%</div>
                </div>
            </div>
        `).join('');
    }
    
    startScan(); // 初始化
</script>
</body>
</html>
