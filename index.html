<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幣安 USDT 永續合約掃描器 (1H 20MA+)</title>
    <style>
        :root {
            --bg-color: #12161c;
            --card-bg: #1e2329;
            --text-main: #eaecef;
            --text-sub: #848e9c;
            --green: #0ecb81;
            --yellow: #f0b90b;
            --border: #2b313a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 1.2rem;
            margin: 0;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button {
            background-color: var(--yellow);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter-btn {
            background: var(--card-bg);
            color: var(--text-sub);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .filter-btn.active {
            color: var(--text-main);
            border-color: var(--yellow);
            background: #2b313a;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--border);
            margin-bottom: 20px;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--yellow);
            transition: width 0.1s;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #181a20;
            color: var(--text-sub);
            font-size: 0.85rem;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .badge-above {
            background-color: rgba(14, 203, 129, 0.15);
            color: var(--green);
            border: 1px solid var(--green);
        }

        .badge-below {
            background-color: rgba(240, 185, 11, 0.15);
            color: var(--yellow);
            border: 1px solid var(--yellow);
        }

        .symbol-link {
            color: var(--text-main);
            text-decoration: none;
            font-weight: bold;
        }

        .symbol-link:hover {
            color: var(--yellow);
        }

        .stat {
            font-size: 0.9rem;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>幣安 USDT 永續合約 (1H MA20 條件篩選)</h1>
        <div class="controls">
            <span id="status" class="stat">準備就緒</span>
            <button id="scanBtn" onclick="startScan()">開始掃描</button>
        </div>
    </div>

    <div class="filter-group">
        <button class="filter-btn active" onclick="setFilter('ALL')">全部 (大於 20MA)</button>
        <button class="filter-btn" onclick="setFilter('ABOVE_5MA')">🟢 在 5MA 上方</button>
        <button class="filter-btn" onclick="setFilter('BELOW_5MA')">🟡 在 5MA 下方 (回踩)</button>
    </div>

    <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>

    <table>
        <thead>
            <tr>
                <th>幣種名稱</th>
                <th>最新價格</th>
                <th>1H 20MA</th>
                <th>1H 5MA</th>
                <th>5MA 狀態濾網</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="resultTable">
            <tr>
                <td colspan="6" style="text-align: center; color: var(--text-sub);">點擊「開始掃描」以獲取資料...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    let rawResults = [];
    let currentFilter = 'ALL';

    // 計算簡單移動平均 (SMA)
    function calculateSMA(data, count) {
        const avg = data.slice(-count).reduce((sum, val) => sum + val, 0) / count;
        return avg;
    }

    // 取得所有 USDT 永續合約幣種
    async function getUSDTFuturesSymbols() {
        const res = await fetch('https://fapi.binance.com/fapi/v1/exchangeInfo');
        const data = await res.json();
        return data.symbols
            .filter(s => s.quoteAsset === 'USDT' && s.contractType === 'PERPETUAL' && s.status === 'TRADING')
            .map(s => s.symbol);
    }

    // 獲取單一幣種 K 線並計算 MA
    async function fetchKlineData(symbol) {
        try {
            const res = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=1h&limit=30`);
            const data = await res.json();
            
            // 取得收盤價陣列
            const closes = data.map(k => parseFloat(k[4]));
            const currentClose = closes[closes.length - 1];
            
            const ma20 = calculateSMA(closes, 20);
            const ma5 = calculateSMA(closes, 5);

            // 核心篩選條件：1H 收盤價必須在 20MA 上方
            if (currentClose > ma20) {
                return {
                    symbol: symbol,
                    price: currentClose,
                    ma20: ma20,
                    ma5: ma5,
                    isAboveMa5: currentClose >= ma5
                };
            }
            return null;
        } catch (e) {
            return null;
        }
    }

    // 開始掃描任務
    async function startScan() {
        const scanBtn = document.getElementById('scanBtn');
        const statusEl = document.getElementById('status');
        const progressEl = document.getElementById('progress');
        
        scanBtn.disabled = true;
        rawResults = [];
        renderTable();

        statusEl.innerText = "獲取合約清單...";
        const symbols = await getUSDTFuturesSymbols();
        
        const batchSize = 10; // 控制併發請求量，防止 Binance API 限流
        let processed = 0;

        for (let i = 0; i < symbols.length; i += batchSize) {
            const batch = symbols.slice(i, i + batchSize);
            const promises = batch.map(sym => fetchKlineData(sym));
            const results = await Promise.all(promises);

            results.forEach(res => {
                if (res) rawResults.push(res);
            });

            processed += batch.length;
            const pct = Math.floor((processed / symbols.length) * 100);
            progressEl.style.width = `${pct}%`;
            statusEl.innerText = `掃描中: ${processed} / ${symbols.length}`;
        }

        statusEl.innerText = `掃描完成！符合條件: ${rawResults.length} 個`;
        scanBtn.disabled = false;
        renderTable();
    }

    // 切換濾網頁籤
    function setFilter(filter) {
        currentFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        renderTable();
    }

    // 渲染表格內容
    function renderTable() {
        const tbody = document.getElementById('resultTable');
        
        let filtered = rawResults.filter(item => {
            if (currentFilter === 'ABOVE_5MA') return item.isAboveMa5;
            if (currentFilter === 'BELOW_5MA') return !item.isAboveMa5;
            return true;
        });

        // 優先依據距離 20MA 比例或 5MA 狀態排序
        filtered.sort((a, b) => (b.price / b.ma20) - (a.price / a.ma20));

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-sub);">無符合條件的數據</td></tr>`;
            return;
        }

        tbody.innerHTML = filtered.map(item => `
            <tr>
                <td><a class="symbol-link" href="https://www.binance.com/zh-TC/futures/${item.symbol}" target="_blank">${item.symbol}</a></td>
                <td>${item.price}</td>
                <td>${item.ma20.toFixed(4)}</td>
                <td>${item.ma5.toFixed(4)}</td>
                <td>
                    ${item.isAboveMa5 
                        ? `<span class="badge badge-above">在 5MA 上方 (強勢)</span>` 
                        : `<span class="badge badge-below">在 5MA 下方 (回踩)</span>`}
                </td>
                <td><a href="https://www.binance.com/zh-TC/futures/${item.symbol}" target="_blank" style="color: var(--yellow);">開啟 K 線</a></td>
            </tr>
        `).map(row => row).join('');
    }
</script>

</body>
</html>
