<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fox時間波動能 - 極速 Terminal Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

        :root {
            --bg-color: #080a0c;
            --card-bg: #12161c;
            --card-hover: #1a2029;
            --card-border: rgba(255, 255, 255, 0.07);
            --text-main: #f0f4f8;
            --text-sub: #828f9e;
            --yellow: #f0b90b;
            --yellow-glow: rgba(240, 185, 11, 0.25);
            --green: #0ecb81;
            --green-bg: rgba(14, 203, 129, 0.12);
            --red: #f6465d;
            --red-bg: rgba(246, 70, 93, 0.12);
            --orange: #ff9800;
            --orange-bg: rgba(255, 152, 0, 0.12);
            --blue: #2196f3;
            --blue-bg: rgba(33, 150, 243, 0.12);
            --purple: #b388ff;
            --purple-bg: rgba(179, 136, 255, 0.15);
            --purple-border: rgba(179, 136, 255, 0.4);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding-bottom: 80px; 
            -webkit-font-smoothing: antialiased;
        }

        /* 頂部導覽列 */
        .app-header { 
            position: sticky; top: 0; z-index: 100; 
            background-color: rgba(18, 22, 28, 0.85); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            padding: 12px 16px; 
            border-bottom: 1px solid var(--card-border); 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .header-title { 
            font-weight: 800; font-size: 1.05rem; letter-spacing: -0.3px;
            display: flex; align-items: center; gap: 8px; 
            background: linear-gradient(135deg, #ffffff 30%, var(--yellow) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .scan-btn { 
            background: linear-gradient(135deg, var(--yellow), #f39c12); 
            color: #000; border: none; 
            padding: 8px 18px; border-radius: 20px; font-weight: 700; 
            font-size: 0.85rem; cursor: pointer; 
            box-shadow: 0 4px 12px var(--yellow-glow);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .scan-btn:active { transform: scale(0.94); }
        .scan-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

        /* 進度條 */
        .progress-bar { height: 2px; background: rgba(255,255,255,0.05); width: 100%; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--yellow), var(--green)); transition: width 0.15s ease-out; }
        
        /* Dashboard 數據統計卡片 */
        .dashboard {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
            padding: 12px 16px 4px 16px;
        }
        .stat-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 10px; padding: 8px 10px; text-align: center;
        }
        .stat-card .val { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; font-weight: 700; color: #fff; }
        .stat-card .lbl { font-size: 0.65rem; color: var(--text-sub); margin-top: 2px; font-weight: 500; }
        .stat-card.perfect .val { color: var(--purple); }

        /* 工具列 */
        .toolbar { padding: 8px 16px 12px 16px; display: flex; gap: 8px; align-items: center; }
        .search-wrapper { position: relative; flex: 1; display: flex; align-items: center; }
        .search-input { 
            width: 100%; background: var(--card-bg); border: 1px solid var(--card-border); 
            color: var(--text-main); padding: 8px 30px 8px 12px; border-radius: 10px; 
            font-size: 0.85rem; transition: all 0.2s;
        }
        .search-input:focus { border-color: var(--yellow); box-shadow: 0 0 0 2px var(--yellow-glow); }
        .clear-btn { position: absolute; right: 10px; background: none; border: none; color: var(--text-sub); cursor: pointer; font-size: 0.9rem; display: none; }
        
        .tool-btn { 
            background: var(--card-bg); border: 1px solid var(--card-border); 
            color: var(--text-sub); padding: 8px 12px; border-radius: 10px; 
            font-size: 0.75rem; cursor: pointer; font-weight: 600; white-space: nowrap; 
            transition: all 0.2s;
        }
        .tool-btn:hover { color: var(--text-main); border-color: var(--text-sub); }

        .status-bar { padding: 0 16px 8px 16px; font-size: 0.75rem; color: var(--text-sub); display: flex; justify-content: space-between; align-items: center; }
        .container { padding: 0 16px; }
        
        /* 幣種卡片 */
        .symbol-card { 
            background-color: var(--card-bg); border: 1px solid var(--card-border); 
            border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; 
            display: flex; justify-content: space-between; align-items: center; 
            text-decoration: none; color: inherit; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .symbol-card:hover { transform: translateY(-2px); border-color: rgba(240, 185, 11, 0.4); background-color: var(--card-hover); }
        .symbol-card:active { transform: scale(0.98); }

        .symbol-info .name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .symbol-info .name { font-size: 1.1rem; font-weight: 800; letter-spacing: 0.3px; }
        
        .symbol-metrics { text-align: right; }
        .symbol-metrics .price { font-size: 1.05rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
        
        /* 標籤 Badge 樣式 */
        .badge-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
        .badge { font-size: 0.65rem; padding: 3px 8px; border-radius: 6px; font-weight: 700; display: inline-flex; align-items: center; gap: 3px; }
        .badge-breakout { background-color: var(--blue-bg); color: var(--blue); border: 1px solid rgba(33, 150, 243, 0.3); }
        .badge-volume { background-color: var(--orange-bg); color: var(--orange); border: 1px solid rgba(255, 152, 0, 0.3); }
        .badge-perfect { 
            background: linear-gradient(135deg, rgba(156, 39, 176, 0.25), rgba(240, 185, 11, 0.25)); 
            color: #e0b0ff; border: 1px solid var(--purple-border); 
            box-shadow: 0 0 10px rgba(179, 136, 255, 0.2);
            animation: pulse 2s infinite;
        }
        .badge-ema { background-color: rgba(255,255,255,0.05); color: var(--text-sub); border: 1px solid var(--card-border); }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(179, 136, 255, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(179, 136, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(179, 136, 255, 0); }
        }

        .change-badge { font-size: 0.75rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; }
        .change-up { color: var(--green); background-color: var(--green-bg); }
        .change-down { color: var(--red); background-color: var(--red-bg); }
        
        /* 底部導覽列 */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; height: 65px; 
            background-color: rgba(18, 22, 28, 0.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--card-border); display: flex; z-index: 100; padding: 0 6px;
        }
        .nav-item { 
            flex: 1; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; color: var(--text-sub); 
            font-size: 0.65rem; cursor: pointer; border: none; background: none; 
            padding: 6px 0; transition: all 0.2s; border-radius: 8px;
        }
        .nav-item.active { color: var(--yellow); font-weight: 700; }
        .nav-icon { font-size: 1.2rem; margin-bottom: 2px; transition: transform 0.2s; }
        .nav-item.active .nav-icon { transform: translateY(-2px); }
        
        /* 說明卡片 */
        .about-card { 
            background-color: var(--card-bg); border: 1px solid var(--card-border); 
            border-left: 4px solid var(--yellow); border-radius: 14px; padding: 18px; margin-top: 10px;
        }
        .about-card.strategy { border-left-color: var(--green); }
        .about-title { font-size: 1rem; font-weight: 700; color: var(--yellow); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        .about-card.strategy .about-title { color: var(--green); }
        .about-content { font-size: 0.85rem; color: #cbd5e1; line-height: 1.7; }
        .about-content ul { padding-left: 18px; margin: 0; }
        .about-content li { margin-bottom: 10px; }
        .empty-tip { text-align: center; padding: 60px 0; color: var(--text-sub); font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="header-title">🦊 Fox時間波動能 Pro</div>
        <button id="scanBtn" class="scan-btn" onclick="startScan()">極速掃描</button>
    </div>

    <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>

    <!-- 數據概覽 Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="stat-card">
            <div class="val" id="statTotal">0</div>
            <div class="lbl">掃描池</div>
        </div>
        <div class="stat-card">
            <div class="val" id="statEma">0</div>
            <div class="lbl">EMA多頭</div>
        </div>
        <div class="stat-card">
            <div class="val" id="statBreak">0</div>
            <div class="lbl">123突破</div>
        </div>
        <div class="stat-card perfect">
            <div class="val" id="statPerfect">0</div>
            <div class="lbl">完美共振</div>
        </div>
    </div>

    <div class="toolbar" id="toolbar">
        <div class="search-wrapper">
            <input type="text" id="searchInput" class="search-input" placeholder="搜尋幣種 (例: BTC)..." oninput="onSearchInput()">
            <button id="clearBtn" class="clear-btn" onclick="clearSearch()">✕</button>
        </div>
        <button class="tool-btn" id="sortBtn" onclick="toggleSort()">漲幅 ⬇</button>
    </div>

    <div class="status-bar" id="statusBar">
        <span id="statusText">請點擊「極速掃描」開始運算</span>
        <span id="countText">符合 0 筆</span>
    </div>

    <div class="container" id="symbolList"></div>

    <div class="bottom-nav">
        <button class="nav-item active" onclick="setFilter('ALL', this)"><div class="nav-icon">🌐</div><div>全部多頭</div></button>
        <button class="nav-item" onclick="setFilter('PERFECT', this)"><div class="nav-icon">🔥</div><div>全滿足訊號</div></button>
        <button class="nav-item" onclick="setFilter('BREAKOUT', this)"><div class="nav-icon">⚡</div><div>123突破</div></button>
        <button class="nav-item" onclick="setFilter('VOLUME', this)"><div class="nav-icon">🌊</div><div>量能爆發</div></button>
        <button class="nav-item" onclick="setFilter('INFO', this)"><div class="nav-icon">ℹ️</div><div>說明</div></button>
    </div>

<script>
    let rawResults = [];
    let currentFilter = 'ALL';
    let ticker24hMap = {};
    let sortDesc = true;
    let isScanning = false;
    let totalSymbolCount = 0;

    // 優化超時設定為 2.5 秒，快速放棄卡頓請求
    async function fetchWithTimeout(url, timeoutMs = 2500) {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeoutMs);
        try {
            const response = await fetch(url, { signal: controller.signal });
            clearTimeout(id);
            if (response.ok) return await response.json();
        } catch (e) { clearTimeout(id); }
        return null;
    }

    // 計算 EMA 效能優化版
    function calculateEMA(closes, period) {
        const len = closes.length;
        if (len < period) return 0;
        const k = 2 / (period + 1);
        let ema = 0;
        for (let i = 0; i < period; i++) ema += closes[i];
        ema /= period;
        for (let i = period; i < len; i++) {
            ema = (closes[i] * k) + (ema * (1 - k));
        }
        return ema;
    }

    async function fetch24hTickers() { 
        const data = await fetchWithTimeout('https://fapi.binance.com/fapi/v1/ticker/24hr', 3000); 
        if (!data || !Array.isArray(data)) return {};
        const map = {}; 
        for (let i = 0; i < data.length; i++) {
            map[data[i].symbol] = parseFloat(data[i].priceChangePercent);
        }
        return map; 
    }

    async function getUSDTFuturesSymbols() { 
        const data = await fetchWithTimeout('https://fapi.binance.com/fapi/v1/exchangeInfo', 3000); 
        if (!data || !data.symbols) return [];
        return data.symbols
            .filter(s => s.quoteAsset === 'USDT' && s.contractType === 'PERPETUAL' && s.status === 'TRADING')
            .map(s => s.symbol); 
    }

    // 核心單幣分析：直接抓取 15m K 線 (limit 220 筆)，大幅降低下載量與運算複雜度
    async function processSymbol(symbol) {
        try {
            const res15m = await fetchWithTimeout(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=15m&limit=220`);
            if (!res15m || res15m.length < 220) return null;

            const len = res15m.length;
            const closes = new Float64Array(len);
            for (let i = 0; i < len; i++) closes[i] = parseFloat(res15m[i][4]);

            const currentPrice = closes[len - 1];

            const ema20 = calculateEMA(closes, 20);
            const ema50 = calculateEMA(closes, 50);
            const ema200 = calculateEMA(closes, 200);

            // 第一道過濾：EMA 多頭排列
            if (!(ema20 > ema50 && ema50 > ema200 && currentPrice >= ema20)) return null;

            // 第二道過濾：前 20 根 K 線突破
            let prevHigh = parseFloat(res15m[len - 21][2]);
            let sumVol = 0;
            for (let i = len - 21; i < len - 1; i++) {
                const h = parseFloat(res15m[i][2]);
                if (h > prevHigh) prevHigh = h;
                sumVol += parseFloat(res15m[i][5]);
            }
            const isBreakout123 = currentPrice > prevHigh;

            // 第三道過濾：波動能爆發 (成交量 1.8 倍)
            const latestBar = res15m[len - 1];
            const openPrice = parseFloat(latestBar[1]);
            const highPrice = parseFloat(latestBar[2]);
            const lowPrice = parseFloat(latestBar[3]);
            const volume = parseFloat(latestBar[5]);

            const avgVolume = sumVol / 20;
            const isVolumeSurge = (volume >= avgVolume * 1.8) && 
                                  (currentPrice > openPrice) && 
                                  ((currentPrice - openPrice) / (highPrice - lowPrice || 1) >= 0.6);

            return { 
                symbol, 
                price: currentPrice, 
                isEmaBullish: true,
                isBreakout123,
                isVolumeSurge,
                priceChange24h: ticker24hMap[symbol] || 0 
            };
        } catch (e) { return null; }
    }

    // 提升併發至 15，多批次平行處理（Chunking Engine）
    async function runFastScanner(symbols, chunkSize = 15, onProgress) {
        let completed = 0;
        const results = [];

        for (let i = 0; i < symbols.length; i += chunkSize) {
            const chunk = symbols.slice(i, i + chunkSize);
            const chunkResults = await Promise.all(chunk.map(s => processSymbol(s)));
            
            for (let r of chunkResults) {
                if (r) results.push(r);
            }
            completed += chunk.length;
            onProgress(completed, symbols.length);
        }
        return results;
    }

    function updateDashboard() {
        document.getElementById('statTotal').innerText = totalSymbolCount;
        document.getElementById('statEma').innerText = rawResults.length;
        document.getElementById('statBreak').innerText = rawResults.filter(r => r.isBreakout123).length;
        document.getElementById('statPerfect').innerText = rawResults.filter(r => r.isBreakout123 && r.isVolumeSurge).length;
    }

    async function startScan() {
        if (isScanning) return;
        isScanning = true;

        const btn = document.getElementById('scanBtn');
        const statusText = document.getElementById('statusText');
        btn.disabled = true; btn.innerText = "極速掃描中"; 
        statusText.innerText = "初始化行情連線...";
        rawResults = [];
        
        ticker24hMap = await fetch24hTickers();
        const symbols = await getUSDTFuturesSymbols();
        totalSymbolCount = symbols.length;
        
        if (symbols.length === 0) {
            statusText.innerText = "連線失敗，請檢查網路環境";
            btn.disabled = false; btn.innerText = "極速掃描";
            isScanning = false;
            return;
        }

        let lastRenderTime = 0;

        rawResults = await runFastScanner(symbols, 15, (completed, total) => {
            const pct = Math.floor((completed / total) * 100);
            document.getElementById('progress').style.width = `${pct}%`;
            statusText.innerText = `極速計算中 (${completed}/${total})...`;

            const now = Date.now();
            if (now - lastRenderTime > 250) {
                lastRenderTime = now;
                updateDashboard();
                if (currentFilter !== 'INFO') renderList();
            }
        });

        updateDashboard();
        statusText.innerText = "掃描完畢，即時數據已更新";
        btn.disabled = false; btn.innerText = "極速掃描";
        isScanning = false;
        if (currentFilter !== 'INFO') renderList();
    }

    function toggleSort() { 
        sortDesc = !sortDesc; 
        document.getElementById('sortBtn').innerText = sortDesc ? "漲幅 ⬇" : "漲幅 ⬆";
        renderList(); 
    }

    function onSearchInput() {
        const input = document.getElementById('searchInput');
        document.getElementById('clearBtn').style.display = input.value ? 'block' : 'none';
        renderList();
    }

    function clearSearch() {
        const input = document.getElementById('searchInput');
        input.value = '';
        document.getElementById('clearBtn').style.display = 'none';
        renderList();
    }

    function setFilter(filter, el) { 
        currentFilter = filter; 
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active')); 
        el.classList.add('active'); 
        if (filter === 'INFO') { 
            document.getElementById('toolbar').style.display = 'none'; 
            document.getElementById('statusBar').style.display = 'none'; 
            document.getElementById('dashboard').style.display = 'none';
            renderInfoPage(); 
        } else { 
            document.getElementById('toolbar').style.display = 'flex'; 
            document.getElementById('statusBar').style.display = 'flex'; 
            document.getElementById('dashboard').style.display = 'grid';
            renderList(); 
        } 
    }

    function getFilteredData() {
        const query = document.getElementById('searchInput').value.toUpperCase().trim();
        return rawResults.filter(item => item.symbol.includes(query)).filter(item => {
            if (currentFilter === 'PERFECT') return item.isBreakout123 && item.isVolumeSurge;
            if (currentFilter === 'BREAKOUT') return item.isBreakout123;
            if (currentFilter === 'VOLUME') return item.isVolumeSurge;
            return true;
        });
    }

    function renderInfoPage() {
        document.getElementById('symbolList').innerHTML = `
            <div class="about-card strategy">
                <div class="about-title">🦊 Fox時間波動能 - 漏斗式三重訊號系統</div>
                <div class="about-content">
                    <ul>
                        <li><b>1號門檻（基礎多頭）：</b>必須率先滿足 <b>EMA 20 > EMA 50 > EMA 200</b> 且最新價格在 EMA 20 上方。未滿足此條件者會直接被濾除。</li>
                        <li><b>2號訊號 (123法則突破)：</b>價格強勢<b>突破前 20 根 15M K 線的最高價</b>，代表結構轉折突破，主升段觸發。</li>
                        <li><b>3號訊號 (波動能爆發)：</b>成交量達到前 20 根均量的 <b>1.8 倍以上</b>，且收在陽棒實體高位，代表主力資金爆量拉升。</li>
                        <li><b>🔥 全滿足訊號 (完美共振)：</b>同時滿足【EMA多頭 + 123突破 + 爆量噴發】，為勝率最高的主攻標的！</li>
                    </ul>
                </div>
            </div>
        `;
    }

    function renderList() {
        const container = document.getElementById('symbolList');
        let data = getFilteredData();
        data.sort((a, b) => sortDesc ? b.priceChange24h - a.priceChange24h : a.priceChange24h - b.priceChange24h);
        
        document.getElementById('countText').innerText = `顯示 ${data.length} / 符合 ${rawResults.length} 筆`;

        if (data.length === 0) {
            container.innerHTML = `<div class="empty-tip">${rawResults.length === 0 ? '點擊右上角「極速掃描」開始運算' : '無符合條件的標的'}</div>`;
            return;
        }

        container.innerHTML = data.map(item => {
            const isPerfect = item.isBreakout123 && item.isVolumeSurge;
            return `
            <a class="symbol-card" href="https://www.binance.com/zh-TC/futures/${item.symbol}" target="_blank">
                <div class="symbol-info">
                    <div class="name-row">
                        <span class="name">${item.symbol.replace('USDT', '')}</span>
                        <span class="change-badge ${item.priceChange24h >= 0 ? 'change-up' : 'change-down'}">
                            ${item.priceChange24h >= 0 ? '+' : ''}${item.priceChange24h.toFixed(2)}%
                        </span>
                    </div>
                    <div class="badge-list">
                        ${isPerfect ? '<span class="badge badge-perfect">🔥 完美共振 (突破+爆量)</span>' : ''}
                        ${!isPerfect && item.isBreakout123 ? '<span class="badge badge-breakout">⚡ 123結構突破</span>' : ''}
                        ${!isPerfect && item.isVolumeSurge ? '<span class="badge badge-volume">🌊 波動能爆發</span>' : ''}
                        ${!item.isBreakout123 && !item.isVolumeSurge ? '<span class="badge badge-ema">🌐 EMA多頭順勢</span>' : ''}
                    </div>
                </div>
                <div class="symbol-metrics">
                    <div class="price">${item.price}</div>
                </div>
            </a>
            `;
        }).join('');
    }
</script>
</body>
</html>
