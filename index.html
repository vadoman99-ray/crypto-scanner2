<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>加密貨幣多週期共振掃描器</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f121d] text-gray-200 min-h-screen p-4 flex justify-center items-center font-sans">

  <!-- 主容器 -->
  <div class="w-full max-w-md bg-[#131722] rounded-xl p-4 shadow-2xl border border-gray-800 space-y-4">
    
    <!-- 頂部標題區 -->
    <div class="border-b border-gray-800 pb-3">
      <div class="flex items-center gap-2 text-xl font-bold text-white">
        <span class="text-amber-400">⚡</span>
        <span>加密貨幣共振掃描</span>
      </div>
      <div class="flex justify-between items-center text-xs text-gray-400 mt-1">
        <span>掃描更新：<span id="update-time">載入中...</span></span>
        <span>自動更新：每 60 秒</span>
      </div>
    </div>

    <!-- 1. 15分 + 1小時 共振多頭區塊 -->
    <div class="bg-[#181c28] rounded-lg p-3 border border-gray-800/60">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2 text-cyan-400 font-bold">
          <span>⚡</span>
          <span>15M + 1H 同步多頭趨勢</span>
        </div>
        <span class="text-[10px] bg-cyan-500/10 text-cyan-400 px-2 py-0.5 rounded border border-cyan-500/20">短線爆發</span>
      </div>
      
      <table class="w-full text-xs text-left border-collapse">
        <thead>
          <tr class="text-gray-400 border-b border-gray-800 pb-1">
            <th class="py-1">標的</th>
            <th class="text-right">價格</th>
            <th class="text-right">15M突破</th>
            <th class="text-right">1H突破</th>
            <th class="text-right">24H漲跌</th>
            <th class="text-right pr-1">強度</th>
          </tr>
        </thead>
        <tbody id="bull-15m1h-tbody" class="divide-y divide-gray-800/40">
          <tr>
            <td colspan="6" class="text-center py-4 text-gray-500">行情資料載入中...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 2. 1小時 + 4小時 共振多頭區塊 -->
    <div class="bg-[#181c28] rounded-lg p-3 border border-gray-800/60">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2 text-amber-400 font-bold">
          <span>🚀</span>
          <span>1H + 4H 同步多頭趨勢</span>
        </div>
        <span class="text-[10px] bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded border border-amber-500/20">中線趨勢</span>
      </div>
      
      <table class="w-full text-xs text-left border-collapse">
        <thead>
          <tr class="text-gray-400 border-b border-gray-800 pb-1">
            <th class="py-1">標的</th>
            <th class="text-right">價格</th>
            <th class="text-right">1H突破</th>
            <th class="text-right">4H突破</th>
            <th class="text-right">24H漲跌</th>
            <th class="text-right pr-1">強度</th>
          </tr>
        </thead>
        <tbody id="bull-1h4h-tbody" class="divide-y divide-gray-800/40">
          <tr>
            <td colspan="6" class="text-center py-4 text-gray-500">行情資料載入中...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 3. 1小時 + 4小時 + 8小時 共振多頭區塊 -->
    <div class="bg-[#181c28] rounded-lg p-3 border border-amber-500/30">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2 text-rose-400 font-bold">
          <span>🔥</span>
          <span>1H + 4H + 8H 同步多頭趨勢</span>
        </div>
        <span class="text-[10px] bg-rose-500/10 text-rose-400 px-2 py-0.5 rounded border border-rose-500/20">長線強共振</span>
      </div>
      
      <table class="w-full text-xs text-left border-collapse">
        <thead>
          <tr class="text-gray-400 border-b border-gray-800 pb-1">
            <th class="py-1">標的</th>
            <th class="text-right">價格</th>
            <th class="text-right">1H突破</th>
            <th class="text-right">4H突破</th>
            <th class="text-right">8H突破</th>
            <th class="text-right pr-1">強度</th>
          </tr>
        </thead>
        <tbody id="bull-1h4h8h-tbody" class="divide-y divide-gray-800/40">
          <tr>
            <td colspan="6" class="text-center py-4 text-gray-500">行情資料載入中...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 頁尾免責聲明 -->
    <div class="text-center text-[10px] text-gray-500 pt-2">
      資料來源：幣安公開 API。多週期共振代表特定時區價格皆位於 MA20 之上。
    </div>

  </div>

  <!-- 幣安 API 腳本 -->
  <script>
    const BINANCE_TICKER_URL = 'https://fapi.binance.com/fapi/v1/ticker/24hr';
    const BINANCE_KLINES_URL = 'https://fapi.binance.com/fapi/v1/klines';

    function calculateSMA(data, period) {
      if (data.length < period) return null;
      const slice = data.slice(-period);
      const sum = slice.reduce((acc, val) => acc + val, 0);
      return sum / period;
    }

    async function fetchTimeframeMADiff(symbol, currentPrice, interval, period = 20) {
      try {
        const res = await fetch(`${BINANCE_KLINES_URL}?symbol=${symbol}&interval=${interval}&limit=${period + 1}`);
        const data = await res.json();
        const closePrices = data.map(item => parseFloat(item[4]));
        const maValue = calculateSMA(closePrices, period);

        if (!maValue) return 0;
        return ((currentPrice - maValue) / maValue) * 100;
      } catch (err) {
        console.error(`無法取得 ${symbol} ${interval} 資料`, err);
        return 0;
      }
    }

    async function updateMarketScanner() {
      try {
        const res = await fetch(BINANCE_TICKER_URL);
        const tickers = await res.json();

        const usdtPairs = tickers
          .filter(t => t.symbol.endsWith('USDT') && !t.symbol.startsWith('USDC'))
          .sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
          .slice(0, 30);

        const marketData = await Promise.all(
          usdtPairs.map(async (item) => {
            const symbol = item.symbol.replace('USDT', '');
            const price = parseFloat(item.lastPrice);
            const change24h = parseFloat(item.priceChangePercent);
            
            // 平行抓取 15m, 1h, 4h, 8h 資料
            const [maDiff15m, maDiff1h, maDiff4h, maDiff8h] = await Promise.all([
              fetchTimeframeMADiff(item.symbol, price, '15m', 20),
              fetchTimeframeMADiff(item.symbol, price, '1h', 20),
              fetchTimeframeMADiff(item.symbol, price, '4h', 20),
              fetchTimeframeMADiff(item.symbol, price, '8h', 20)
            ]);
            
            return {
              symbol,
              price,
              change24h,
              maDiff15m,
              maDiff1h,
              maDiff4h,
              maDiff8h
            };
          })
        );

        // 1. 15M + 1H 同步多頭
        const list15m1h = marketData
          .filter(d => d.maDiff15m > 0 && d.maDiff1h > 0)
          .sort((a, b) => (b.maDiff15m + b.maDiff1h) - (a.maDiff15m + a.maDiff1h))
          .slice(0, 8);

        // 2. 1H + 4H 同步多頭
        const list1h4h = marketData
          .filter(d => d.maDiff1h > 0 && d.maDiff4h > 0)
          .sort((a, b) => (b.maDiff1h + b.maDiff4h) - (a.maDiff1h + a.maDiff4h))
          .slice(0, 8);

        // 3. 1H + 4H + 8H 同步多頭
        const list1h4h8h = marketData
          .filter(d => d.maDiff1h > 0 && d.maDiff4h > 0 && d.maDiff8h > 0)
          .sort((a, b) => (b.maDiff1h + b.maDiff4h + b.maDiff8h) - (a.maDiff1h + a.maDiff4h + a.maDiff8h))
          .slice(0, 8);

        // 渲染表格
        renderDualTable('bull-15m1h-tbody', list15m1h, '15m', '1h', 'bg-cyan-400');
        renderDualTable('bull-1h4h-tbody', list1h4h, '1h', '4h', 'bg-rose-500');
        renderTripleTable('bull-1h4h8h-tbody', list1h4h8h);
        
        document.getElementById('update-time').innerText = new Date().toLocaleTimeString('zh-TW', { hour12: false });

      } catch (error) {
        console.error('更新資料失敗:', error);
      }
    }

    function renderDualTable(elementId, dataList, tf1Key, tf2Key, barColorClass) {
      const tbody = document.getElementById(elementId);
      if (dataList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-3 text-gray-500">無符合共振標的</td></tr>`;
        return;
      }

      tbody.innerHTML = dataList.map(item => {
        const val1 = tf1Key === '15m' ? item.maDiff15m : item.maDiff1h;
        const val2 = tf2Key === '1h' ? item.maDiff1h : item.maDiff4h;
        const c24Class = item.change24h >= 0 ? 'text-rose-500' : 'text-emerald-400';
        const avgScore = (val1 + val2) / 2;
        const barWidth = Math.min(avgScore * 3, 16);

        return `
          <tr class="hover:bg-gray-800/20 transition-colors">
            <td class="py-2 font-medium underline underline-offset-2 decoration-gray-600">${item.symbol}</td>
            <td class="text-right">${item.price < 1 ? item.price.toFixed(4) : item.price.toFixed(2)}</td>
            <td class="text-right text-rose-500">+${val1.toFixed(2)}%</td>
            <td class="text-right text-rose-500">+${val2.toFixed(2)}%</td>
            <td class="text-right ${c24Class}">${item.change24h > 0 ? '+' : ''}${item.change24h.toFixed(2)}%</td>
            <td class="text-right pl-2">
              <span class="inline-block h-1.5 ${barColorClass} rounded-full" style="width: ${Math.max(barWidth, 6)}px"></span>
            </td>
          </tr>
        `;
      }).join('');
    }

    function renderTripleTable(elementId, dataList) {
      const tbody = document.getElementById(elementId);
      if (dataList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-3 text-gray-500">無三週期強共振標的</td></tr>`;
        return;
      }

      tbody.innerHTML = dataList.map(item => {
        const avgScore = (item.maDiff1h + item.maDiff4h + item.maDiff8h) / 3;
        const barWidth = Math.min(avgScore * 3, 16);

        return `
          <tr class="hover:bg-gray-800/20 transition-colors">
            <td class="py-2 font-medium underline underline-offset-2 decoration-gray-600">${item.symbol}</td>
            <td class="text-right">${item.price < 1 ? item.price.toFixed(4) : item.price.toFixed(2)}</td>
            <td class="text-right text-rose-500">+${item.maDiff1h.toFixed(2)}%</td>
            <td class="text-right text-rose-500">+${item.maDiff4h.toFixed(2)}%</td>
            <td class="text-right text-rose-500">+${item.maDiff8h.toFixed(2)}%</td>
            <td class="text-right pl-2">
              <span class="inline-block h-1.5 bg-amber-400 rounded-full" style="width: ${Math.max(barWidth, 6)}px"></span>
            </td>
          </tr>
        `;
      }).join('');
    }

    updateMarketScanner();
    setInterval(updateMarketScanner, 60000);
  </script>
</body>
</html>
