<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ 1H MA 多頭排列篩選器</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=JetBrains+Mono:wght@800&display=swap');

        :root {
            --manga-dark: #0a0e1a;
            --manga-navy: #121b2d;
            --manga-pink: #ff007f;
            --manga-purple: #a855f7;
            --manga-cyan: #00f0ff;
            --manga-yellow: #ffe600;
            --manga-green: #00ff66;
            --manga-red: #ff3366;
            --pop-shadow: 4px 4px 0px #000;
        }

        * { box-sizing: border-box; outline: none; }
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: var(--manga-dark); 
            background-image: radial-gradient(rgba(0, 240, 255, 0.15) 15%, transparent 16%);
            background-size: 16px 16px;
            color: #fff; margin: 0; padding-bottom: 40px; 
        }

        .app-header { 
            position: sticky; top: 0; z-index: 100; 
            background: #101424; border-bottom: 3px solid var(--manga-cyan); 
            padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.3);
        }
        .header-title { font-size: 1.05rem; font-weight: 900; color: #fff; text-shadow: 0 0 8px var(--manga-cyan); }
        .scan-btn { 
            background: linear-gradient(135deg, #ff007f 0%, #ff5500 100%); 
            color: #fff; border: 2px solid #fff; padding: 8px 16px; border-radius: 6px; 
            font-weight: 900; font-size: 0.9rem; cursor: pointer; box-shadow: var(--pop-shadow);
            transition: opacity 0.2s;
        }
        .scan-btn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }

        .progress-container { height: 6px; background: #090d16; width: 100%; margin-top: 0; }
        .progress-fill { height: 100%; width: 0%; background: var(--manga-cyan); transition: width 0.05s ease-out; }

        .dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 14px 16px; }
        .stat-card {
            background: rgba(18, 27, 45, 0.85); border: 2px solid var(--manga-cyan);
            border-radius: 8px; padding: 10px; text-align: center; box-shadow: var(--pop-shadow);
        }
        .stat-card .val { font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; font-weight: 900; }
        .stat-card.entry { border-color: var(--manga-pink); }
        .stat-card.entry .val { color: var(--manga-pink); }

        .container { padding: 0 16px; }
        .symbol-card { 
            background: rgba(20, 30, 50, 0.9); border: 2px solid #2a3a5c; 
            border-left: 6px solid var(--manga-green); border-radius: 8px; 
            padding: 12px 14px; margin-bottom: 12px; 
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: var(--pop-shadow); cursor: pointer; transition: transform 0.1s;
        }
        .symbol-card:hover { transform: translateY(-2px); border-color: var(--manga-cyan); }
        .symbol-name { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: 900; }
        .symbol-price { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; color: var(--manga-yellow); }
        .detail-row { font-size: 0.82rem; font-family: 'JetBrains Mono', monospace; color: #a0aec0; margin-top: 4px; }
        
        .badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: 900; background: var(--manga-green); color: #000; }
        .badge-rank { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; font-weight: 900; background: var(--manga-yellow); color: #000; }

        .modal-backdrop {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 8, 17, 0.85); backdrop-filter: blur(8px);
            z-index: 999; display: none; justify-content: center; align-items: center; padding: 16px;
        }
        .modal-card {
            background: var(--manga-navy); border: 2px solid var(--manga-cyan);
            border-radius: 12px; width: 100%; max-width: 520px; padding: 18px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
            max-height: 90vh; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        
        .chart-container {
            background: #070a12; border: 1px solid #2a3a5c; border-radius: 6px;
            padding: 8px; margin-bottom: 12px; position: relative;
        }
        .chart-title { font-size: 0.75rem; color: #a0aec0; margin-bottom: 4px; display: flex; justify-content: space-between; }
        canvas { width: 100%; height: 200px; display: block; }

        .info-box { background: #070a12; border: 1px solid #2a3a5c; padding: 10px; border-radius: 6px; }
        .info-row { display: flex; justify-content: space-between; font-size: 0.85rem; font-family: 'JetBrains Mono', monospace; margin-bottom: 6px; }
        .info-row:last-child { margin-bottom: 0; }
        
        .val-up { color: var(--manga-green); }
        .val-down { color: var(--manga-red); }
        .highlight-ma3 { color: var(--manga-green); font-weight: 900; }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="header-title">⚡ 1H 多頭排列篩選器</div>
        <button id="scanBtn" class="scan-btn" onclick="startScan()">啟動極速掃描</button>
    </div>

    <div class="progress-container"><div id="progress" class="progress-fill"></div></div>

    <div class="dashboard">
        <div class="stat-card">
            <div class="val" id="statTotal">0</div>
            <div style="font-size:0.75rem;">掃描目標數</div>
        </div>
        <div class="stat-card entry">
            <div class="val" id="statEntry">0</div>
            <div style="font-size:0.75rem;">符合條件標的</div>
        </div>
    </div>

    <div class="container" id="symbolList"></div>

    <div class="modal-backdrop" id="tradeModal" onclick="if(event.target.id==='tradeModal') closeModal()">
        <div class="modal-card">
            <div class="modal-header">
                <span id="modalSymbol" style="font-family:'JetBrains Mono'; font-weight:900; font-size:1.2rem;">BTCUSDT</span>
                <button onclick="closeModal()" style="background:var(--manga-pink); color:#fff; border:none; border-radius:4px; font-weight:900; padding:4px 8px; cursor:pointer;">✕</button>
            </div>
            
            <div class="chart-container">
                <div class="chart-title">
                    <span>1H 近 100 根 K 線圖</span>
                    <span style="font-weight:900;">
                        <span style="color:var(--manga-pink);">● 快線</span> 
                        <span style="color:var(--manga-purple);">● 中線</span> 
                        <span style="color:var(--manga-green);">● 慢線</span>
                    </span>
                </div>
                <canvas id="klineCanvas" width="480" height="200"></canvas>
            </div>

            <div class="info-box">
                <div class="info-row"><span>當前現價:</span><b id="valPrice" style="color:var(--manga-yellow);">0</b></div>
                <div class="info-row"><span>距慢線幅度 (排行):</span><b id="valMa3Dist" class="highlight-ma3">0%</b></div>
                <div class="info-row"><span>24H 漲跌幅:</span><b id="val24hChange">0%</b></div>
                <div class="info-row"><span>快線:</span><b id="valMA1" style="color:var(--manga-pink);">0</b></div>
                <div class="info-row"><span>中線:</span><b id="valMA2" style="color:var(--manga-purple);">0</b></div>
                <div class="info-row"><span>慢線:</span><b id="valMA3" style="color:var(--manga-green);">0</b></div>
            </div>
        </div>
    </div>

<script>
    const API_BASE = 'https://fapi.binance.com';
    let rawResults = [];
    let currentItem = null;
    let tickerMap = {};

    const P1 = 30;
    const P2 = 45;
    const P3 = 60;
    const DISPLAY_COUNT = 100;

    async function asyncPool(poolLimit, array, iteratorFn) {
        const ret = [];
        const executing = new Set();
        for (const item of array) {
            const p = Promise.resolve().then(() => iteratorFn(item));
            ret.push(p);
            executing.add(p);
            const clean = () => executing.delete(p);
            p.then(clean, clean);
            if (executing.size >= poolLimit) {
                await Promise.race(executing);
            }
        }
        return Promise.all(ret);
    }

    function calculateAllSMA(closes, periods) {
        const result = {};
        const len = closes.length;

        for (const p of periods) {
            if (len < p) {
                result[p] = new Array(len).fill(null);
                continue;
            }
            const ma = new Array(len).fill(null);
            let sum = 0;
            for (let i = 0; i < p; i++) sum += closes[i];
            ma[p - 1] = sum / p;

            for (let i = p; i < len; i++) {
                sum += closes[i] - closes[i - p];
                ma[i] = sum / p;
            }
            result[p] = ma;
        }
        return result;
    }

    async function evaluateSymbolMA(symbol, updateProgress) {
        try {
            const fetchLimit = DISPLAY_COUNT + P3;
            const res = await fetch(`${API_BASE}/fapi/v1/klines?symbol=${symbol}&interval=1h&limit=${fetchLimit}`);
            updateProgress();
            if (!res.ok) return null;

            const klinesRaw = await res.json();
            const totalLen = klinesRaw.length;
            if (totalLen < P3) return null;

            const closes = klinesRaw.map(k => parseFloat(k[4]));
            const price = closes[totalLen - 1];

            const fullMas = calculateAllSMA(closes, [P1, P2, P3]);
            const ma1 = fullMas[P1][totalLen - 1];
            const ma2 = fullMas[P2][totalLen - 1];
            const ma3 = fullMas[P3][totalLen - 1];

            if (ma1 > ma2 && ma2 > ma3 && price >= ma3) {
                const ma3DistPercent = ((price - ma3) / ma3) * 100;
                const priceChange24h = tickerMap[symbol] ? parseFloat(tickerMap[symbol].priceChangePercent) : 0;

                const displayKlines = klinesRaw.slice(-DISPLAY_COUNT);
                const displayMas = {
                    [P1]: fullMas[P1].slice(-DISPLAY_COUNT),
                    [P2]: fullMas[P2].slice(-DISPLAY_COUNT),
                    [P3]: fullMas[P3].slice(-DISPLAY_COUNT)
                };

                return { 
                    symbol, 
                    price, 
                    ma1, 
                    ma2, 
                    ma3, 
                    ma3DistPercent, 
                    priceChange24h, 
                    klines: displayKlines, 
                    maSeries: displayMas 
                };
            }
            return null;
        } catch {
            updateProgress();
            return null;
        }
    }

    async function startScan() {
        const btn = document.getElementById('scanBtn');
        btn.disabled = true; btn.innerText = "⚡ 全網初篩中...";
        rawResults = [];
        tickerMap = {};
        document.getElementById('symbolList').innerHTML = '';

        const tickers = await fetch(`${API_BASE}/fapi/v1/ticker/24hr`).then(r => r.json());
        tickers.forEach(t => { tickerMap[t.symbol] = t; });

        const candidateSymbols = tickers.filter(t => 
            t.symbol.endsWith('USDT') && 
            parseFloat(t.priceChangePercent) > 0 && 
            parseFloat(t.quoteVolume) > 10000000
        ).map(t => t.symbol);

        document.getElementById('statTotal').innerText = candidateSymbols.length;

        let completed = 0;
        const updateProgress = () => {
            completed++;
            document.getElementById('progress').style.width = `${(completed / candidateSymbols.length) * 100}%`;
        };

        btn.innerText = "🔍 閃電計算 1H 均線中...";
        const results = await asyncPool(50, candidateSymbols, sym => evaluateSymbolMA(sym, updateProgress));

        rawResults = results.filter(Boolean).sort((a, b) => b.ma3DistPercent - a.ma3DistPercent);
        document.getElementById('statEntry').innerText = rawResults.length;

        btn.disabled = false; btn.innerText = "啟動極速掃描";
        renderList();
    }

    function renderList() {
        const container = document.getElementById('symbolList');
        if (rawResults.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:40px; color:#5a7094; font-weight:900;">無符合多頭排列標的</div>`;
            return;
        }

        const fragment = document.createDocumentFragment();
        rawResults.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'symbol-card';
            card.onclick = () => openModal(item.symbol);

            const chg24Class = item.priceChange24h >= 0 ? 'val-up' : 'val-down';
            const chg24Sign = item.priceChange24h >= 0 ? '+' : '';

            const dist3Class = item.ma3DistPercent >= 0 ? 'val-up' : 'val-down';
            const dist3Sign = item.ma3DistPercent >= 0 ? '+' : '';

            let rankTag = `<span class="badge-rank">#${index + 1}</span>`;
            if (index === 0) rankTag = `<span class="badge-rank" style="background:#ffd700;">🏆 TOP 1</span>`;
            else if (index === 1) rankTag = `<span class="badge-rank" style="background:#c0c0c0;">🥈 TOP 2</span>`;
            else if (index === 2) rankTag = `<span class="badge-rank" style="background:#cd7f32; color:#fff;">🥉 TOP 3</span>`;

            card.innerHTML = `
                <div style="flex: 1;">
                    <div style="display:flex; align-items:center; gap:8px;">
                        ${rankTag}
                        <span class="symbol-name">${item.symbol.replace('USDT','')}</span>
                        <span class="badge">均線幅度排行</span>
                    </div>
                    <div class="detail-row">
                        <b class="highlight-ma3">距慢線: <span class="${dist3Class}">${dist3Sign}${item.ma3DistPercent.toFixed(2)}%</span></b>
                    </div>
                    <div class="detail-row" style="opacity: 0.8;">
                        24H 漲跌: <span class="${chg24Class}">${chg24Sign}${item.priceChange24h.toFixed(2)}%</span>
                    </div>
                </div>
                <div style="text-align:right;">
                    <div class="symbol-price">${item.price}</div>
                </div>
            `;
            fragment.appendChild(card);
        });

        container.innerHTML = '';
        container.appendChild(fragment);
    }

    function drawChart(item) {
        const canvas = document.getElementById('klineCanvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        ctx.clearRect(0, 0, width, height);

        const klines = item.klines;
        const displayCount = klines.length;

        let minPrice = Infinity;
        let maxPrice = -Infinity;

        for (let i = 0; i < displayCount; i++) {
            const high = parseFloat(klines[i][2]);
            const low = parseFloat(klines[i][3]);
            if (high > maxPrice) maxPrice = high;
            if (low < minPrice) minPrice = low;
        }

        const padding = 15;
        const chartHeight = height - padding * 2;
        const priceRange = maxPrice - minPrice || 1;

        const getY = (price) => height - padding - ((price - minPrice) / priceRange) * chartHeight;
        const candleWidth = (width / displayCount) * 0.7;
        const stepX = width / displayCount;

        const upPath = new Path2D();
        const downPath = new Path2D();

        klines.forEach((k, idx) => {
            const open = parseFloat(k[1]);
            const high = parseFloat(k[2]);
            const low = parseFloat(k[3]);
            const close = parseFloat(k[4]);

            const x = idx * stepX + stepX / 2;
            const isUp = close >= open;
            const targetPath = isUp ? upPath : downPath;

            targetPath.moveTo(x, getY(high));
            targetPath.lineTo(x, getY(low));

            const topY = getY(Math.max(open, close));
            const bottomY = getY(Math.min(open, close));
            const h = Math.max(2, bottomY - topY);
            targetPath.rect(x - candleWidth / 2, topY, candleWidth, h);
        });

        ctx.strokeStyle = '#00ff66';
        ctx.fillStyle = '#00ff66';
        ctx.stroke(upPath);
        ctx.fill(upPath);

        ctx.strokeStyle = '#ff3366';
        ctx.fillStyle = '#ff3366';
        ctx.stroke(downPath);
        ctx.fill(downPath);

        const drawMA = (maValues, color) => {
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            let started = false;

            for (let i = 0; i < displayCount; i++) {
                const maVal = maValues[i];
                if (maVal !== null) {
                    const x = i * stepX + stepX / 2;
                    const y = getY(maVal);
                    if (!started) {
                        ctx.moveTo(x, y);
                        started = true;
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
            }
            ctx.stroke();
        };

        drawMA(item.maSeries[P1], '#ff007f');
        drawMA(item.maSeries[P2], '#a855f7');
        drawMA(item.maSeries[P3], '#00ff66');
    }

    function openModal(symbol) {
        currentItem = rawResults.find(r => r.symbol === symbol);
        if (!currentItem) return;

        document.getElementById('modalSymbol').innerText = symbol;
        document.getElementById('valPrice').innerText = currentItem.price.toFixed(4);

        const dist3El = document.getElementById('valMa3Dist');
        const dist3Sign = currentItem.ma3DistPercent >= 0 ? '+' : '';
        dist3El.innerText = `${dist3Sign}${currentItem.ma3DistPercent.toFixed(2)}%`;

        const chgEl = document.getElementById('val24hChange');
        const chgSign = currentItem.priceChange24h >= 0 ? '+' : '';
        chgEl.innerText = `${chgSign}${currentItem.priceChange24h.toFixed(2)}%`;
        chgEl.className = currentItem.priceChange24h >= 0 ? 'val-up' : 'val-down';

        document.getElementById('valMA1').innerText = currentItem.ma1.toFixed(4);
        document.getElementById('valMA2').innerText = currentItem.ma2.toFixed(4);
        document.getElementById('valMA3').innerText = currentItem.ma3.toFixed(4);

        document.getElementById('tradeModal').style.display = 'flex';

        requestAnimationFrame(() => drawChart(currentItem));
    }

    function closeModal() {
        document.getElementById('tradeModal').style.display = 'none';
    }
</script>
</body>
</html>
