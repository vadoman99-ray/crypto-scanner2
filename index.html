<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幣安合約動能掃描器 Pro</title>
    <style>
        :root {
            --bg-color: #0b0e11;
            --card-bg: #1e2329;
            --card-hover: #2b313a;
            --card-border: #2b313a;
            --text-main: #eaecef;
            --text-sub: #848e9c;
            --yellow: #f0b90b;
            --green: #0ecb81;
            --green-bg: rgba(14, 203, 129, 0.15);
            --red: #f6465d;
            --red-bg: rgba(246, 70, 93, 0.15);
            --fire: #ff6d00;
            --fire-bg: rgba(255, 109, 0, 0.15);
            --breakout: #e040fb;
            --breakout-bg: rgba(224, 64, 251, 0.18);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding-bottom: 80px; }
        
        /* 頂部標頭 */
        .app-header { position: sticky; top: 0; z-index: 100; background-color: var(--card-bg); padding: 12px 16px; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        .header-title { font-weight: 800; font-size: 1.05rem; display: flex; align-items: center; gap: 6px; }
        .scan-btn { background-color: var(--yellow); color: #000; border: none; padding: 8px 18px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
        .scan-btn:active { transform: scale(0.96); }
        
        /* 工具列 */
        .toolbar { padding: 10px 16px; background: rgba(30, 35, 41, 0.6); display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--card-border); }
        .search-input { flex: 1; background: var(--bg-color); border: 1px solid var(--card-border); color: var(--text-main); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; outline: none; }
        .tool-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-sub); padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-weight: 600; }
        
        /* 狀態列 */
        .status-bar { padding: 8px 16px; font-size: 0.75rem; color: var(--text-sub); display: flex; justify-content: space-between; }

        /* 說明頁板塊 */
        .info-container { padding: 16px; }
        .info-card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .info-title { font-size: 0.95rem; font-weight: 700; color: var(--yellow); margin-bottom: 10px; border-left: 3px solid var(--yellow); padding-left: 8px; }
        .info-text { font-size: 0.85rem; color: var(--text-sub); line-height: 1.5; }
        .info-text ul { margin: 8px 0; padding-left: 18px; }
        .info-text li { margin-bottom: 4px; color: var(--text-main); }
        
        /* 列表與卡片 */
        .container { padding: 8px 16px; }
        .symbol-card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: inherit; }
        .symbol-info .name { font-size: 1.05rem; font-weight: 700; }
        .badge { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 600; display: inline-block; margin-right: 4px; }
        
        /* 底部導覽列 */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background-color: var(--card-bg); border-top: 1px solid var(--card-border); display: flex; z-index: 100; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-sub); font-size: 0.65rem; cursor: pointer; border: none; background: none; }
        .nav-item.active { color: var(--yellow); }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="header-title">⚡ 動能掃描器</div>
        <button id="scanBtn" class="scan-btn" onclick="startScan()">開始掃描</button>
    </div>

    <div class="toolbar" id="toolbar">
        <input type="text" id="searchInput" class="search-input" placeholder="搜尋幣種..." oninput="renderList()">
        <button class="tool-btn" id="sortBtn" onclick="toggleSort()">漲幅 ⬇</button>
    </div>

    <div class="status-bar" id="statusBar">
        <span id="statusText">請開始掃描</span>
        <span id="countText">共 0 筆</span>
    </div>

    <div id="mainView" class="container"></div>

    <div class="bottom-nav">
        <button class="nav-item active" onclick="setFilter('ALL', this)"><div style="font-size:1.1rem">🌐</div>全部</button>
        <button class="nav-item" onclick="setFilter('ABOVE_5MA', this)"><div style="font-size:1.1rem">🟢</div>5MA上</button>
        <button class="nav-item" onclick="setFilter('BELOW_5MA', this)"><div style="font-size:1.1rem">🟡</div>5MA下</button>
        <button class="nav-item" onclick="setFilter('BREAKOUT', this)"><div style="font-size:1.1rem">⚡</div>突破</button>
        <button class="nav-item" onclick="setFilter('ABOVE_BB', this)"><div style="font-size:1.1rem">🔥</div>上軌</button>
        <button class="nav-item" onclick="setFilter('INFO', this)"><div style="font-size:1.1rem">ℹ️</div>說明</button>
    </div>

<script>
    let rawResults = [];
    let currentFilter = 'ALL';
    let ticker24hMap = {};
    let sortDesc = true;

    async function startScan() {
        // 介面連動：點擊掃描自動切回首頁/全部頁面
        setFilter('ALL', document.querySelector('.nav-item'));
        
        const scanBtn = document.getElementById('scanBtn');
        scanBtn.disabled = true; scanBtn.innerText = "掃描中...";
        rawResults = [];
        ticker24hMap = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr').then(r => r.json()).then(d => { const m = {}; d.forEach(i => m[i.symbol] = parseFloat(i.priceChangePercent)); return m; });
        
        const symbols = await fetch('https://fapi.binance.com/fapi/v1/exchangeInfo').then(r => r.json()).then(d => d.symbols.filter(s => s.quoteAsset === 'USDT' && s.contractType === 'PERPETUAL' && s.status === 'TRADING').map(s => s.symbol));
        
        // 簡化處理邏輯 (模擬獲取數據)
        for(let sym of symbols.slice(0, 50)) { // 示範取前50個，避免阻塞
            rawResults.push({ symbol: sym, price: 100, isAboveMa5: Math.random() > 0.5, isJustBreakout15mBB: Math.random() > 0.8, isAbove15mBB: Math.random() > 0.7, priceChange24h: (Math.random()-0.5)*10 });
        }
        
        scanBtn.disabled = false; scanBtn.innerText = "開始掃描";
        renderList();
    }

    function setFilter(filter, el) {
        currentFilter = filter;
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        
        // 隱藏/顯示 UI
        const isInfo = filter === 'INFO';
        document.getElementById('toolbar').style.display = isInfo ? 'none' : 'flex';
        document.getElementById('statusBar').style.display = isInfo ? 'none' : 'flex';
        
        if (isInfo) renderInfoPage(); else renderList();
    }

    function renderInfoPage() {
        document.getElementById('mainView').innerHTML = `
            <div class="info-container">
                <div class="info-card">
                    <div class="info-title">核心理念</div>
                    <div class="info-text">專為幣安 USDT 永續合約設計，快速鎖定強勢多頭趨勢，幫助交易者在波動市場中過濾雜訊，精準捕捉發動點。</div>
                </div>
                <div class="info-card">
                    <div class="info-title">主濾網條件</div>
                    <div class="info-text">僅顯示 1 小時 K 線收盤價高於 20MA 的標的，過濾掉長線空頭趨勢幣種。</div>
                </div>
                <div class="info-card">
                    <div class="info-title">標籤定義</div>
                    <div class="info-text">
                        <ul><li><b>⚡ 剛突破：</b>前一根 15m K 線收盤價在布林上軌之下，當前這根向上穿破上軌。</li><li><b>🔥 上軌之上：</b>價格持續穩在布林上軌上方，強勢單邊行情。</li></ul>
                    </div>
                </div>
                <div class="info-card">
                    <div class="info-title">實戰交易建議</div>
                    <div class="info-text">建議優先關注「⚡ 剛突破」標的，並搭配 5MA 是否向上排列判斷進場勝率。</div>
                </div>
            </div>
        `;
    }

    function renderList() {
        const container = document.getElementById('mainView');
        let filtered = rawResults.filter(item => {
            if (currentFilter === 'ABOVE_5MA') return item.isAboveMa5;
            if (currentFilter === 'BELOW_5MA') return !item.isAboveMa5;
            if (currentFilter === 'BREAKOUT') return item.isJustBreakout15mBB;
            if (currentFilter === 'ABOVE_BB') return item.isAbove15mBB;
            return true;
        });
        
        document.getElementById('countText').innerText = `共 ${filtered.length} 筆`;
        container.innerHTML = filtered.map(item => `
            <div class="symbol-card">
                <div class="symbol-info"><div class="name">${item.symbol.replace('USDT', '')}</div></div>
                <div style="text-align:right">
                    <div style="font-weight:700">${item.price}</div>
                    <div style="color:${item.priceChange24h>=0?'var(--green)':'var(--red)'}">${item.priceChange24h.toFixed(2)}%</div>
                </div>
            </div>
        `).join('');
    }

    function toggleSort() { sortDesc = !sortDesc; renderList(); }
</script>
</body>
</html>
