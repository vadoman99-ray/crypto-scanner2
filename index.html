<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ 1H MA 多頭排列策略</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=JetBrains+Mono:wght@800&display=swap');

        :root {
            --manga-dark: #0a0e1a;
            --manga-navy: #121b2d;
            --manga-pink: #ff007f;
            --manga-cyan: #00f0ff;
            --manga-yellow: #ffe600;
            --manga-green: #00ff66;
            --manga-red: #ff3366;
            --pop-shadow: 4px 4px 0px #000;
        }

        * { box-sizing: border-box; outline: none; }
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: var(--manga-dark); 
            background-image: radial-gradient(rgba(0, 240, 255, 0.15) 15%, transparent 16%);
            background-size: 16px 16px;
            color: #fff; margin: 0; padding-bottom: 40px; 
        }

        .app-header { 
            position: sticky; top: 0; z-index: 100; 
            background: #101424; border-bottom: 3px solid var(--manga-cyan); 
            padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.3);
        }
        .header-title { font-size: 1.1rem; font-weight: 900; color: #fff; text-shadow: 0 0 8px var(--manga-cyan); }
        .scan-btn { 
            background: linear-gradient(135deg, #ff007f 0%, #ff5500 100%); 
            color: #fff; border: 2px solid #fff; padding: 8px 16px; border-radius: 6px; 
            font-weight: 900; font-size: 0.9rem; cursor: pointer; box-shadow: var(--pop-shadow);
        }
        .scan-btn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }

        .progress-container { height: 6px; background: #090d16; width: 100%; margin-top: 0; }
        .progress-fill { height: 100%; width: 0%; background: var(--manga-cyan); transition: width 0.05s ease-out; }

        .dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 14px 16px; }
        .stat-card {
            background: rgba(18, 27, 45, 0.85); border: 2px solid var(--manga-cyan);
            border-radius: 8px; padding: 10px; text-align: center; box-shadow: var(--pop-shadow);
        }
        .stat-card .val { font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; font-weight: 900; }
        .stat-card.entry { border-color: var(--manga-pink); }
        .stat-card.entry .val { color: var(--manga-pink); }

        .container { padding: 0 16px; }
        .symbol-card { 
            background: rgba(20, 30, 50, 0.9); border: 2px solid #2a3a5c; 
            border-left: 6px solid var(--manga-pink); border-radius: 8px; 
            padding: 12px 14px; margin-bottom: 12px; 
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: var(--pop-shadow); cursor: pointer; transition: transform 0.1s;
        }
        .symbol-card:hover { transform: translateY(-2px); border-color: var(--manga-cyan); }
        .symbol-name { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: 900; }
        .symbol-price { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; color: var(--manga-yellow); }
        .detail-row { font-size: 0.78rem; font-family: 'JetBrains Mono', monospace; color: #a0aec0; margin-top: 4px; }
        .badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: 900; background: var(--manga-pink); color: #fff; }

        .modal-backdrop {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 8, 17, 0.85); backdrop-filter: blur(8px);
            z-index: 999; display: none; justify-content: center; align-items: center; padding: 16px;
        }
        .modal-card {
            background: var(--manga-navy); border: 2px solid var(--manga-cyan);
            border-radius: 12px; width: 100%; max-width: 520px; padding: 18px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
            max-height: 90vh; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        
        /* K棒圖表容器 */
        .chart-container {
            background: #070a12; border: 1px solid #2a3a5c; border-radius: 6px;
            padding: 8px; margin-bottom: 12px; position: relative;
        }
        .chart-title { font-size: 0.75rem; color: #a0aec0; margin-bottom: 4px; display: flex; justify-content: space-between; }
        canvas { width: 100%; height: 200px; display: block; }

        .info-box { background: #070a12; border: 1px solid #2a3a5c; padding: 10px; border-radius: 6px; }
        .info-row { display: flex; justify-content: space-between; font-size: 0.85rem; font-family: 'JetBrains Mono', monospace; margin-bottom: 6px; }
        .info-row:last-child { margin-bottom: 0; }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="header-title">⚡ 1H MA 多頭排列策略</div>
        <button id="scanBtn" class="scan-btn" onclick="startScan()">啟動極速掃描</button>
    </div>

    <div class="progress-container"><div id="progress" class="progress-fill"></div></div>

    <div class="dashboard">
        <div class="stat-card">
            <div class="val" id="statTotal">0</div>
            <div style="font-size:0.75rem;">掃描目標數</div>
        </div>
        <div class="stat-card entry">
            <div class="val" id="statEntry">0</div>
            <div style="font-size:0.75rem;">1H 多頭排列標的</div>
        </div>
    </div>

    <div class="container" id="symbolList"></div>

    <div class="modal-backdrop" id="tradeModal" onclick="if(event.target.id==='tradeModal') closeModal()">
        <div class="modal-card">
            <div class="modal-header">
                <span id="modalSymbol" style="font-family:'JetBrains Mono'; font-weight:900; font-size:1.2rem;">BTCUSDT</span>
                <button onclick="closeModal()" style="background:var(--manga-pink); color:#fff; border:none; border-radius:4px; font-weight:900; padding:4px 8px; cursor:pointer;">✕</button>
            </div>
            
            <!-- 100 根 1H K線圖與 3 條均線 -->
            <div class="chart-container">
                <div class="chart-title">
                    <span>1H 近 100 根 K 線圖</span>
                    <span style="font-weight:900;">
                        <span style="color:var(--manga-pink);">● MA30</span> 
                        <span style="color:#a855f7;">● MA45</span> 
                        <span style="color:var(--manga-green);">● MA60</span>
                    </span>
                </div>
                <canvas id="klineCanvas" width="480" height="200"></canvas>
            </div>

            <div class="info-box">
                <div class="info-row"><span>當前現價:</span><b id="valPrice" style="color:var(--manga-yellow);">0</b></div>
                <div class="info-row"><span>MA(30) 短均:</span><b id="valMA1" style="color:var(--manga-pink);">0</b></div>
                <div class="info-row"><span>MA(45) 中均:</span><b id="valMA2" style="color:#a855f7;">0</b></div>
                <div class="info-row"><span>MA(60) 長均:</span><b id="valMA3" style="color:var(--manga-green);">0</b></div>
            </div>
        </div>
    </div>

<script>
    const API_BASE = 'https://fapi.binance.com';
    let rawResults = [];
    let currentItem = null;

    // 固定指標參數
    const P1 = 30;
    const P2 = 45;
    const P3 = 60;

    async function asyncPool(poolLimit, array, iteratorFn) {
        const ret = [];
        const executing = [];
        for (const item of array) {
            const p = Promise.resolve().then(() => iteratorFn(item));
            ret.push(p);
            if (poolLimit <= array.length) {
                const e = p.then(() => executing.splice(executing.indexOf(e), 1));
                executing.push(e);
                if (executing.length >= poolLimit) {
                    await Promise.race(executing);
                }
            }
        }
        return Promise.all(ret);
    }

    function calcSMA(closes, period, index) {
        if (index < period - 1) return null;
        let sum = 0;
        for (let i = index - period + 1; i <= index; i++) {
            sum += closes[i];
        }
        return sum / period;
    }

    async function evaluateSymbolMA(symbol, updateProgress) {
        try {
            // 請求足夠計算長均線與 100 根 K 棒所需的歷史資料
            const maxPeriod = Math.max(P1, P2, P3) + 100; 

            const res = await fetch(`${API_BASE}/fapi/v1/klines?symbol=${symbol}&interval=1h&limit=${maxPeriod}`);
            updateProgress();
            if (!res.ok) return null;

            const klines = await res.json();
            const closes = klines.map(k => parseFloat(k[4]));
            const price = closes[closes.length - 1];
            const len = closes.length;

            const ma1 = calcSMA(closes, P1, len - 1);
            const ma2 = calcSMA(closes, P2, len - 1);
            const ma3 = calcSMA(closes, P3, len - 1);

            if (price > ma1 && ma1 > ma2 && ma2 > ma3) {
                return { symbol, price, ma1, ma2, ma3, klines, p1: P1, p2: P2, p3: P3 };
            }
            return null;
        } catch {
            updateProgress();
            return null;
        }
    }

    async function startScan() {
        const btn = document.getElementById('scanBtn');
        btn.disabled = true; btn.innerText = "⚡ 全網初篩中...";
        rawResults = [];
        document.getElementById('symbolList').innerHTML = '';

        const tickers = await fetch(`${API_BASE}/fapi/v1/ticker/24hr`).then(r => r.json());
        
        const candidateSymbols = tickers.filter(t => 
            t.symbol.endsWith('USDT') && 
            parseFloat(t.priceChangePercent) > 0 && 
            parseFloat(t.quoteVolume) > 10000000
        ).map(t => t.symbol);

        document.getElementById('statTotal').innerText = candidateSymbols.length;

        let completed = 0;
        const updateProgress = () => {
            completed++;
            document.getElementById('progress').style.width = `${(completed / candidateSymbols.length) * 100}%`;
        };

        btn.innerText = "🔍 閃電計算 1H 均線中...";
        const results = await asyncPool(20, candidateSymbols, sym => evaluateSymbolMA(sym, updateProgress));

        rawResults = results.filter(Boolean);
        document.getElementById('statEntry').innerText = rawResults.length;

        btn.disabled = false; btn.innerText = "啟動極速掃描";
        renderList();
    }

    function renderList() {
        const container = document.getElementById('symbolList');
        if (rawResults.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:40px; color:#5a7094; font-weight:900;">無符合 1H 多頭排列標的</div>`;
            return;
        }

        container.innerHTML = rawResults.map(item => `
            <div class="symbol-card" onclick="openModal('${item.symbol}')">
                <div style="flex: 1;">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span class="symbol-name">${item.symbol.replace('USDT','')}</span>
                        <span class="badge">📈 1H 多頭排列</span>
                    </div>
                    <div class="detail-row">
                        MA30: <span style="color:var(--manga-pink);">${item.ma1.toFixed(4)}</span> | 
                        MA45: <span style="color:#a855f7;">${item.ma2.toFixed(4)}</span> | 
                        MA60: <span style="color:var(--manga-green);">${item.ma3.toFixed(4)}</span>
                    </div>
                </div>
                <div style="text-align:right;">
                    <div class="symbol-price">${item.price}</div>
                </div>
            </div>
        `).join('');
    }

    // 繪製 100 根 1H K線圖與 MA30/45/60 均線
    function drawChart(item) {
        const canvas = document.getElementById('klineCanvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        ctx.clearRect(0, 0, width, height);

        const klines = item.klines;
        const totalKlines = klines.length;
        const displayCount = 100; // 改為顯示近 100 根 K 棒
        const sliceKlines = klines.slice(totalKlines - displayCount);
        const closes = klines.map(k => parseFloat(k[4]));

        let minPrice = Infinity;
        let maxPrice = -Infinity;

        sliceKlines.forEach(k => {
            const high = parseFloat(k[2]);
            const low = parseFloat(k[3]);
            if (high > maxPrice) maxPrice = high;
            if (low < minPrice) minPrice = low;
        });

        const padding = 15;
        const chartHeight = height - padding * 2;
        const priceRange = maxPrice - minPrice || 1;

        const getY = (price) => height - padding - ((price - minPrice) / priceRange) * chartHeight;
        const candleWidth = (width / displayCount) * 0.7;
        const stepX = width / displayCount;

        // 1. 繪製 K 棒
        sliceKlines.forEach((k, idx) => {
            const open = parseFloat(k[1]);
            const high = parseFloat(k[2]);
            const low = parseFloat(k[3]);
            const close = parseFloat(k[4]);

            const x = idx * stepX + stepX / 2;
            const isUp = close >= open;

            ctx.strokeStyle = isUp ? '#00ff66' : '#ff3366';
            ctx.fillStyle = isUp ? '#00ff66' : '#ff3366';

            // 影線
            ctx.beginPath();
            ctx.moveTo(x, getY(high));
            ctx.lineTo(x, getY(low));
            ctx.stroke();

            // 實體
            const topY = getY(Math.max(open, close));
            const bottomY = getY(Math.min(open, close));
            const h = Math.max(2, bottomY - topY);
            ctx.fillRect(x - candleWidth / 2, topY, candleWidth, h);
        });

        // 2. 繪製 3 條均線
        const drawMA = (period, color) => {
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            let started = false;

            for (let i = 0; i < displayCount; i++) {
                const globalIdx = totalKlines - displayCount + i;
                const maVal = calcSMA(closes, period, globalIdx);
                if (maVal !== null) {
                    const x = i * stepX + stepX / 2;
                    const y = getY(maVal);
                    if (!started) {
                        ctx.moveTo(x, y);
                        started = true;
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
            }
            ctx.stroke();
        };

        drawMA(item.p1, '#ff007f'); // MA30 粉色
        drawMA(item.p2, '#a855f7'); // MA45 紫色
        drawMA(item.p3, '#00ff66'); // MA60 綠色
    }

    function openModal(symbol) {
        currentItem = rawResults.find(r => r.symbol === symbol);
        if (!currentItem) return;

        document.getElementById('modalSymbol').innerText = symbol;
        document.getElementById('valPrice').innerText = currentItem.price.toFixed(4);
        document.getElementById('valMA1').innerText = currentItem.ma1.toFixed(4);
        document.getElementById('valMA2').innerText = currentItem.ma2.toFixed(4);
        document.getElementById('valMA3').innerText = currentItem.ma3.toFixed(4);

        document.getElementById('tradeModal').style.display = 'flex';

        setTimeout(() => drawChart(currentItem), 50);
    }

    function closeModal() {
        document.getElementById('tradeModal').style.display = 'none';
    }
</script>
</body>
</html>
