<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幣安合約掃描 (1H MA20 + 15m BB)</title>
    <style>
        :root {
            --bg-color: #12161c;
            --card-bg: #1e2329;
            --card-border: #2b313a;
            --text-main: #eaecef;
            --text-sub: #848e9c;
            --yellow: #f0b90b;
            --green: #0ecb81;
            --green-bg: rgba(14, 203, 129, 0.12);
            --red: #f6465d;
            --red-bg: rgba(246, 70, 93, 0.12);
            --fire: #ff6d00;
            --fire-bg: rgba(255, 109, 0, 0.15);
            --breakout: #9c27b0;
            --breakout-bg: rgba(156, 39, 176, 0.2);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; padding-bottom: 70px; }
        
        .app-header { position: sticky; top: 0; z-index: 100; background-color: var(--card-bg); padding: 12px 16px; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
        .scan-btn { background-color: var(--yellow); color: #000; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; cursor: pointer; }
        .scan-btn:disabled { opacity: 0.5; }
        
        .progress-bar { height: 3px; background: var(--card-border); width: 100%; }
        .progress-fill { height: 100%; width: 0%; background: var(--yellow); transition: width 0.2s; }
        .status-bar { padding: 10px 16px; font-size: 0.8rem; color: var(--text-sub); display: flex; justify-content: space-between; align-items: center; background: rgba(30, 35, 41, 0.5); }
        .container { padding: 12px 16px; }
        
        .symbol-card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: inherit; }
        .symbol-card:active { background-color: #2b313a; }
        .symbol-info .name { font-size: 1.1rem; font-weight: bold; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        .symbol-metrics { text-align: right; }
        .symbol-metrics .price { font-size: 1.05rem; font-weight: bold; margin-bottom: 4px; font-family: monospace; }
        
        /* 標籤通用樣式 */
        .badge { font-size: 0.7rem; padding: 3px 6px; border-radius: 4px; font-weight: 600; display: inline-block; margin-right: 4px; margin-top: 4px; }
        .badge-above { background-color: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
        .badge-below { background-color: rgba(240, 185, 11, 0.15); color: var(--yellow); border: 1px solid var(--yellow); }
        
        /* 布林上軌狀態標籤 */
        .badge-fire { background-color: var(--fire-bg); color: var(--fire); border: 1px solid var(--fire); }
        
        /* 剛突破亮紫色高亮標籤 */
        .badge-breakout { background-color: var(--breakout-bg); color: #e040fb; border: 1px solid #e040fb; font-weight: bold; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        .change-badge { font-size: 0.85rem; font-weight: bold; padding: 2px 6px; border-radius: 4px; display: inline-block; font-family: monospace; }
        .change-up { color: var(--green); background-color: var(--green-bg); }
        .change-down { color: var(--red); background-color: var(--red-bg); }
        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-sub); font-size: 0.9rem; }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background-color: var(--card-bg); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-sub); font-size: 0.75rem; border: none; background: none; padding: 6px 0; cursor: pointer; }
        .nav-item.active { color: var(--yellow); font-weight: bold; }
        .nav-icon { font-size: 1.2rem; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="app-header">
        <div style="font-weight:bold;">⚡ 1H 20MA 掃描器</div>
        <button id="scanBtn" class="scan-btn" onclick="startScan()">開始掃描</button>
    </div>

    <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>

    <div class="status-bar">
        <span id="statusText">排序：24H 漲幅 ⬇</span>
        <span id="countText">共 0 筆</span>
    </div>

    <div class="container" id="symbolList">
        <div class="empty-state">點擊開始掃描，自動過濾合約</div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active" onclick="setFilter('ALL', this)">
            <div class="nav-icon">🌐</div>
            <div>全部 (20MA+)</div>
        </button>
        <button class="nav-item" onclick="setFilter('ABOVE_5MA', this)">
            <div class="nav-icon">🟢</div>
            <div>5MA 上方</div>
        </button>
        <button class="nav-item" onclick="setFilter('BELOW_5MA', this)">
            <div class="nav-icon">🟡</div>
            <div>5MA 下方 (回踩)</div>
        </button>
    </div>

<script>
    let rawResults = [];
    let currentFilter = 'ALL';
    let ticker24hMap = {};

    function calculateSMA(data, count) {
        if (data.length < count) return 0;
        return data.slice(-count).reduce((sum, val) => sum + val, 0) / count;
    }

    // 計算特定位置的布林上軌
    function calculateBBAt(prices, index, period = 20) {
        if (index < period - 1) return Infinity;
        const slice = prices.slice(index - period + 1, index + 1);
        const sma = slice.reduce((a, b) => a + b, 0) / period;
        const variance = slice.reduce((a, b) => a + Math.pow(b - sma, 2), 0) / period;
        return sma + (2 * Math.sqrt(variance));
    }

    async function fetch24hTickers() {
        try {
            const res = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
            const data = await res.json();
            const map = {};
            data.forEach(item => { map[item.symbol] = parseFloat(item.priceChangePercent); });
            return map;
        } catch(e) { return {}; }
    }

    async function getUSDTFuturesSymbols() {
        const res = await fetch('https://fapi.binance.com/fapi/v1/exchangeInfo');
        const data = await res.json();
        return data.symbols
            .filter(s => s.quoteAsset === 'USDT' && s.contractType === 'PERPETUAL' && s.status === 'TRADING')
            .map(s => s.symbol);
    }

    async function processSymbol(symbol) {
        try {
            // 1. 抓取 1H K線
            const res1h = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=1h&limit=30`);
            const data1h = await res1h.json();
            const closes1h = data1h.map(k => parseFloat(k[4]));
            const currentClose1h = closes1h[closes1h.length - 1];
            
            const ma20 = calculateSMA(closes1h, 20);
            const ma5 = calculateSMA(closes1h, 5);

            // 核心條件：1H 收盤價在 20MA 上方
            if (currentClose1h > ma20) {
                
                let isAbove15mBB = false;
                let isJustBreakout15mBB = false;
                
                // 2. 抓取 15m K線 (至少需要 35 根來同時算 當前與前一根 的布林上軌)
                const res15m = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=15m&limit=35`);
                const data15m = await res15m.json();
                const closes15m = data15m.map(k => parseFloat(k[4]));
                
                const currIdx = closes15m.length - 1;
                const prevIdx = currIdx - 1;

                const currClose = closes15m[currIdx];
                const prevClose = closes15m[prevIdx];

                const currUpperBB = calculateBBAt(closes15m, currIdx);
                const prevUpperBB = calculateBBAt(closes15m, prevIdx);

                // 判斷 1: 是否在上軌之上
                if (currClose >= currUpperBB) {
                    isAbove15mBB = true;
                }

                // 判斷 2: 是否剛突破（前一根在下，當前這根在上）
                if (prevClose < prevUpperBB && currClose >= currUpperBB) {
                    isJustBreakout15mBB = true;
                }

                return {
                    symbol: symbol,
                    price: currentClose1h,
                    ma20: ma20,
                    isAboveMa5: currentClose1h >= ma5,
                    isAbove15mBB: isAbove15mBB,
                    isJustBreakout15mBB: isJustBreakout15mBB,
                    priceChange24h: ticker24hMap[symbol] || 0
                };
            }
            return null;
        } catch (e) {
            return null;
        }
    }

    async function startScan() {
        const scanBtn = document.getElementById('scanBtn');
        const statusText = document.getElementById('statusText');
        const progressEl = document.getElementById('progress');
        
        scanBtn.disabled = true;
        scanBtn.innerText = "掃描中...";
        rawResults = [];
        renderList();

        statusText.innerText = "載入 24H 數據...";
        ticker24hMap = await fetch24hTickers();

        statusText.innerText = "取得合約清單...";
        const symbols = await getUSDTFuturesSymbols();
        
        const batchSize = 10;
        let processed = 0;

        for (let i = 0; i < symbols.length; i += batchSize) {
            const batch = symbols.slice(i, i + batchSize);
            const promises = batch.map(sym => processSymbol(sym));
            const results = await Promise.all(promises);

            results.forEach(res => {
                if (res) rawResults.push(res);
            });

            processed += batch.length;
            const pct = Math.floor((processed / symbols.length) * 100);
            progressEl.style.width = `${pct}%`;
            statusText.innerText = `進度: ${processed}/${symbols.length}`;
            renderList();
        }

        statusText.innerText = `掃描完成`;
        scanBtn.disabled = false;
        scanBtn.innerText = "重新掃描";
    }

    function setFilter(filter, el) {
        currentFilter = filter;
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        el.classList.add('active');
        renderList();
    }

    function renderList() {
        const container = document.getElementById('symbolList');
        const countText = document.getElementById('countText');
        
        let filtered = rawResults.filter(item => {
            if (currentFilter === 'ABOVE_5MA') return item.isAboveMa5;
            if (currentFilter === 'BELOW_5MA') return !item.isAboveMa5;
            return true;
        });

        // 依 24H 漲幅降序排列
        filtered.sort((a, b) => b.priceChange24h - a.priceChange24h);

        countText.innerText = `共 ${filtered.length} 筆`;

        if (filtered.length === 0) {
            container.innerHTML = `<div class="empty-state">尚無符合條件的標的</div>`;
            return;
        }

        container.innerHTML = filtered.map(item => {
            const isPositive = item.priceChange24h >= 0;
            const changeFormatted = (isPositive ? '+' : '') + item.priceChange24h.toFixed(2) + '%';
            
            // 標籤邏輯判斷
            let bbTag = '';
            if (item.isAboveMa5) {
                if (item.isJustBreakout15mBB) {
                    // 剛突破：顯示脈衝閃爍的紫色標籤
                    bbTag = `<span class="badge badge-breakout">⚡ 15m 剛突破上軌</span>`;
                } else if (item.isAbove15mBB) {
                    // 持續在上軌上：顯示橘色火苗標籤
                    bbTag = `<span class="badge badge-fire">🔥 15m 上軌之上</span>`;
                }
            }

            return `
            <a class="symbol-card" href="https://www.binance.com/zh-TC/futures/${item.symbol}" target="_blank">
                <div class="symbol-info">
                    <div class="name">
                        ${item.symbol.replace('USDT', '')}
                        <span style="font-size: 0.7rem; color: var(--text-sub);">/USDT</span>
                    </div>
                    <div>
                        ${item.isAboveMa5 
                            ? `<span class="badge badge-above">5MA 上方</span>` 
                            : `<span class="badge badge-below">5MA 下方</span>`}
                        ${bbTag}
                    </div>
                </div>
                <div class="symbol-metrics">
                    <div class="price">${item.price}</div>
                    <span class="change-badge ${isPositive ? 'change-up' : 'change-down'}">
                        ${changeFormatted}
                    </span>
                    <div style="font-size: 0.75rem; color: var(--text-sub); margin-top:4px;">20MA: ${item.ma20.toFixed(4)}</div>
                </div>
            </a>
            `;
        }).join('');
    }
</script>

</body>
</html>
