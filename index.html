
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幣安合約動能掃描器 Pro</title>
    <style>
        :root {
            --bg-color: #0b0e11;
            --card-bg: #1e2329;
            --card-hover: #2b313a;
            --card-border: #2b313a;
            --text-main: #eaecef;
            --text-sub: #848e9c;
            --yellow: #f0b90b;
            --yellow-hover: #fcd535;
            --green: #0ecb81;
            --green-bg: rgba(14, 203, 129, 0.15);
            --red: #f6465d;
            --red-bg: rgba(246, 70, 93, 0.15);
            --fire: #ff6d00;
            --fire-bg: rgba(255, 109, 0, 0.15);
            --breakout: #e040fb;
            --breakout-bg: rgba(224, 64, 251, 0.18);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding-bottom: 75px; 
        }
        
        /* 頂部標頭 */
        .app-header { 
            position: sticky; top: 0; z-index: 100; 
            background-color: var(--card-bg); 
            padding: 12px 16px; 
            border-bottom: 1px solid var(--card-border); 
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .header-title { font-weight: 800; font-size: 1.05rem; display: flex; align-items: center; gap: 6px; }
        .scan-btn { 
            background-color: var(--yellow); color: #000; border: none; 
            padding: 8px 18px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; 
            cursor: pointer; transition: all 0.2s;
        }
        .scan-btn:active { transform: scale(0.96); }
        .scan-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* 進度條 */
        .progress-bar { height: 3px; background: var(--card-border); width: 100%; }
        .progress-fill { height: 100%; width: 0%; background: var(--yellow); transition: width 0.15s ease-out; }
        
        /* 工具列 (搜尋與排序) */
        .toolbar {
            padding: 10px 16px;
            background: rgba(30, 35, 41, 0.6);
            display: flex; gap: 8px; align-items: center;
            border-bottom: 1px solid var(--card-border);
        }
        .search-input {
            flex: 1; background: var(--bg-color); border: 1px solid var(--card-border);
            color: var(--text-main); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem;
            outline: none;
        }
        .search-input:focus { border-color: var(--yellow); }
        .tool-btn {
            background: var(--card-bg); border: 1px solid var(--card-border);
            color: var(--text-sub); padding: 6px 10px; border-radius: 6px; font-size: 0.75rem;
            cursor: pointer; white-space: nowrap; font-weight: 600;
        }
        .tool-btn:active { background: var(--card-hover); }

        /* 狀態列 */
        .status-bar { 
            padding: 8px 16px; font-size: 0.75rem; color: var(--text-sub); 
            display: flex; justify-content: space-between; align-items: center; 
        }

        .container { padding: 8px 16px; }
        
        /* 卡片設計 */
        .symbol-card { 
            background-color: var(--card-bg); border: 1px solid var(--card-border); 
            border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; 
            display: flex; justify-content: space-between; align-items: center; 
            text-decoration: none; color: inherit; transition: border-color 0.2s, background-color 0.2s;
        }
        .symbol-card:active { background-color: var(--card-hover); border-color: var(--yellow); }
        .symbol-info .name { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
        .symbol-metrics { text-align: right; }
        .symbol-metrics .price { font-size: 1rem; font-weight: 700; margin-bottom: 4px; font-family: "SF Mono", Roboto, monospace; }
        
        /* 標籤 */
        .badge { font-size: 0.68rem; padding: 2px 6px; border-radius: 4px; font-weight: 600; display: inline-block; margin-right: 4px; margin-top: 4px; }
        .badge-above { background-color: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
        .badge-below { background-color: rgba(240, 185, 11, 0.15); color: var(--yellow); border: 1px solid var(--yellow); }
        .badge-fire { background-color: var(--fire-bg); color: var(--fire); border: 1px solid var(--fire); }
        .badge-breakout { background-color: var(--breakout-bg); color: var(--breakout); border: 1px solid var(--breakout); font-weight: bold; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .change-badge { font-size: 0.8rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; display: inline-block; font-family: "SF Mono", Roboto, monospace; }
        .change-up { color: var(--green); background-color: var(--green-bg); }
        .change-down { color: var(--red); background-color: var(--red-bg); }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-sub); font-size: 0.9rem; }
        
        /* 底部導覽列 */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; height: 60px; 
            background-color: var(--card-bg); border-top: 1px solid var(--card-border); 
            display: flex; overflow-x: auto; white-space: nowrap; z-index: 100; padding: 0 4px; 
        }
        .bottom-nav::-webkit-scrollbar { display: none; }
        .nav-item { 
            flex: 1; min-width: 65px; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            color: var(--text-sub); font-size: 0.7rem; padding: 0 8px; cursor: pointer; border: none; background: none; 
        }
        .nav-item.active { color: var(--yellow); font-weight: bold; }
        .nav-icon { font-size: 1.1rem; margin-bottom: 2px; }

        /* 說明頁 */
        .about-card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .about-title { font-size: 0.95rem; font-weight: 700; color: var(--yellow); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .about-content { font-size: 0.85rem; color: var(--text-main); line-height: 1.6; }
        .about-content ul { padding-left: 18px; margin: 6px 0; }
        .about-content li { margin-bottom: 4px; }
        .highlight-text { color: var(--yellow); font-weight: 600; }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="header-title">⚡ 1H 20MA 動能掃描</div>
        <button id="scanBtn" class="scan-btn" onclick="startScan()">開始掃描</button>
    </div>

    <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>

    <div class="toolbar" id="toolbar">
        <input type="text" id="searchInput" class="search-input" placeholder="搜尋幣種 (如 BTC, SOL)..." oninput="renderList()">
        <button class="tool-btn" id="sortBtn" onclick="toggleSort()">漲幅 ⬇</button>
        <button class="tool-btn" onclick="copySymbols()">複製清單</button>
    </div>

    <div class="status-bar" id="statusBar">
        <span id="statusText">請點擊「開始掃描」</span>
        <span id="countText">共 0 筆</span>
    </div>

    <div class="container" id="symbolList">
        <div class="empty-state">點擊右上角「開始掃描」<br>自動過濾幣安全場景永續合約</div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active" onclick="setFilter('ALL', this)"><div class="nav-icon">🌐</div><div>全部</div></button>
        <button class="nav-item" onclick="setFilter('ABOVE_5MA', this)"><div class="nav-icon">🟢</div><div>5MA 上</div></button>
        <button class="nav-item" onclick="setFilter('BELOW_5MA', this)"><div class="nav-icon">🟡</div><div>5MA 下</div></button>
        <button class="nav-item" onclick="setFilter('BREAKOUT', this)"><div class="nav-icon">⚡</div><div>剛突破</div></button>
        <button class="nav-item" onclick="setFilter('ABOVE_BB', this)"><div class="nav-icon">🔥</div><div>上軌之上</div></button>
        <button class="nav-item" onclick="setFilter('INFO', this)"><div class="nav-icon">ℹ️</div><div>說明</div></button>
    </div>

<script>
    let rawResults = [];
    let currentFilter = 'ALL';
    let ticker24hMap = {};
    let sortDesc = true; // true: 漲幅降序, false: 漲幅升序

    function calculateSMA(data, count) {
        if (data.length < count) return 0;
        return data.slice(-count).reduce((sum, val) => sum + val, 0) / count;
    }

    function calculateBBAt(prices, index, period = 20) {
        if (index < period - 1) return Infinity;
        const slice = prices.slice(index - period + 1, index + 1);
        const sma = slice.reduce((a, b) => a + b, 0) / period;
        const variance = slice.reduce((a, b) => a + Math.pow(b - sma, 2), 0) / period;
        return sma + (2 * Math.sqrt(variance));
    }

    async function fetch24hTickers() {
        try {
            const res = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
            const data = await res.json();
            const map = {};
            data.forEach(item => { map[item.symbol] = parseFloat(item.priceChangePercent); });
            return map;
        } catch(e) { return {}; }
    }

    async function getUSDTFuturesSymbols() {
        const res = await fetch('https://fapi.binance.com/fapi/v1/exchangeInfo');
        const data = await res.json();
        return data.symbols
            .filter(s => s.quoteAsset === 'USDT' && s.contractType === 'PERPETUAL' && s.status === 'TRADING')
            .map(s => s.symbol);
    }

    // 優化：1H 與 15m API 並行請求 (Parallel Fetch)
    async function processSymbol(symbol) {
        try {
            const [res1h, res15m] = await Promise.all([
                fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=1h&limit=30`).then(r => r.json()),
                fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=15m&limit=35`).then(r => r.json())
            ]);

            const closes1h = res1h.map(k => parseFloat(k[4]));
            const currentClose1h = closes1h[closes1h.length - 1];
            
            const ma20 = calculateSMA(closes1h, 20);
            const ma5 = calculateSMA(closes1h, 5);

            // 主過濾器：1H 收盤價 > 20MA
            if (currentClose1h > ma20) {
                const closes15m = res15m.map(k => parseFloat(k[4]));
                const currIdx = closes15m.length - 1;
                const prevIdx = currIdx - 1;

                const currClose = closes15m[currIdx];
                const prevClose = closes15m[prevIdx];

                const currUpperBB = calculateBBAt(closes15m, currIdx);
                const prevUpperBB = calculateBBAt(closes15m, prevIdx);

                const isAbove15mBB = currClose >= currUpperBB;
                const isJustBreakout15mBB = (prevClose < prevUpperBB && currClose >= currUpperBB);

                return {
                    symbol: symbol,
                    price: currentClose1h,
                    ma20: ma20,
                    isAboveMa5: currentClose1h >= ma5,
                    isAbove15mBB: isAbove15mBB,
                    isJustBreakout15mBB: isJustBreakout15mBB,
                    priceChange24h: ticker24hMap[symbol] || 0
                };
            }
            return null;
        } catch (e) { return null; }
    }

    async function startScan() {
        const scanBtn = document.getElementById('scanBtn');
        const statusText = document.getElementById('statusText');
        const progressEl = document.getElementById('progress');
        
        scanBtn.disabled = true;
        scanBtn.innerText = "掃描中...";
        rawResults = [];
        
        if (currentFilter === 'INFO') {
            setFilter('ALL', document.querySelectorAll('.nav-item')[0]);
        } else {
            renderList();
        }

        statusText.innerText = "更新 24H 漲跌幅...";
        ticker24hMap = await fetch24hTickers();

        statusText.innerText = "取得合約清單...";
        const symbols = await getUSDTFuturesSymbols();
        
        const batchSize = 12;
        let processed = 0;

        for (let i = 0; i < symbols.length; i += batchSize) {
            const batch = symbols.slice(i, i + batchSize);
            const results = await Promise.all(batch.map(sym => processSymbol(sym)));

            results.forEach(res => { if (res) rawResults.push(res); });

            processed += batch.length;
            const pct = Math.floor((processed / symbols.length) * 100);
            progressEl.style.width = `${pct}%`;
            statusText.innerText = `掃描中: ${processed}/${symbols.length}`;
            if (currentFilter !== 'INFO') renderList();
        }

        const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        statusText.innerText = `完成 (${now})`;
        scanBtn.disabled = false;
        scanBtn.innerText = "重新掃描";
    }

    function toggleSort() {
        sortDesc = !sortDesc;
        document.getElementById('sortBtn').innerText = sortDesc ? '漲幅 ⬇' : '漲幅 ⬆';
        renderList();
    }

    function copySymbols() {
        const query = document.getElementById('searchInput').value.toUpperCase();
        let filtered = getFilteredData().map(i => i.symbol.replace('USDT', ''));
        if (filtered.length === 0) return alert('目前沒有可複製的幣種');
        
        navigator.clipboard.writeText(filtered.join(', ')).then(() => {
            alert(`已複製 ${filtered.length} 個幣種清單！`);
        });
    }

    function setFilter(filter, el) {
        currentFilter = filter;
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        el.classList.add('active');
        
        const statusBar = document.getElementById('statusBar');
        const toolbar = document.getElementById('toolbar');
        
        if (filter === 'INFO') {
            statusBar.style.display = 'none';
            toolbar.style.display = 'none';
            renderInfoPage();
        } else {
            statusBar.style.display = 'flex';
            toolbar.style.display = 'flex';
            renderList();
        }
    }

    function getFilteredData() {
        const query = document.getElementById('searchInput').value.toUpperCase();
        return rawResults.filter(item => {
            const matchesSearch = item.symbol.includes(query);
            if (!matchesSearch) return false;

            if (currentFilter === 'ABOVE_5MA') return item.isAboveMa5;
            if (currentFilter === 'BELOW_5MA') return !item.isAboveMa5;
            if (currentFilter === 'BREAKOUT') return item.isJustBreakout15mBB;
            if (currentFilter === 'ABOVE_BB') return item.isAbove15mBB;
            return true;
        });
    }

    function renderInfoPage() {
        const container = document.getElementById('symbolList');
        container.innerHTML = `
            <div class="about-card">
                <div class="about-title">🎯 設計理念</div>
                <div class="about-content">
                    專為<b>幣安 USDT 永續合約</b>設計的短線趨勢掃描器。幫助交易者從 200+ 標的中，快速鎖定<b>多頭趨勢成立</b>且<b>短線強勢突破</b>的潛力幣種。
                </div>
            </div>

            <div class="about-card">
                <div class="about-title">📊 基礎濾網機制</div>
                <div class="about-content">
                    <ul>
                        <li><b>1H 20MA 主濾網：</b>僅保留 1 小時 K 線收盤價高於 20MA 的標的，順應中短期多頭格局。</li>
                        <li><b>二級動能與突破判斷：</b>進一步計算 15m 布林通道與 5MA 位置。</li>
                    </ul>
                </div>
            </div>

            <div class="about-card">
                <div class="about-title">🏷️ 分頁標籤說明</div>
                <div class="about-content">
                    <ul>
                        <li><span class="highlight-text">🌐 全部：</span>所有符合 1H 20MA 上方的標的。</li>
                        <li><span class="highlight-text">🟢 5MA 上：</span>1H 價格站上 5MA，代表短線強勢推升中。</li>
                        <li><span class="highlight-text">🟡 5MA 下：</span>1H 價格在 5MA 下方但仍高於 20MA，屬於<b>多頭回踩支撐區</b>。</li>
                        <li><span class="highlight-text">⚡ 剛突破：</span>15m 前一根在布林上軌下，當前這根<b>剛開盤突破站上上軌</b>，為關鍵發動點。</li>
                        <li><span class="highlight-text">🔥 上軌之上：</span>15m 持續穩在布林上軌上方，屬於強勢單邊行情。</li>
                    </ul>
                </div>
            </div>
        `;
    }

    function renderList() {
        const container = document.getElementById('symbolList');
        const countText = document.getElementById('countText');
        
        let filtered = getFilteredData();

        filtered.sort((a, b) => sortDesc ? b.priceChange24h - a.priceChange24h : a.priceChange24h - b.priceChange24h);
        countText.innerText = `共 ${filtered.length} 筆`;

        if (filtered.length === 0) {
            container.innerHTML = `<div class="empty-state">${rawResults.length === 0 ? '請點擊「開始掃描」以取得最新數據' : '沒有符合條件的標的'}</div>`;
            return;
        }

        container.innerHTML = filtered.map(item => {
            const isPositive = item.priceChange24h >= 0;
            const changeFormatted = (isPositive ? '+' : '') + item.priceChange24h.toFixed(2) + '%';
            
            let bbTag = '';
            if (item.isJustBreakout15mBB) {
                bbTag = `<span class="badge badge-breakout">⚡ 15m 剛突破上軌</span>`;
            } else if (item.isAbove15mBB) {
                bbTag = `<span class="badge badge-fire">🔥 15m 上軌之上</span>`;
            }

            return `
            <a class="symbol-card" href="https://www.binance.com/zh-TC/futures/${item.symbol}" target="_blank">
                <div class="symbol-info">
                    <div class="name">
                        ${item.symbol.replace('USDT', '')}
                        <span style="font-size: 0.7rem; color: var(--text-sub);">/USDT</span>
                    </div>
                    <div>
                        ${item.isAboveMa5 
                            ? `<span class="badge badge-above">5MA 上</span>` 
                            : `<span class="badge badge-below">5MA 下</span>`}
                        ${bbTag}
                    </div>
                </div>
                <div class="symbol-metrics">
                    <div class="price">${item.price}</div>
                    <span class="change-badge ${isPositive ? 'change-up' : 'change-down'}">
                        ${changeFormatted}
                    </span>
                    <div style="font-size: 0.72rem; color: var(--text-sub); margin-top:3px;">20MA: ${item.ma20.toFixed(4)}</div>
                </div>
            </a>
            `;
        }).join('');
    }
</script>

</body>
</html>
