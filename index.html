<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加密貨幣 60MA 支撐回檔監控儀表板</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <!-- 置頂高亮提示橫幅 -->
    <div class="bg-amber-400 text-slate-950 font-bold px-4 py-3 text-center shadow-lg flex items-center justify-center gap-2">
        <span>⚠️ 60MA 支撐回檔策略監控中：聚焦回檔至 60MA 支撐距離，尋找最佳風險報酬進場點</span>
    </div>

    <div class="max-w-7xl mx-auto px-4 py-6">
        <header class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white">60MA 支撐回檔評分儀表板</h1>
                <p class="text-slate-400 text-sm mt-1">即時計算各幣種與 60MA 均線的距離百分比與風險報酬評分</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="refreshData()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow">
                    重新掃描市場
                </button>
            </div>
        </header>

        <!-- 數據表格卡片 -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl shadow-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-800/80 text-slate-300 text-xs uppercase tracking-wider border-b border-slate-700">
                            <th class="py-3 px-4">幣種 (Symbol)</th>
                            <th class="py-3 px-4">現價 (Current Price)</th>
                            <th class="py-3 px-4">60MA 均線</th>
                            <th class="py-3 px-4">回檔距離百分比</th>
                            <th class="py-3 px-4">綜合評分 (Score)</th>
                            <th class="py-3 px-4">狀態建議</th>
                        </tr>
                    </thead>
                    <tbody id="cryptoTableBody" class="divide-y divide-slate-800 text-sm">
                        <!-- 動態渲染資料 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 核心風險報酬評分邏輯（依據回檔至 60MA 距離百分比）
        function calculateRiskRewardScore(currentPrice, ma60) {
            if (!ma60 || ma60 <= 0) return { distancePct: 0, score: 0 };
            
            // 計算回檔至 60MA 支撐的距離百分比（正數代表高於 60MA，負數代表跌破）
            const distancePct = ((currentPrice - ma60) / ma60) * 100;
            
            let score = 0;
            if (distancePct >= 0 && distancePct <= 2) {
                score = 100; // 緊貼 60MA 支撐區，風險最低、潛在報酬最佳
            } else if (distancePct > 2 && distancePct <= 5) {
                score = 80;  // 輕微回檔，處於合理支撐範圍
            } else if (distancePct > 5 && distancePct <= 10) {
                score = 50;  // 距離支撐稍遠，開始出現乖離
            } else if (distancePct > 10) {
                score = 20;  // 乖離過大，追價風險高
            } else {
                score = 30;  // 已跌破 60MA，需注意支撐是否失效
            }
            
            return {
                distancePct: parseFloat(distancePct.toFixed(2)),
                score: score
            };
        }

        // 模擬市場測試數據
        const mockMarketData = [
            { symbol: 'ETH/USDT', currentPrice: 3250.50, ma60: 3200.00 },
            { symbol: 'BTC/USDT', currentPrice: 64200.00, ma60: 63800.00 },
            { symbol: 'ME/USDT', currentPrice: 1.25, ma60: 1.18 },
            { symbol: 'CHIP/USDT', currentPrice: 0.45, ma60: 0.48 },
            { symbol: 'BANK/USDT', currentPrice: 0.082, ma60: 0.075 },
            { symbol: 'SOL/USDT', currentPrice: 142.30, ma60: 135.00 }
        ];

        function renderTable(data) {
            const tbody = document.getElementById('cryptoTableBody');
            tbody.innerHTML = '';

            data.forEach(item => {
                const res = calculateRiskRewardScore(item.currentPrice, item.ma60);
                
                // 判斷高亮條件（分數 >= 80 視為重點關注對象）
                const isHighlight = res.score >= 80;
                const rowClass = isHighlight ? 'bg-amber-500/10 hover:bg-amber-500/20 font-medium' : 'hover:bg-slate-800/50';
                
                // 狀態標籤與顏色
                let badgeColor = 'bg-slate-700 text-slate-300';
                let statusText = '觀望';
                if (res.score === 100) {
                    badgeColor = 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
                    statusText = '🔥 最佳支撐區';
                } else if (res.score === 80) {
                    badgeColor = 'bg-blue-500/20 text-blue-400 border border-blue-500/30';
                    statusText = '✨ 合理回檔區';
                } else if (res.score === 50) {
                    badgeColor = 'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30';
                    statusText = '⚠️ 乖離稍大';
                } else if (res.score === 20) {
                    badgeColor = 'bg-red-500/20 text-red-400 border border-red-500/30';
                    statusText = '🚨 追價風險高';
                } else {
                    badgeColor = 'bg-orange-500/20 text-orange-400 border border-orange-500/30';
                    statusText = '⚡ 已跌破支撐';
                }

                const tr = document.createElement('tr');
                tr.className = `${rowClass} transition-colors border-b border-slate-800/60`;
                tr.innerHTML = `
                    <td class="py-3 px-4 font-semibold text-white flex items-center gap-2">
                        ${isHighlight ? '<span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>' : ''}
                        ${item.symbol}
                    </td>
                    <td class="py-3 px-4 font-mono">${item.currentPrice.toLocaleString()}</td>
                    <td class="py-3 px-4 font-mono text-slate-400">${item.ma60.toLocaleString()}</td>
                    <td class="py-3 px-4 font-mono ${res.distancePct >= 0 ? 'text-emerald-400' : 'text-red-400'}">
                        ${res.distancePct > 0 ? '+' : ''}${res.distancePct}%
                    </td>
                    <td class="py-3 px-4 font-bold font-mono text-white">${res.score} 分</td>
                    <td class="py-3 px-4">
                        <span class="inline-block px-2.5 py-1 rounded-md text-xs font-semibold ${badgeColor}">
                            ${statusText}
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function refreshData() {
            // 這裡未來可替換為實際串接 Binance API 抓取數據的非同步邏輯
            renderTable(mockMarketData);
        }

        // 初始載入
        refreshData();
    </script>
</body>
</html>
