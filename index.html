<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幣安合約動能掃描器 Pro</title>
    <style>
        :root {
            --bg-color: #0b0e11;
            --card-bg: #1e2329;
            --card-hover: #2b313a;
            --card-border: #2b313a;
            --text-main: #eaecef;
            --text-sub: #848e9c;
            --yellow: #f0b90b;
            --green: #0ecb81;
            --red: #f6465d;
            --fire: #ff6d00;
            --breakout: #e040fb;
            --blue: #3b82f6; /* 新增藍色用於15m 5MA */
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding-bottom: 75px; }
        
        .app-header { position: sticky; top: 0; z-index: 100; background-color: rgba(30, 35, 41, 0.95); backdrop-filter: blur(8px); padding: 12px 16px; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
        .header-title { font-weight: 800; font-size: 1.05rem; }
        .scan-btn { background-color: var(--yellow); color: #000; border: none; padding: 8px 18px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
        
        .progress-bar { height: 3px; background: var(--card-border); width: 100%; }
        .progress-fill { height: 100%; width: 0%; background: var(--yellow); transition: width 0.15s ease-out; }
        
        .toolbar { padding: 10px 16px; background: rgba(30, 35, 41, 0.6); display: flex; gap: 8px; border-bottom: 1px solid var(--card-border); }
        .search-input { flex: 1; background: var(--bg-color); border: 1px solid var(--card-border); color: var(--text-main); padding: 7px 12px; border-radius: 8px; font-size: 0.85rem; outline: none; }
        .tool-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-sub); padding: 7px 12px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; }

        .container { padding: 10px 16px; }
        .symbol-card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: inherit; }
        .symbol-info .name { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
        .symbol-metrics { text-align: right; }
        .symbol-metrics .price { font-size: 1rem; font-weight: 700; font-family: monospace; }
        
        .badge { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 600; display: inline-block; margin-right: 4px; border: 1px solid; }
        
        /* 底部導覽列 - 調整為橫向捲動 */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background-color: var(--card-bg); border-top: 1px solid var(--card-border); display: flex; overflow-x: auto; white-space: nowrap; z-index: 100; padding: 0 5px; }
        .nav-item { min-width: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-sub); font-size: 0.65rem; cursor: pointer; border: none; background: none; }
        .nav-item.active { color: var(--yellow); font-weight: bold; }
        .nav-icon { font-size: 1rem; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="header-title">⚡ 1H 20MA 掃描器</div>
        <button id="scanBtn" class="scan-btn" onclick="startScan()">重新掃描</button>
    </div>

    <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>

    <div class="toolbar">
        <input type="text" id="searchInput" class="search-input" placeholder="搜尋幣種..." oninput="renderList()">
        <button class="tool-btn" onclick="toggleSort()">漲幅 ⬆⬇</button>
    </div>

    <div class="container" id="symbolList">
        <div style="text-align:center; padding:50px; color:var(--text-sub);">點擊掃描開始</div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active" onclick="setFilter('ALL', this)"><div class="nav-icon">🌐</div><div>全部</div></button>
        <button class="nav-item" onclick="setFilter('ABOVE_5MA', this)"><div class="nav-icon">🟢</div><div>1H 5MA上</div></button>
        <button class="nav-item" onclick="setFilter('15M_ABOVE_5MA', this)"><div class="nav-icon">📈</div><div>15m 5MA上</div></button>
        <button class="nav-item" onclick="setFilter('15M_BREAKOUT_5MA', this)"><div class="nav-icon">🚀</div><div>15m剛突5MA</div></button>
        <button class="nav-item" onclick="setFilter('BREAKOUT', this)"><div class="nav-icon">⚡</div><div>15m剛突BB</div></button>
        <button class="nav-item" onclick="setFilter('ABOVE_BB', this)"><div class="nav-icon">🔥</div><div>15m上軌上</div></button>
        <button class="nav-item" onclick="setFilter('INFO', this)"><div class="nav-icon">ℹ️</div><div>說明</div></button>
    </div>

<script>
    let rawResults = [];
    let currentFilter = 'ALL';
    let ticker24hMap = {};
    let sortDesc = true;

    function calculateSMA(data, count) { if (data.length < count) return 0; return data.slice(-count).reduce((sum, val) => sum + val, 0) / count; }
    function calculateBBAt(prices, index, period = 20) { if (index < period - 1) return Infinity; const slice = prices.slice(index - period + 1, index + 1); const sma = slice.reduce((a, b) => a + b, 0) / period; const variance = slice.reduce((a, b) => a + Math.pow(b - sma, 2), 0) / period; return sma + (2 * Math.sqrt(variance)); }

    async function processSymbol(symbol) {
        try {
            const [res1h, res15m] = await Promise.all([
                fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=1h&limit=30`).then(r => r.json()),
                fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=15m&limit=35`).then(r => r.json())
            ]);
            
            const closes1h = res1h.map(k => parseFloat(k[4]));
            const closes15m = res15m.map(k => parseFloat(k[4]));
            
            const currentClose1h = closes1h[closes1h.length - 1];
            const ma20_1h = calculateSMA(closes1h, 20);
            const ma5_1h = calculateSMA(closes1h, 5);

            // 15分K邏輯
            const currClose15m = closes15m[closes15m.length - 1];
            const prevClose15m = closes15m[closes15m.length - 2];
            const ma5_15m = calculateSMA(closes15m, 5);
            const prev_ma5_15m = calculateSMA(closes15m.slice(0, -1), 5);
            
            if (currentClose1h > ma20_1h) {
                const currUpperBB = calculateBBAt(closes15m, closes15m.length - 1);
                const prevUpperBB = calculateBBAt(closes15m, closes15m.length - 2);
                
                return { 
                    symbol: symbol, 
                    price: currentClose1h, 
                    isAboveMa5_1h: currentClose1h >= ma5_1h,
                    is15mAbove5MA: currClose15m >= ma5_15m,
                    is15mJustBroke5MA: (currClose15m > ma5_15m) && (prevClose15m <= prev_ma5_15m),
                    isAbove15mBB: currClose15m >= currUpperBB, 
                    isJustBreakout15mBB: (prevClose15m < prevUpperBB && currClose15m >= currUpperBB), 
                    priceChange24h: ticker24hMap[symbol] || 0 
                };
            }
            return null;
        } catch (e) { return null; }
    }

    async function startScan() {
        const scanBtn = document.getElementById('scanBtn');
        scanBtn.disabled = true; rawResults = [];
        ticker24hMap = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr').then(r=>r.json()).then(d=>{const m={}; d.forEach(i=>m[i.symbol]=parseFloat(i.priceChangePercent)); return m;});
        const exchangeInfo = await fetch('https://fapi.binance.com/fapi/v1/exchangeInfo').then(r=>r.json());
        const symbols = exchangeInfo.symbols.filter(s => s.quoteAsset === 'USDT' && s.contractType === 'PERPETUAL' && s.status === 'TRADING').map(s => s.symbol);
        
        let processed = 0;
        const batchSize = 10;
        for (let i = 0; i < symbols.length; i += batchSize) {
            const batch = symbols.slice(i, i + batchSize);
            const results = await Promise.all(batch.map(sym => processSymbol(sym)));
            results.forEach(res => { if (res) rawResults.push(res); });
            processed += batch.length;
            document.getElementById('progress').style.width = `${Math.floor((processed / symbols.length) * 100)}%`;
            if (currentFilter !== 'INFO') renderList();
        }
        scanBtn.disabled = false;
    }

    function setFilter(filter, el) { 
        currentFilter = filter; 
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active')); 
        el.classList.add('active'); 
        renderList(); 
    }

    function getFilteredData() {
        return rawResults.filter(item => {
            if (currentFilter === 'ABOVE_5MA') return item.isAboveMa5_1h;
            if (currentFilter === '15M_ABOVE_5MA') return item.is15mAbove5MA;
            if (currentFilter === '15M_BREAKOUT_5MA') return item.is15mJustBroke5MA;
            if (currentFilter === 'BREAKOUT') return item.isJustBreakout15mBB;
            if (currentFilter === 'ABOVE_BB') return item.isAbove15mBB;
            return true;
        });
    }

    function renderList() {
        const container = document.getElementById('symbolList');
        if (currentFilter === 'INFO') {
            container.innerHTML = `<div style="padding:20px; color:#888;">工具說明頁面內容...</div>`;
            return;
        }
        let filtered = getFilteredData().sort((a,b) => sortDesc ? b.priceChange24h - a.priceChange24h : a.priceChange24h - b.priceChange24h);
        container.innerHTML = filtered.map(item => `
            <a class="symbol-card" href="https://www.binance.com/zh-TC/futures/${item.symbol}" target="_blank">
                <div class="symbol-info"><div class="name">${item.symbol.replace('USDT', '')}</div>
                <div>
                    ${item.isAboveMa5_1h ? '<span class="badge" style="color:var(--green); border-color:var(--green)">1H 5MA上</span>' : ''}
                    ${item.is15mAbove5MA ? '<span class="badge" style="color:var(--blue); border-color:var(--blue)">15m 5MA上</span>' : ''}
                </div></div>
                <div class="symbol-metrics"><div class="price">${item.price}</div><div style="color:${item.priceChange24h>=0?'var(--green)':'var(--red)'}">${item.priceChange24h.toFixed(2)}%</div></div>
            </a>
        `).join('');
    }

    function toggleSort() { sortDesc = !sortDesc; renderList(); }
</script>
</body>
</html>
