<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>加密貨幣超短線雙MA共振掃描器</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f121d] text-gray-200 min-h-screen p-4 flex justify-center items-center font-sans">

  <!-- 主容器 -->
  <div class="w-full max-w-md bg-[#131722] rounded-xl p-4 shadow-2xl border border-gray-800 space-y-4">
    
    <!-- 頂部標題區 -->
    <div class="border-b border-gray-800 pb-3">
      <div class="flex items-center gap-2 text-xl font-bold text-white">
        <span class="text-amber-400">⚡</span>
        <span>5MA + 20MA 雙均線突破掃描</span>
      </div>
      <div class="flex justify-between items-center text-xs text-gray-400 mt-1">
        <span>掃描更新：<span id="update-time">載入中...</span></span>
        <span>自動更新：每 60 秒</span>
      </div>
    </div>

    <!-- 1. 1分 + 2分 + 15分 共振多頭區塊 -->
    <div class="bg-[#181c28] rounded-lg p-3 border border-gray-800/60">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2 text-cyan-400 font-bold">
          <span>⚡</span>
          <span>1M + 2M + 15M 雙MA同步突破</span>
        </div>
        <span class="text-[10px] bg-cyan-500/10 text-cyan-400 px-2 py-0.5 rounded border border-cyan-500/20">極短線極速</span>
      </div>
      
      <table class="w-full text-xs text-left border-collapse">
        <thead>
          <tr class="text-gray-400 border-b border-gray-800 pb-1">
            <th class="py-1">標的</th>
            <th class="text-right">價格</th>
            <th class="text-right">1M突破</th>
            <th class="text-right">2M突破</th>
            <th class="text-right">15M突破</th>
            <th class="text-right pr-1">強度</th>
          </tr>
        </thead>
        <tbody id="bull-1m2m15m-tbody" class="divide-y divide-gray-800/40">
          <tr>
            <td colspan="6" class="text-center py-4 text-gray-500">行情資料載入中...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 2. 3分 + 5分 + 15分 共振多頭區塊 -->
    <div class="bg-[#181c28] rounded-lg p-3 border border-gray-800/60">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2 text-amber-400 font-bold">
          <span>🚀</span>
          <span>3M + 5M + 15M 雙MA同步突破</span>
        </div>
        <span class="text-[10px] bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded border border-amber-500/20">極短線進階</span>
      </div>
      
      <table class="w-full text-xs text-left border-collapse">
        <thead>
          <tr class="text-gray-400 border-b border-gray-800 pb-1">
            <th class="py-1">標的</th>
            <th class="text-right">價格</th>
            <th class="text-right">3M突破</th>
            <th class="text-right">5M突破</th>
            <th class="text-right">15M突破</th>
            <th class="text-right pr-1">強度</th>
          </tr>
        </thead>
        <tbody id="bull-3m5m15m-tbody" class="divide-y divide-gray-800/40">
          <tr>
            <td colspan="6" class="text-center py-4 text-gray-500">行情資料載入中...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 3. 5分 + 15分 + 30分 共振多頭區塊 -->
    <div class="bg-[#181c28] rounded-lg p-3 border border-amber-500/30">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2 text-rose-400 font-bold">
          <span>🔥</span>
          <span>5M + 15M + 30M 雙MA同步突破</span>
        </div>
        <span class="text-[10px] bg-rose-500/10 text-rose-400 px-2 py-0.5 rounded border border-rose-500/20">當沖強共振</span>
      </div>
      
      <table class="w-full text-xs text-left border-collapse">
        <thead>
          <tr class="text-gray-400 border-b border-gray-800 pb-1">
            <th class="py-1">標的</th>
            <th class="text-right">價格</th>
            <th class="text-right">5M突破</th>
            <th class="text-right">15M突破</th>
            <th class="text-right">30M突破</th>
            <th class="text-right pr-1">強度</th>
          </tr>
        </thead>
        <tbody id="bull-5m15m30m-tbody" class="divide-y divide-gray-800/40">
          <tr>
            <td colspan="6" class="text-center py-4 text-gray-500">行情資料載入中...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 頁尾免責聲明 -->
    <div class="text-center text-[10px] text-gray-500 pt-2">
      資料來源：幣安公開 API。須同時突破 5MA 與 20MA 方可入選。
    </div>

  </div>

  <!-- 幣安 API 腳本 -->
  <script>
    const BINANCE_TICKER_URL = 'https://fapi.binance.com/fapi/v1/ticker/24hr';
    const BINANCE_KLINES_URL = 'https://fapi.binance.com/fapi/v1/klines';

    function calculateSMA(data, period) {
      if (data.length < period) return null;
      const slice = data.slice(-period);
      const sum = slice.reduce((acc, val) => acc + val, 0);
      return sum / period;
    }

    // 模擬 2m 週期：將 1m K線兩兩合併
    async function fetchCustomIntervalData(symbol, currentPrice, targetMinutes, period = 20) {
      try {
        const limit = period * targetMinutes + 5;
        const res = await fetch(`${BINANCE_KLINES_URL}?symbol=${symbol}&interval=1m&limit=${limit}`);
        const data = await res.json();
        
        const candles = data.map(item => ({
          close: parseFloat(item[4])
        }));
        
        const aggregatedCloses = [];
        for (let i = 0; i <= candles.length - targetMinutes; i += targetMinutes) {
          const chunk = candles.slice(i, i + targetMinutes);
          if (chunk.length === targetMinutes) {
            aggregatedCloses.push(chunk[chunk.length - 1].close);
          }
        }
        
        if (aggregatedCloses.length < period) return { valid: false, ma20Diff: 0 };
        
        const ma5 = calculateSMA(aggregatedCloses, 5);
        const ma20 = calculateSMA(aggregatedCloses, 20);
        
        if (!ma5 || !ma20) return { valid: false, ma20Diff: 0 };
        
        const ma5Diff = ((currentPrice - ma5) / ma5) * 100;
        const ma20Diff = ((currentPrice - ma20) / ma20) * 100;
        
        // 必須同時突破 5MA 與 20MA (即價格高於兩者)
        const valid = currentPrice > ma5 && currentPrice > ma20;
        
        return { valid, ma20Diff };
      } catch (err) {
        return { valid: false, ma20Diff: 0 };
      }
    }

    async function fetchIntervalMA(symbol, currentPrice, interval) {
      try {
        if (interval === '2m') {
          return await fetchCustomIntervalData(symbol, currentPrice, 2, 20);
        } else {
          const res = await fetch(`${BINANCE_KLINES_URL}?symbol=${symbol}&interval=${interval}&limit=25`);
          const data = await res.json();
          const closePrices = data.map(item => parseFloat(item[4]));
          const ma5 = calculateSMA(closePrices, 5);
          const ma20 = calculateSMA(closePrices, 20);
          
          if (!ma5 || !ma20) return { valid: false, ma20Diff: 0 };
          
          const ma5Diff = ((currentPrice - ma5) / ma5) * 100;
          const ma20Diff = ((currentPrice - ma20) / ma20) * 100;
          
          const valid = currentPrice > ma5 && currentPrice > ma20;
          
          return { valid, ma20Diff };
        }
      } catch (err) {
        return { valid: false, ma20Diff: 0 };
      }
    }

    async function updateMarketScanner() {
      try {
        const res = await fetch(BINANCE_TICKER_URL);
        const tickers = await res.json();

        const usdtPairs = tickers
          .filter(t => t.symbol.endsWith('USDT') && !t.symbol.startsWith('USDC'))
          .sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
          .slice(0, 30);

        const marketData = await Promise.all(
          usdtPairs.map(async (item) => {
            const symbol = item.symbol.replace('USDT', '');
            const price = parseFloat(item.lastPrice);
            
            const [res1m, res2m, res3m, res5m, res15m, res30m] = await Promise.all([
              fetchIntervalMA(item.symbol, price, '1m'),
              fetchIntervalMA(item.symbol, price, '2m'),
              fetchIntervalMA(item.symbol, price, '3m'),
              fetchIntervalMA(item.symbol, price, '5m'),
              fetchIntervalMA(item.symbol, price, '15m'),
              fetchIntervalMA(item.symbol, price, '30m')
            ]);
            
            return {
              symbol,
              fullSymbol: item.symbol,
              price,
              res1m,
              res2m,
              res3m,
              res5m,
              res15m,
              res30m
            };
          })
        );

        // 1. 1M + 2M + 15M 雙MA同步突破
        const list1m2m15m = marketData
          .filter(d => d.res1m.valid && d.res2m.valid && d.res15m.valid)
          .sort((a, b) => (b.res1m.ma20Diff + b.res2m.ma20Diff + b.res15m.ma20Diff) - (a.res1m.ma20Diff + a.res2m.ma20Diff + a.res15m.ma20Diff))
          .slice(0, 8);

        // 2. 3M + 5M + 15M 雙MA同步突破
        const list3m5m15m = marketData
          .filter(d => d.res3m.valid && d.res5m.valid && d.res15m.valid)
          .sort((a, b) => (b.res3m.ma20Diff + b.res5m.ma20Diff + b.res15m.ma20Diff) - (a.res3m.ma20Diff + a.res5m.ma20Diff + a.res15m.ma20Diff))
          .slice(0, 8);

        // 3. 5M + 15M + 30M 雙MA同步突破
        const list5m15m30m = marketData
          .filter(d => d.res5m.valid && d.res15m.valid && d.res30m.valid)
          .sort((a, b) => (b.res5m.ma20Diff + b.res15m.ma20Diff + b.res30m.ma20Diff) - (a.res5m.ma20Diff + a.res15m.ma20Diff + a.res30m.ma20Diff))
          .slice(0, 8);

        // 渲染表格
        renderTripleTable('bull-1m2m15m-tbody', list1m2m15m, 'res1m', 'res2m', 'res15m', 'bg-cyan-400');
        renderTripleTable('bull-3m5m15m-tbody', list3m5m15m, 'res3m', 'res5m', 'res15m', 'bg-amber-400');
        renderTripleTable('bull-5m15m30m-tbody', list5m15m30m, 'res5m', 'res15m', 'res30m', 'bg-rose-500');
        
        document.getElementById('update-time').innerText = new Date().toLocaleTimeString('zh-TW', { hour12: false });

      } catch (error) {
        console.error('更新資料失敗:', error);
      }
    }

    function renderTripleTable(elementId, dataList, k1, k2, k3, barColorClass) {
      const tbody = document.getElementById(elementId);
      if (dataList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-3 text-gray-500">無符合共振標的</td></tr>`;
        return;
      }

      tbody.innerHTML = dataList.map(item => {
        const val1 = item[k1].ma20Diff;
        const val2 = item[k2].ma20Diff;
        const val3 = item[k3].ma20Diff;
        const avgScore = (val1 + val2 + val3) / 3;
        const barWidth = Math.min(avgScore * 3, 16);
        const binanceUrl = `https://www.binance.com/zh-TC/futures/${item.fullSymbol}`;

        return `
          <tr class="hover:bg-gray-800/20 transition-colors">
            <td class="py-2 font-medium">
              <a href="${binanceUrl}" target="_blank" rel="noopener noreferrer" class="text-gray-200 hover:text-amber-400 underline underline-offset-2 decoration-gray-600 hover:decoration-amber-400 transition-colors">
                ${item.symbol}
              </a>
            </td>
            <td class="text-right">${item.price < 1 ? item.price.toFixed(4) : item.price.toFixed(2)}</td>
            <td class="text-right text-rose-500">+${val1.toFixed(2)}%</td>
            <td class="text-right text-rose-500">+${val2.toFixed(2)}%</td>
            <td class="text-right text-rose-500">+${val3.toFixed(2)}%</td>
            <td class="text-right pl-2">
              <span class="inline-block h-1.5 ${barColorClass} rounded-full" style="width: ${Math.max(barWidth, 6)}px"></span>
            </td>
          </tr>
        `;
      }).join('');
    }

    updateMarketScanner();
    setInterval(updateMarketScanner, 60000);
  </script>
</body>
</html>
