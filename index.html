<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1H BOLL + VolMA 策略極速掃描儀 Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

        :root {
            --bg-dark: #06080d;
            --card-bg: rgba(13, 17, 23, 0.65);
            --card-hover: rgba(22, 29, 41, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #64748b;
            --yellow: #f0b90b;
            --yellow-glow: rgba(240, 185, 11, 0.3);
            --green: #10b981;
            --green-bg: rgba(16, 185, 129, 0.15);
            --red: #f43f5e;
            --red-bg: rgba(244, 63, 94, 0.15);
            --purple: #a855f7;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            margin: 0; 
            padding-bottom: 30px; 
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 背景流動光暈動畫 */
        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: -1; overflow: hidden;
        }
        .glow-sphere {
            position: absolute; width: 350px; height: 350px; border-radius: 50%;
            filter: blur(100px); opacity: 0.18; animation: floatGlow 14s infinite alternate ease-in-out;
        }
        .glow-1 { top: -80px; left: -80px; background: var(--yellow); }
        .glow-2 { bottom: -80px; right: -80px; background: var(--purple); animation-delay: -7s; }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(70px, 50px) scale(1.25); }
        }

        /* 頁首 Header */
        .app-header { 
            position: sticky; top: 0; z-index: 100; 
            background: rgba(6, 8, 13, 0.75); 
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            padding: 14px 18px; 
            border-bottom: 1px solid var(--card-border); 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .header-title { 
            font-weight: 800; font-size: 1.15rem; letter-spacing: -0.4px;
            display: flex; align-items: center; gap: 8px; 
            background: linear-gradient(135deg, #ffffff 40%, var(--yellow) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .scan-btn { 
            position: relative; overflow: hidden;
            background: linear-gradient(135deg, var(--yellow), #e0a800); 
            color: #0d0f14; border: none; 
            padding: 9px 22px; border-radius: 20px; font-weight: 800; 
            font-size: 0.85rem; cursor: pointer; 
            box-shadow: 0 4px 20px var(--yellow-glow);
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1); 
        }
        .scan-btn::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: rotate(30deg); animation: buttonShimmer 3s infinite;
        }
        @keyframes buttonShimmer { 0% { transform: translateX(-100%) rotate(30deg); } 100% { transform: translateX(100%) rotate(30deg); } }
        .scan-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px var(--yellow-glow); }
        .scan-btn:active { transform: scale(0.95); }
        .scan-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

        /* 進度條 */
        .progress-container { height: 3px; background: rgba(255,255,255,0.03); width: 100%; position: relative; }
        .progress-fill { 
            height: 100%; width: 0%; 
            background: linear-gradient(90deg, var(--yellow), var(--green)); 
            transition: width 0.2s cubic-bezier(0.1, 0.9, 0.2, 1); 
            box-shadow: 0 0 12px var(--green);
        }

        /* 切換頁籤 (Tab) */
        .strategy-selector { display: flex; gap: 8px; padding: 14px 16px 0 16px; }
        .tab-btn {
            flex: 1; padding: 10px 4px; border-radius: 12px; font-size: 0.75rem; font-weight: 700;
            background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-sub);
            cursor: pointer; text-align: center; transition: all 0.25s ease; backdrop-filter: blur(12px);
        }
        .tab-btn.active {
            background: rgba(240, 185, 11, 0.12); border-color: var(--yellow); color: var(--yellow);
            box-shadow: 0 0 16px rgba(240, 185, 11, 0.15);
        }
        .tab-btn.active-entry {
            background: var(--green-bg); border-color: var(--green); color: var(--green);
            box-shadow: 0 0 16px rgba(16, 185, 129, 0.2);
        }
        .tab-btn.active-exit {
            background: var(--red-bg); border-color: var(--red); color: var(--red);
            box-shadow: 0 0 16px rgba(244, 63, 94, 0.2);
        }

        /* 數據看板 */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 16px 4px 16px; }
        .stat-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 14px; padding: 10px 6px; text-align: center; backdrop-filter: blur(12px);
            transition: transform 0.2s ease;
        }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-card .val { font-family: 'JetBrains Mono', monospace; font-size: 1.15rem; font-weight: 700; color: #fff; }
        .stat-card .lbl { font-size: 0.65rem; color: var(--text-sub); margin-top: 3px; font-weight: 600; }
        .stat-card.entry .val { color: var(--green); }
        .stat-card.exit .val { color: var(--red); }

        /* 工具列與搜尋 */
        .toolbar { padding: 10px 16px 12px 16px; display: flex; gap: 8px; align-items: center; }
        .search-wrapper { position: relative; flex: 1; display: flex; align-items: center; }
        .search-input { 
            width: 100%; background: var(--card-bg); border: 1px solid var(--card-border); 
            color: var(--text-main); padding: 9px 30px 9px 12px; border-radius: 12px; 
            font-size: 0.85rem; transition: all 0.25s ease; backdrop-filter: blur(10px);
        }
        .search-input:focus { border-color: var(--yellow); box-shadow: 0 0 0 3px var(--yellow-glow); }
        .clear-btn { position: absolute; right: 10px; background: none; border: none; color: var(--text-sub); cursor: pointer; font-size: 0.9rem; display: none; }
        
        .tool-btn { 
            background: var(--card-bg); border: 1px solid var(--card-border); 
            color: var(--text-sub); padding: 9px 14px; border-radius: 12px; 
            font-size: 0.75rem; cursor: pointer; font-weight: 700; white-space: nowrap; backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }
        .tool-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text-main); }

        .status-bar { padding: 0 16px 8px 16px; font-size: 0.75rem; color: var(--text-sub); display: flex; justify-content: space-between; align-items: center; }
        .container { padding: 0 16px; }
        
        /* 幣種列表卡片 (動畫靈魂) */
        .symbol-card { 
            background: var(--card-bg); border: 1px solid var(--card-border); 
            border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; 
            display: flex; justify-content: space-between; align-items: center; 
            text-decoration: none; color: inherit; backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            animation: cardSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0; transform: translateY(16px);
        }
        .symbol-card:hover { 
            transform: translateY(-3px) scale(1.008); 
            border-color: rgba(240, 185, 11, 0.4); 
            background: var(--card-hover);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        @keyframes cardSlideUp { to { opacity: 1; transform: translateY(0); } }

        .symbol-info .name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .symbol-info .name { font-size: 1.15rem; font-weight: 800; letter-spacing: 0.2px; }
        
        .symbol-metrics { text-align: right; }
        .symbol-metrics .price { font-size: 1.1rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
        
        /* 標籤與動態呼吸燈 */
        .badge-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
        .badge { font-size: 0.68rem; padding: 4px 9px; border-radius: 8px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
        .badge-entry { background-color: var(--green-bg); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-exit { background-color: var(--red-bg); color: var(--red); border: 1px solid rgba(244, 63, 94, 0.3); }
        
        .pulse-dot {
            width: 6px; height: 6px; border-radius: 50%; background-color: currentColor;
            box-shadow: 0 0 8px currentColor; animation: pulseGlow 1.6s infinite ease-in-out;
        }
        @keyframes pulseGlow { 0%, 100% { opacity: 0.4; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.3); } }

        .change-badge { font-size: 0.75rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; }
        .change-up { color: var(--green); background-color: var(--green-bg); }
        .change-down { color: var(--red); background-color: var(--red-bg); }

        /* 載入骨架屏 (Skeleton Screen) */
        .skeleton-card {
            height: 76px; border-radius: 16px; margin-bottom: 10px;
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 37%, rgba(255,255,255,0.03) 63%);
            background-size: 400% 100%; animation: skeletonLoading 1.4s ease infinite;
        }
        @keyframes skeletonLoading { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
        
        .empty-tip { text-align: center; padding: 60px 0; color: var(--text-sub); font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="ambient-bg">
        <div class="glow-sphere glow-1"></div>
        <div class="glow-sphere glow-2"></div>
    </div>

    <div class="app-header">
        <div class="header-title">⚡ 1H 進出場訊號極速掃描儀</div>
        <button id="scanBtn" class="scan-btn" onclick="startScan()">極速掃描</button>
    </div>

    <div class="progress-container"><div id="progress" class="progress-fill"></div></div>

    <div class="strategy-selector">
        <div id="tabAll" class="tab-btn active" onclick="switchTab('ALL')">全部顯示</div>
        <div id="tabEntry" class="tab-btn" onclick="switchTab('ENTRY')">🎯 入場訊號</div>
        <div id="tabExit" class="tab-btn" onclick="switchTab('EXIT')">🚨 出場訊號</div>
    </div>

    <div class="dashboard">
        <div class="stat-card">
            <div class="val" id="statTotal">0</div>
            <div class="lbl">掃描總數</div>
        </div>
        <div class="stat-card entry">
            <div class="val" id="statEntry">0</div>
            <div class="lbl">買入入場</div>
        </div>
        <div class="stat-card exit">
            <div class="val" id="statExit">0</div>
            <div class="lbl">爆量離場</div>
        </div>
    </div>

    <div class="toolbar">
        <div class="search-wrapper">
            <input type="text" id="searchInput" class="search-input" placeholder="搜尋幣種 (例: BTC)..." oninput="onSearchInput()">
            <button id="clearBtn" class="clear-btn" onclick="clearSearch()">✕</button>
        </div>
        <button class="tool-btn" id="sortBtn" onclick="toggleSort()">漲幅 ⬇</button>
    </div>

    <div class="status-bar">
        <span id="statusText">準備就緒，點擊「極速掃描」</span>
        <span id="countText">顯示 0 筆</span>
    </div>

    <div class="container" id="symbolList"></div>

<script>
    // Binance API 節點輪詢備援
    const API_ENDPOINTS = [
        'https://fapi.binance.com',
        'https://fapi1.binance.com',
        'https://fapi2.binance.com'
    ];
    let currentEndpointIdx = 0;

    let rawResults = [];
    let ticker24hMap = {};
    let sortDesc = true;
    let isScanning = false;
    let totalSymbolCount = 0;
    let currentFilter = 'ALL';

    // 高效能 Fetch + 併發超時斷路機制 (1.2秒快速響應)
    async function fetchWithFallback(path, timeoutMs = 1200) {
        for (let i = 0; i < API_ENDPOINTS.length; i++) {
            const endpoint = API_ENDPOINTS[(currentEndpointIdx + i) % API_ENDPOINTS.length];
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const response = await fetch(`${endpoint}${path}`, { signal: controller.signal });
                clearTimeout(id);
                if (response.ok) {
                    currentEndpointIdx = (currentEndpointIdx + i) % API_ENDPOINTS.length;
                    return await response.json();
                }
            } catch (e) { clearTimeout(id); }
        }
        return null;
    }

    function calculateSMA(array, period) {
        const len = array.length;
        if (len < period) return 0;
        let sum = 0;
        for (let i = len - period; i < len; i++) sum += array[i];
        return sum / period;
    }

    async function fetch24hTickers() { 
        const data = await fetchWithFallback('/fapi/v1/ticker/24hr', 2000); 
        if (!data || !Array.isArray(data)) return {};
        const map = {}; 
        for (let i = 0; i < data.length; i++) {
            map[data[i].symbol] = parseFloat(data[i].priceChangePercent);
        }
        return map; 
    }

    async function getUSDTFuturesSymbols() { 
        const data = await fetchWithFallback('/fapi/v1/exchangeInfo', 2000); 
        if (!data || !data.symbols) return [];
        return data.symbols
            .filter(s => s.quoteAsset === 'USDT' && s.contractType === 'PERPETUAL' && s.status === 'TRADING')
            .map(s => s.symbol); 
    }

    // 核心指標運算
    async function processSymbol(symbol) {
        try {
            const res1h = await fetchWithFallback(`/fapi/v1/klines?symbol=${symbol}&interval=1h&limit=30`, 1200);
            if (!res1h || res1h.length < 20) return null;

            const len = res1h.length;
            const closes = new Float64Array(len);
            const opens = new Float64Array(len);
            const volumes = new Float64Array(len);

            for (let i = 0; i < len; i++) {
                opens[i] = parseFloat(res1h[i][1]);
                closes[i] = parseFloat(res1h[i][4]);
                volumes[i] = parseFloat(res1h[i][5]);
            }

            const currentPrice = closes[len - 1];
            const currentOpen = opens[len - 1];
            const currentVol = volumes[len - 1];

            // 1. 計算價格 MA5
            const ma5 = calculateSMA(closes, 5);

            // 2. 計算成交量 Vol MA(5) 與 Vol MA(15)
            const volMa5 = calculateSMA(volumes, 5);
            const volMa15 = calculateSMA(volumes, 15);

            // 【入場訊號】價格 >= MA5 且 5 Vol MA > 15 Vol MA
            const isEntrySignal = (currentPrice >= ma5) && (volMa5 > volMa15);

            // 【出場訊號】高位爆量陰線 (Close < Open 且 Volume > 1.5 * Vol MA15)
            const isExitSignal = (currentPrice < currentOpen) && (currentVol > volMa15 * 1.5);

            if (isEntrySignal || isExitSignal) {
                return { 
                    symbol, 
                    price: currentPrice, 
                    priceChange24h: ticker24hMap[symbol] || 0, 
                    isEntrySignal, 
                    isExitSignal 
                };
            }
            return null;
        } catch (e) { return null; }
    }

    // 併發批次調優：chunkSize 由 35 提升至 50，大幅加快速度
    async function runFastScanner(symbols, chunkSize = 50, onProgress) {
        let completed = 0;
        const results = [];
        for (let i = 0; i < symbols.length; i += chunkSize) {
            const chunk = symbols.slice(i, i + chunkSize);
            const chunkPromises = chunk.map(s => processSymbol(s));
            const settled = await Promise.allSettled(chunkPromises);
            
            for (let res of settled) {
                if (res.status === 'fulfilled' && res.value) results.push(res.value);
            }
            completed += chunk.length;
            onProgress(completed, symbols.length);
        }
        return results;
    }

    function renderSkeleton() {
        const container = document.getElementById('symbolList');
        container.innerHTML = Array(6).fill(0).map(() => `<div class="skeleton-card"></div>`).join('');
    }

    function updateDashboard() {
        document.getElementById('statTotal').innerText = totalSymbolCount;
        const entryCount = rawResults.filter(r => r.isEntrySignal).length;
        const exitCount = rawResults.filter(r => r.isExitSignal).length;
        document.getElementById('statEntry').innerText = entryCount;
        document.getElementById('statExit').innerText = exitCount;
    }

    async function startScan() {
        if (isScanning) return;
        isScanning = true;

        const btn = document.getElementById('scanBtn');
        const statusText = document.getElementById('statusText');
        btn.disabled = true; btn.innerText = "掃描中..."; 
        statusText.innerText = "讀取最新行情與量能數據...";
        rawResults = [];
        renderSkeleton();

        const [tickers, symbols] = await Promise.all([fetch24hTickers(), getUSDTFuturesSymbols()]);
        ticker24hMap = tickers;
        totalSymbolCount = symbols.length;
        
        if (symbols.length === 0) {
            statusText.innerText = "網路連線失敗，請重試";
            btn.disabled = false; btn.innerText = "極速掃描";
            isScanning = false;
            return;
        }

        let lastRenderTime = 0;

        rawResults = await runFastScanner(symbols, 50, (completed, total) => {
            const pct = Math.floor((completed / total) * 100);
            document.getElementById('progress').style.width = `${pct}%`;
            statusText.innerText = `訊號計算中 (${completed}/${total})...`;

            const now = Date.now();
            if (now - lastRenderTime > 150) {
                lastRenderTime = now;
                updateDashboard();
                renderList();
            }
        });

        updateDashboard();
        statusText.innerText = "掃描完成";
        btn.disabled = false; btn.innerText = "極速掃描";
        isScanning = false;
        renderList();
    }

    function switchTab(type) {
        currentFilter = type;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.className = 'tab-btn');
        if (type === 'ALL') document.getElementById('tabAll').classList.add('active');
        if (type === 'ENTRY') document.getElementById('tabEntry').classList.add('active-entry');
        if (type === 'EXIT') document.getElementById('tabExit').classList.add('active-exit');
        renderList();
    }

    function toggleSort() { 
        sortDesc = !sortDesc; 
        document.getElementById('sortBtn').innerText = sortDesc ? "漲幅 ⬇" : "漲幅 ⬆";
        renderList(); 
    }

    function onSearchInput() {
        const input = document.getElementById('searchInput');
        document.getElementById('clearBtn').style.display = input.value ? 'block' : 'none';
        renderList();
    }

    function clearSearch() {
        const input = document.getElementById('searchInput');
        input.value = '';
        document.getElementById('clearBtn').style.display = 'none';
        renderList();
    }

    function getFilteredData() {
        const query = document.getElementById('searchInput').value.toUpperCase().trim();
        return rawResults.filter(item => {
            const matchesQuery = item.symbol.includes(query);
            if (currentFilter === 'ENTRY') return matchesQuery && item.isEntrySignal;
            if (currentFilter === 'EXIT') return matchesQuery && item.isExitSignal;
            return matchesQuery;
        });
    }

    function renderList() {
        const container = document.getElementById('symbolList');
        let data = getFilteredData();
        data.sort((a, b) => sortDesc ? b.priceChange24h - a.priceChange24h : a.priceChange24h - b.priceChange24h);
        
        document.getElementById('countText').innerText = `顯示 ${data.length} / 符合 ${rawResults.length} 筆`;

        if (data.length === 0) {
            container.innerHTML = `<div class="empty-tip">${rawResults.length === 0 && !isScanning ? '點擊右上角「極速掃描」開啟算力運算' : '尚無符合條件的標的'}</div>`;
            return;
        }

        container.innerHTML = data.map((item, index) => {
            const animDelay = index < 12 ? (index * 0.025).toFixed(3) : 0;
            return `
            <a class="symbol-card" href="https://www.binance.com/zh-TC/futures/${item.symbol}" target="_blank" style="animation-delay: ${animDelay}s;">
                <div class="symbol-info">
                    <div class="name-row">
                        <span class="name">${item.symbol.replace('USDT', '')}</span>
                        <span class="change-badge ${item.priceChange24h >= 0 ? 'change-up' : 'change-down'}">
                            ${item.priceChange24h >= 0 ? '+' : ''}${item.priceChange24h.toFixed(2)}%
                        </span>
                    </div>
                    <div class="badge-list">
                        ${item.isEntrySignal ? `
                            <span class="badge badge-entry">
                                <span class="pulse-dot"></span>
                                🎯 買入入場 (5Vol > 15Vol)
                            </span>` : ''}
                        ${item.isExitSignal ? `
                            <span class="badge badge-exit">
                                <span class="pulse-dot"></span>
                                🚨 爆量出場 (高位陰線)
                            </span>` : ''}
                    </div>
                </div>
                <div class="symbol-metrics">
                    <div class="price">${item.price}</div>
                </div>
            </a>
            `;
        }).join('');
    }
</script>
</body>
</html>
