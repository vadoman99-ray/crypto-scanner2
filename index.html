<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幣安合約動能掃描器 Pro</title>
    <style>
        :root {
            --bg-color: #0b0e11;
            --sidebar-bg: #161a1e;
            --card-bg: #1e2329;
            --card-hover: #2b313a;
            --card-border: #2b313a;
            --text-main: #eaecef;
            --text-sub: #848e9c;
            --yellow: #f0b90b;
            --yellow-hover: #fcd535;
            --green: #0ecb81;
            --green-bg: rgba(14, 203, 129, 0.15);
            --red: #f6465d;
            --red-bg: rgba(246, 70, 93, 0.15);
            --fire: #ff6d00;
            --fire-bg: rgba(255, 109, 0, 0.15);
            --breakout: #e040fb;
            --breakout-bg: rgba(224, 64, 251, 0.18);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* 左側導覽列 */
        .sidebar { width: 70px; background-color: var(--sidebar-bg); border-right: 1px solid var(--card-border); display: flex; flex-direction: column; align-items: center; padding: 20px 0; z-index: 101; }
        .nav-item { width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-sub); padding: 16px 0; cursor: pointer; transition: all 0.2s; border: none; background: none; }
        .nav-item:hover { color: var(--text-main); }
        .nav-item.active { color: var(--yellow); background: rgba(240, 185, 11, 0.08); border-right: 2px solid var(--yellow); }
        .nav-icon { font-size: 1.3rem; margin-bottom: 4px; }
        .nav-text { font-size: 0.65rem; font-weight: 600; }

        /* 主內容區 */
        .main-wrapper { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }

        /* 頂部標頭 */
        .app-header { background-color: rgba(30, 35, 41, 0.95); backdrop-filter: blur(8px); padding: 12px 16px; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 90; }
        .header-title { font-weight: 800; font-size: 1rem; display: flex; align-items: center; gap: 6px; }
        .scan-btn { background-color: var(--yellow); color: #000; border: none; padding: 7px 14px; border-radius: 20px; font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; }
        .scan-btn:active { transform: scale(0.95); }
        .scan-btn:disabled { opacity: 0.5; }

        .progress-bar { height: 2px; background: var(--card-border); width: 100%; }
        .progress-fill { height: 100%; width: 0%; background: var(--yellow); transition: width 0.15s ease-out; }

        /* 工具列 */
        .toolbar { padding: 10px 16px; background: rgba(30, 35, 41, 0.6); display: flex; gap: 8px; align-items: center; }
        .search-input { flex: 1; background: var(--bg-color); border: 1px solid var(--card-border); color: var(--text-main); padding: 7px 12px; border-radius: 8px; font-size: 0.85rem; outline: none; }
        .tool-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-sub); padding: 7px 12px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; font-weight: 600; }

        .container { padding: 16px; }

        /* 清單樣式 */
        .symbol-card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: inherit; }
        .symbol-card:active { border-color: var(--yellow); background-color: var(--card-hover); }
        .symbol-info .name { font-size: 1rem; font-weight: 700; margin-bottom: 2px; }
        .price { font-family: monospace; font-weight: 700; }
        
        /* 標籤 */
        .badge { font-size: 0.65rem; padding: 2px 5px; border-radius: 4px; font-weight: 600; display: inline-block; margin-right: 3px; }
        .badge-above { background-color: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
        .badge-below { background-color: rgba(240, 185, 11, 0.15); color: var(--yellow); border: 1px solid var(--yellow); }
        .badge-breakout { background-color: var(--breakout-bg); color: var(--breakout); border: 1px solid var(--breakout); }
        .badge-fire { background-color: var(--fire-bg); color: var(--fire); border: 1px solid var(--fire); }
        
        .change-badge { font-size: 0.75rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        .change-up { color: var(--green); background-color: var(--green-bg); }
        .change-down { color: var(--red); background-color: var(--red-bg); }

        /* 說明卡片 */
        .about-card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-left: 4px solid var(--yellow); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
        .about-title { font-size: 0.9rem; font-weight: 700; color: var(--yellow); margin-bottom: 8px; }
        .about-content { font-size: 0.85rem; color: #d1d5db; line-height: 1.5; }
        .doc-badge { font-size: 0.75rem; padding: 1px 5px; border-radius: 4px; font-weight: 700; border: 1px solid currentColor; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <button class="nav-item active" onclick="setFilter('ALL', this)"><div class="nav-icon">🌐</div><div class="nav-text">全部</div></button>
        <button class="nav-item" onclick="setFilter('ABOVE_5MA', this)"><div class="nav-icon">🟢</div><div class="nav-text">5MA上</div></button>
        <button class="nav-item" onclick="setFilter('BELOW_5MA', this)"><div class="nav-icon">🟡</div><div class="nav-text">5MA下</div></button>
        <button class="nav-item" onclick="setFilter('BREAKOUT', this)"><div class="nav-icon">⚡</div><div class="nav-text">突破</div></button>
        <button class="nav-item" onclick="setFilter('ABOVE_BB', this)"><div class="nav-icon">🔥</div><div class="nav-text">上軌</div></button>
        <button class="nav-item" onclick="setFilter('INFO', this)"><div class="nav-icon">ℹ️</div><div class="nav-text">說明</div></button>
    </aside>

    <main class="main-wrapper">
        <div class="app-header">
            <div class="header-title">⚡ 1H 20MA 掃描器</div>
            <button id="scanBtn" class="scan-btn" onclick="startScan()">重新掃描</button>
        </div>
        <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>

        <div class="toolbar" id="toolbar">
            <input type="text" id="searchInput" class="search-input" placeholder="搜尋..." oninput="renderList()">
            <button class="tool-btn" id="sortBtn" onclick="toggleSort()">漲幅 ⬇</button>
        </div>

        <div class="container" id="symbolList">
            <div style="text-align: center; color: var(--text-sub); margin-top: 50px;">點擊掃描開始分析...</div>
        </div>
    </main>

<script>
    // [邏輯保持與前版完全一致]
    let rawResults = [];
    let currentFilter = 'ALL';
    let ticker24hMap = {};
    let sortDesc = true;

    function calculateSMA(data, count) { if (data.length < count) return 0; return data.slice(-count).reduce((sum, val) => sum + val, 0) / count; }
    function calculateBBAt(prices, index, period = 20) { if (index < period - 1) return Infinity; const slice = prices.slice(index - period + 1, index + 1); const sma = slice.reduce((a, b) => a + b, 0) / period; const variance = slice.reduce((a, b) => a + Math.pow(b - sma, 2), 0) / period; return sma + (2 * Math.sqrt(variance)); }
    async function fetch24hTickers() { try { const res = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr'); const data = await res.json(); const map = {}; data.forEach(item => { map[item.symbol] = parseFloat(item.priceChangePercent); }); return map; } catch(e) { return {}; } }
    async function getUSDTFuturesSymbols() { const res = await fetch('https://fapi.binance.com/fapi/v1/exchangeInfo'); const data = await res.json(); return data.symbols.filter(s => s.quoteAsset === 'USDT' && s.contractType === 'PERPETUAL' && s.status === 'TRADING').map(s => s.symbol); }

    async function processSymbol(symbol) {
        try {
            const [res1h, res15m] = await Promise.all([
                fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=1h&limit=30`).then(r => r.json()),
                fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=15m&limit=35`).then(r => r.json())
            ]);
            const closes1h = res1h.map(k => parseFloat(k[4]));
            const currentClose1h = closes1h[closes1h.length - 1];
            const ma20 = calculateSMA(closes1h, 20);
            const ma5 = calculateSMA(closes1h, 5);

            if (currentClose1h > ma20) {
                const closes15m = res15m.map(k => parseFloat(k[4]));
                const currIdx = closes15m.length - 1;
                const prevIdx = currIdx - 1;
                const currClose = closes15m[currIdx];
                const prevClose = closes15m[prevIdx];
                const currUpperBB = calculateBBAt(closes15m, currIdx);
                const prevUpperBB = calculateBBAt(closes15m, prevIdx);
                return { symbol: symbol, price: currentClose1h, ma20: ma20, isAboveMa5: currentClose1h >= ma5, isAbove15mBB: currClose >= currUpperBB, isJustBreakout15mBB: (prevClose < prevUpperBB && currClose >= currUpperBB), priceChange24h: ticker24hMap[symbol] || 0 };
            }
            return null;
        } catch (e) { return null; }
    }

    async function startScan() {
        const scanBtn = document.getElementById('scanBtn');
        scanBtn.disabled = true; scanBtn.innerText = "掃描中..."; rawResults = [];
        if (currentFilter === 'INFO') setFilter('ALL', document.querySelectorAll('.nav-item')[0]);
        ticker24hMap = await fetch24hTickers();
        const symbols = await getUSDTFuturesSymbols();
        const batchSize = 12;
        let processed = 0;
        for (let i = 0; i < symbols.length; i += batchSize) {
            const batch = symbols.slice(i, i + batchSize);
            const results = await Promise.all(batch.map(sym => processSymbol(sym)));
            results.forEach(res => { if (res) rawResults.push(res); });
            processed += batch.length;
            document.getElementById('progress').style.width = `${Math.floor((processed / symbols.length) * 100)}%`;
            if (currentFilter !== 'INFO') renderList();
        }
        scanBtn.disabled = false; scanBtn.innerText = "重新掃描";
    }

    function toggleSort() { sortDesc = !sortDesc; document.getElementById('sortBtn').innerText = sortDesc ? '漲幅 ⬇' : '漲幅 ⬆'; renderList(); }
    function setFilter(filter, el) { currentFilter = filter; document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active')); el.classList.add('active'); if (filter === 'INFO') { document.getElementById('toolbar').style.display = 'none'; renderInfoPage(); } else { document.getElementById('toolbar').style.display = 'flex'; renderList(); } }
    function getFilteredData() { const query = document.getElementById('searchInput').value.toUpperCase(); return rawResults.filter(item => item.symbol.includes(query)).filter(item => { if (currentFilter === 'ABOVE_5MA') return item.isAboveMa5; if (currentFilter === 'BELOW_5MA') return !item.isAboveMa5; if (currentFilter === 'BREAKOUT') return item.isJustBreakout15mBB; if (currentFilter === 'ABOVE_BB') return item.isAbove15mBB; return true; }); }
    
    function renderInfoPage() {
        const container = document.getElementById('symbolList');
        container.innerHTML = `
            <div class="about-card"><div class="about-title">🎯 工具核心設計理念</div><div class="about-content">本工具專為<b>幣安 USDT 永續合約</b>打造，旨在協助交易者迅速篩選出具備<b>多頭趨勢慣性</b>與<b>短期爆發潛力</b>的標的，省去逐一翻圖的時間。</div></div>
            <div class="about-card"><div class="about-title">📊 基礎篩選條件 (主濾網)</div><div class="about-content"><ul><li><b>1H 20MA 多頭站上：</b>當前 1 小時 K 線收盤價高於 20MA。</li><li><b>24H 漲幅排序：</b>自動由高至低排列。</li></ul></div></div>
            <div class="about-card"><div class="about-title">🏷️ 分頁標籤與策略</div><div class="about-content"><ul><li><span class="doc-badge">🌐 全部</span>：所有符合 1H 20MA 上方者。</li><li><span class="doc-badge" style="color:var(--green)">🟢 5MA 上</span>：1H 價格站上 5MA。</li><li><span class="doc-badge" style="color:var(--yellow)">🟡 5MA 下</span>：1H 價格位於 5MA 下、20MA 上（回踩修正）。</li><li><span class="doc-badge" style="color:var(--breakout)">⚡ 剛突破</span>：15m 剛站上布林上軌。</li><li><span class="doc-badge" style="color:var(--fire)">🔥 上軌之上</span>：穩在布林上軌上方。</li></ul></div></div>
        `;
    }

    function renderList() {
        const container = document.getElementById('symbolList');
        let filtered = getFilteredData();
        filtered.sort((a, b) => sortDesc ? b.priceChange24h - a.priceChange24h : a.priceChange24h - b.priceChange24h);
        if (filtered.length === 0) { container.innerHTML = `<div style="text-align:center; padding:40px; color:#555;">沒有符合條件的標的</div>`; return; }
        container.innerHTML = filtered.map(item => {
            const changeFormatted = (item.priceChange24h >= 0 ? '+' : '') + item.priceChange24h.toFixed(2) + '%';
            let bbTag = item.isJustBreakout15mBB ? `<span class="badge badge-breakout">⚡ 剛突破</span>` : (item.isAbove15mBB ? `<span class="badge badge-fire">🔥 上軌上</span>` : '');
            return `<a class="symbol-card" href="https://www.binance.com/zh-TC/futures/${item.symbol}" target="_blank">
                <div class="symbol-info"><div class="name">${item.symbol.replace('USDT', '')}</div><div>${item.isAboveMa5 ? `<span class="badge badge-above">5MA 上</span>` : `<span class="badge badge-below">5MA 下</span>`}${bbTag}</div></div>
                <div style="text-align:right"><div class="price">${item.price}</div><span class="change-badge ${item.priceChange24h>=0?'change-up':'change-down'}">${changeFormatted}</span></div>
            </a>`;
        }).join('');
    }
</script>
</body>
</html>
