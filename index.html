<!DOCTYPE html>
<html lang="zh-TW">
<head>

<title>⚡ 極速多週期多頭排列儀表板 (>1億USDT)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=Noto+Sans+TC:wght@700;900&family=JetBrains+Mono:wght@700;800;900&display=swap');
:root {
    --bg-dark: #060911;
    --card-bg: rgba(15, 23, 42, 0.75);
    --border-color: rgba(0, 240, 255, 0.25);
    --manga-pink: #ff007f;

body {
    font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
    background-color: var(--bg-dark);
    background-image: radial-gradient(at 0% 0%, rgba(255, 0, 127, 0.12) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(0, 240, 255, 0.12) 0px, transparent 50%), radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);

}
body.modal-open { overflow: hidden; position: fixed; width: 100%; height: 100%; }
.app-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(8, 12, 22, 0.88);

}
.header-top { display: flex; justify-content: space-between; align-items: center; }
.header-title {
    font-size: 1.1rem;

    background: linear-gradient(135deg, #fff 30%, var(--manga-cyan));
    -webkit-background-clip: text;

    display: flex;
    align-items: center;
    gap: 6px;
}
.scan-btn {
    background: linear-gradient(135deg, var(--manga-pink) 0%, #ff5500 100%);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 900;
    font-size: 0.85rem;

    box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);

}
.scan-btn:active { transform: scale(0.95); }
.scan-btn:disabled { opacity: 0.5; filter: grayscale(1); cursor: not-allowed; }
.progress-container { height: 3px; background: rgba(255, 255, 255, 0.05); width: 100%; }

    backdrop-filter: blur(10px);

}
.top-pick-header {
    display: flex;
    justify-content: space-between;

}
.top-pick-title {

    background: rgba(0,0,0,0.6); color: var(--manga-cyan);

canvas { display: block; width: 100%; height: 100%; }

</style>

<body>
<div class="app-header">
    <div class="header-top">
        <div class="header-title">⚡ 極速多週期多頭排列儀表板 (>1億USDT)</div>

    </div>
</div>
<div class="progress-container"><div id="progress" class="progress-fill"></div></div>

<div id="topPickSection" class="top-pick-section" style="display: none;">
    <div class="top-pick-card">
        <div class="top-pick-header">
            <div class="top-pick-title">🔥 最佳進場標的推薦 (Top 5 貼近 60MA 支撐)</div>

    </div>

        <div class="val" id="statEntry">0</div>

    <button id="prevBtn" class="nav-btn prev" aria-label="上一隻">❮</button>
    <button id="nextBtn" class="nav-btn next" aria-label="下一隻">❯</button>
    <div id="chartBox" class="chart-box" role="dialog" aria-modal="true">
        <div class="chart-header">
            <div class="header-title-group">
                <span id="symbolRankTag" class="symbol-rank-tag">#1</span>
                <div id="symbolTitle" class="symbol-title">BTCUSDT</div>
            </div>
            <div class="legend-bar">
                <div class="legend-item"><div class="legend-color" style="background:#00ff66"></div>5MA</div>
                <div class="legend-item"><div class="legend-color" style="background:#ffea00"></div>30MA</div>
                <div class="legend-item"><div class="legend-color" style="background:#ff9100"></div>45MA</div>
                <div class="legend-item"><div class="legend-color" style="background:#ff007f"></div>60MA</div>
                <div class="legend-item"><div class="legend-color" style="background:#00f0ff"></div>5VM</div>
                <div class="legend-item"><div class="legend-color" style="background:#9d4edd"></div>20VM</div>
            </div>

        </div>
        <div class="charts-wrapper" id="chartsWrapper">
            <div class="chart-panel" id="wrapper15m" data-period="15m">
                <span class="panel-tag" id="tagText15m">15M</span>
                <canvas id="klineCanvas15m"></canvas>
            </div>
            <div class="chart-panel" id="wrapper1h" data-period="1h">
                <span class="panel-tag" id="tagText1h">1H</span>
                <canvas id="klineCanvas1h"></canvas>
            </div>
            <div class="chart-panel" id="wrapper4h" data-period="4h">
                <span class="panel-tag" id="tagText4h">4H</span>
                <canvas id="klineCanvas4h"></canvas>
            </div>
            <div class="chart-panel" id="wrapper1d" data-period="1d">
                <span class="panel-tag" id="tagText1d">1D</span>
                <canvas id="klineCanvas1d"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
(() => {
    const API_BASE = 'https://fapi.binance.com';
    const P0 = 5, P1 = 30, P2 = 45, P3 = 60;
    const COUNT_15M = 240;
    const COUNT_1H = 120;
    const COUNT_4H = 60;
    const COUNT_1D = 60;
    const MAX_VM_PERIOD = 20;

    const FETCH_LIMIT_15M = COUNT_15M + Math.max(P3, MAX_VM_PERIOD);
    const FETCH_LIMIT_1H = COUNT_1H + Math.max(P3, MAX_VM_PERIOD);
    const FETCH_LIMIT_4H = COUNT_4H + Math.max(P3, MAX_VM_PERIOD);
    const FETCH_LIMIT_1D = COUNT_1D + Math.max(P3, MAX_VM_PERIOD);

    let results15M = [];
    let results1H = [];
    let results4H = [];
    let results1D = [];
    let resultsMulti = [];
    let topPickSymbols = [];
    let activeTab = '15m';
    let tickerMap = new Map();
    let currentIndex = -1;
    let globalAllMatches = [];
    const klinesCache = new Map();

    // IndexedDB 快取管理
    let db = null;
    function initDB() {
        return new Promise((resolve) => {
            const request = indexedDB.open('CryptoDashboardDB', 1);
            request.onupgradeneeded = (e) => {
                const database = e.target.result;
                if (!database.objectStoreNames.contains('klines')) {
                    database.createObjectStore('klines', { keyPath: 'symbol' });
                }
            };
            request.onsuccess = (e) => {
                db = e.target.result;
                resolve(db);
            };
            request.onerror = () => resolve(null);
        });
    }

    function getCachedKlinesFromDB(symbols) {
        return new Promise((resolve) => {
            if (!db) return resolve(new Map());
            const transaction = db.transaction(['klines'], 'readonly');
            const store = transaction.objectStore('klines');
            const cachedMap = new Map();
            let count = 0;
            if (symbols.length === 0) return resolve(cachedMap);

            symbols.forEach(sym => {
                const req = store.get(sym);
                req.onsuccess = () => {
                    if (req.result && (Date.now() - req.result.timestamp < 15 * 60 * 1000)) { // 15分鐘內有效
                        cachedMap.set(sym, req.result.data);
                    }
                    count++;
                    if (count === symbols.length) resolve(cachedMap);
                };
                req.onerror = () => {
                    count++;
                    if (count === symbols.length) resolve(cachedMap);
                };
            });
        });
    }

    function saveKlinesToDB(symbolDataMap) {
        if (!db) return;
        const transaction = db.transaction(['klines'], 'readwrite');
        const store = transaction.objectStore('klines');
        symbolDataMap.forEach((data, symbol) => {
            store.put({ symbol, data, timestamp: Date.now() });
        });
    }

    const dom = {
        scanBtn: document.getElementById('scanBtn'),
        progress: document.getElementById('progress'),
        statTotal: document.getElementById('statTotal'),
        statEntry: document.getElementById('statEntry'),
        count15m: document.getElementById('count15m'),
        count1h: document.getElementById('count1h'),
        count4h: document.getElementById('count4h'),
        count1d: document.getElementById('count1d'),
        countMulti: document.getElementById('countMulti'),
        tab15m: document.getElementById('tab15m'),
        tab1h: document.getElementById('tab1h'),
        tab4h: document.getElementById('tab4h'),
        tab1d: document.getElementById('tab1d'),
        tabMulti: document.getElementById('tabMulti'),
        symbolList: document.getElementById('symbolList'),
        topPickSection: document.getElementById('topPickSection'),
        topPickList: document.getElementById('topPickList'),
        chartModal: document.getElementById('chartModal'),
        symbolTitle: document.getElementById('symbolTitle'),
        symbolRankTag: document.getElementById('symbolRankTag'),
        closeModalBtn: document.getElementById('closeModalBtn'),
        prevBtn: document.getElementById('prevBtn'),
        nextBtn: document.getElementById('nextBtn'),
        chartsWrapper: document.getElementById('chartsWrapper'),
        wrapper15m: document.getElementById('wrapper15m'),
        wrapper1h: document.getElementById('wrapper1h'),
        wrapper4h: document.getElementById('wrapper4h'),
        wrapper1d: document.getElementById('wrapper1d'),
        canvas15m: document.getElementById('klineCanvas15m'),
        canvas1h: document.getElementById('klineCanvas1h'),
        canvas4h: document.getElementById('klineCanvas4h'),
        canvas1d: document.getElementById('klineCanvas1d'),
        tagText15m: document.getElementById('tagText15m'),
        tagText1h: document.getElementById('tagText1h'),
        tagText4h: document.getElementById('tagText4h'),
        tagText1d: document.getElementById('tagText1d')
    };

    const ctx15m = dom.canvas15m.getContext('2d', { alpha: false });
    const ctx1h = dom.canvas1h.getContext('2d', { alpha: false });
    const ctx4h = dom.canvas4h.getContext('2d', { alpha: false });
    const ctx1d = dom.canvas1d.getContext('2d', { alpha: false });

    // 索引優化過的 SMA 計算
    function calculateSMA(closes, period) {
        const len = closes.length;
        const ma = new Array(len).fill(null);
        if (len < period) return ma;
        let sum = 0;
        for (let i = 0; i < period; i++) sum += closes[i];
        ma[period - 1] = sum / period;
        for (let i = period; i < len; i++) {
            sum += closes[i] - closes[i - period];
            ma[i] = sum / period;
        }
        return ma;
    }

    function formatVolumeText(volume) {
        const yi = volume / 100000000;
        return yi.toFixed(2) + '億';
    }

    function calculateRiskRewardScore(distancePct) {
        if (distancePct >= 0 && distancePct <= 2) return 100;
        if (distancePct > 2 && distancePct <= 5) return 80;
        if (distancePct > 5 && distancePct <= 10) return 50;
        if (distancePct > 10) return 20;
        return 30;
    }

    const workerCode = `
    function calculateSMA(closes, period) {
        const len = closes.length;
        const ma = new Array(len).fill(null);
        if (len < period) return ma;
        let sum = 0;
        for (let i = 0; i < period; i++) sum += closes[i];
        ma[period - 1] = sum / period;
        for (let i = period; i < len; i++) {
            sum += closes[i] - closes[i - period];
            ma[i] = sum / period;
        }
        return ma;
    }
    function checkAboveMAs30_45_60(closes, ma30, ma45, ma60, idx) {
        if (idx < 0 || idx >= closes.length) return false;
        const price = closes[idx];
        const m30 = ma30[idx], m45 = ma45[idx], m60 = ma60[idx];
        return (m30 !== null && price >= m30) && (m45 !== null && price >= m45) && (m60 !== null && price >= m60);
    }
    function isBullishAlignment(klinesRaw) {
        const totalLen = klinesRaw.length;
        if (totalLen < 60) return null;
        const closes = new Float64Array(totalLen);
        for(let i=0; i<totalLen; i++) closes[i] = parseFloat(klinesRaw[i][4]);
        
        const price = closes[totalLen - 1];
        const ma1Arr = calculateSMA(closes, 30);
        const ma2Arr = calculateSMA(closes, 45);
        const ma3Arr = calculateSMA(closes, 60);
        const ma1 = ma1Arr[totalLen - 1];
        const ma2 = ma2Arr[totalLen - 1];
        const ma3 = ma3Arr[totalLen - 1];
        if (ma1 !== null && ma2 !== null && ma3 !== null && ma1 > ma2 && ma2 > ma3 && price >= ma3) {
            const ma3DistPercent = ((price - ma3) / ma3) * 100;
            const isAboveAllNow = checkAboveMAs30_45_60(closes, ma1Arr, ma2Arr, ma3Arr, totalLen - 1);
            const isAboveAllPrev = checkAboveMAs30_45_60(closes, ma1Arr, ma2Arr, ma3Arr, totalLen - 2);
            return { price, ma3DistPercent, isAboveAllMAs: isAboveAllNow, isFirstBarAboveAll: isAboveAllNow && !isAboveAllPrev };
        }
        return null;
    }
    async function fetchWithRetry(url, retries = 2, delay = 300) {
        for (let i = 0; i <= retries; i++) {
            try {
                const res = await fetch(url);
                if (res.ok) return await res.json();
            } catch (err) {
                if (i === retries) throw err;
                await new Promise(r => setTimeout(r, delay * (i + 1)));
            }
        }
        return null;
    }
    async function fetchSymbol(symbol, apiBase, limits) {
        try {
            const [k15m, k1h, k4h, k1d] = await Promise.all([
                fetchWithRetry(\`\${apiBase}/fapi/v1/klines?symbol=\${symbol}&interval=15m&limit=\${limits.l15m}\`),
                fetchWithRetry(\`\${apiBase}/fapi/v1/klines?symbol=\${symbol}&interval=1h&limit=\${limits.l1h}\`),
                fetchWithRetry(\`\${apiBase}/fapi/v1/klines?symbol=\${symbol}&interval=4h&limit=\${limits.l4h}\`),
                fetchWithRetry(\`\${apiBase}/fapi/v1/klines?symbol=\${symbol}&interval=1d&limit=\${limits.l1d}\`)
            ]);
            if (!k15m || !k1h || !k4h || !k1d) return null;

            const bull15m = isBullishAlignment(k15m);
            const bull1h = isBullishAlignment(k1h);
            const bull4h = isBullishAlignment(k4h);
            const bull1d = isBullishAlignment(k1d);

            if (!bull15m && !bull1h && !bull4h && !bull1d) return null;
            let matchCount = (bull15m ? 1 : 0) + (bull1h ? 1 : 0) + (bull4h ? 1 : 0) + (bull1d ? 1 : 0);

            return {
                symbol, bull15m, bull1h, bull4h, bull1d, matchCount,
                currentPrice: (bull15m || bull1h || bull4h || bull1d).price,
                rawKlines: { k15m, k1h, k4h, k1d }
            };
        } catch {
            return null;
        }
    }
    self.onmessage = async function(e) {
        const { symbols, apiBase, limits, cachedMapEntries } = e.data;
        const cachedMap = new Map(cachedMapEntries);
        const concurrency = 25;
        let completed = 0;
        const matches = [];
        const newlyFetched = new Map();

        const symbolsToFetch = [];
        symbols.forEach(sym => {
            if (cachedMap.has(sym)) {
                const rawKlines = cachedMap.get(sym);
                const bull15m = isBullishAlignment(rawKlines.k15m);
                const bull1h = isBullishAlignment(rawKlines.k1h);
                const bull4h = isBullishAlignment(rawKlines.k4h);
                const bull1d = isBullishAlignment(rawKlines.k1d);
                completed++;
                if (bull15m || bull1h || bull4h || bull1d) {
                    let matchCount = (bull15m ? 1 : 0) + (bull1h ? 1 : 0) + (bull4h ? 1 : 0) + (bull1d ? 1 : 0);
                    matches.push({
                        symbol: sym, bull15m, bull1h, bull4h, bull1d, matchCount,
                        currentPrice: (bull15m || bull1h || bull4h || bull1d).price,
                        rawKlines
                    });
                }
            } else {
                symbolsToFetch.push(sym);
            }
        });

        self.postMessage({ type: 'progress', completed, total: symbols.length });

        for (let i = 0; i < symbolsToFetch.length; i += concurrency) {
            const chunk = symbolsToFetch.slice(i, i + concurrency);
            const chunkResults = await Promise.all(chunk.map(sym => fetchSymbol(sym, apiBase, limits)));
            chunkResults.filter(Boolean).forEach(res => {
                matches.push(res);
                newlyFetched.set(res.symbol, res.rawKlines);
            });
            completed += chunk.length;
            self.postMessage({ type: 'progress', completed, total: symbols.length });
        }
        self.postMessage({ type: 'done', matches, newlyFetched: Array.from(newlyFetched.entries()) });
    };
    `;

    async function startScan() {
        dom.scanBtn.disabled = true;
        dom.scanBtn.innerText = "⚡ 背景極速掃描中...";
        dom.symbolList.replaceChildren();
        dom.topPickSection.style.display = 'none';
        dom.progress.style.width = '0%';
        klinesCache.clear();

        try {
            const res = await fetch(`${API_BASE}/fapi/v1/ticker/24hr`);
            if (res.ok) {
                const data = await res.json();
                tickerMap.clear();
                data.forEach(d => tickerMap.set(d.symbol, d));
            }
        } catch {
            alert("無法取得行情數據，請檢查網路連線。");
            dom.scanBtn.disabled = false;
            dom.scanBtn.innerText = "啟動極速掃描";
            return;
        }

        const MIN_VOLUME = 100000000;
        const candidateSymbols = Array.from(tickerMap.keys()).filter(sym => {
            if (!sym.endsWith('USDT')) return false;
            return parseFloat(tickerMap.get(sym).quoteVolume) > MIN_VOLUME;
        });

        dom.statTotal.innerText = candidateSymbols.length;

        // 讀取 IndexedDB 本地快取
        if (!db) await initDB();
        const cachedMap = await getCachedKlinesFromDB(candidateSymbols);

        const blob = new Blob([workerCode], { type: 'application/javascript' });
        const worker = new URL.createObjectURL(blob);
        const w = new Worker(worker);

        w.postMessage({
            symbols: candidateSymbols,
            apiBase: API_BASE,
            limits: { l15m: FETCH_LIMIT_15M, l1h: FETCH_LIMIT_1H, l4h: FETCH_LIMIT_4H, l1d: FETCH_LIMIT_1D },
            cachedMapEntries: Array.from(cachedMap.entries())
        });

        w.onmessage = (e) => {
            const { type, completed, total, matches, newlyFetched } = e.data;
            if (type === 'progress') {
                dom.progress.style.width = `${(completed / total) * 100}%`;
            } else if (type === 'done') {
                w.terminate();

                if (newlyFetched && newlyFetched.length > 0) {
                    saveKlinesToDB(new Map(newlyFetched));
                }

                const allMatches = matches.map(m => {
                    const ticker = tickerMap.get(m.symbol);
                    klinesCache.set(m.symbol, m.rawKlines);
                    
                    let maxScore = 0;
                    let bestDist = 999;
                    ['bull15m', 'bull1h', 'bull4h', 'bull1d'].forEach(p => {
                        if (m[p]) {
                            const d = m[p].ma3DistPercent;
                            const score = calculateRiskRewardScore(d);
                            if (score > maxScore) {
                                maxScore = score;
                                bestDist = d;
                            }
                        }
                    });

                    return {
                        symbol: m.symbol,
                        price: m.currentPrice,
                        bull15m: m.bull15m,
                        bull1h: m.bull1h,
                        bull4h: m.bull4h,
                        bull1d: m.bull1d,
                        matchCount: m.matchCount,
                        priceChange24h: ticker ? parseFloat(ticker.priceChangePercent) : 0,
                        quoteVolume24h: ticker ? parseFloat(ticker.quoteVolume) : 0,
                        entryScore: maxScore,
                        bestDist: bestDist
                    };
                });

                globalAllMatches = allMatches;

                results15M = allMatches.filter(m => m.bull15m);
                results1H = allMatches.filter(m => m.bull1h);
                results4H = allMatches.filter(m => m.bull4h);
                results1D = allMatches.filter(m => m.bull1d);
                resultsMulti = allMatches.filter(m => m.matchCount >= 2);

                const sortByChange = (a, b) => b.priceChange24h - a.priceChange24h;
                results15M.sort(sortByChange);
                results1H.sort(sortByChange);
                results4H.sort(sortByChange);
                results1D.sort(sortByChange);
                resultsMulti.sort(sortByChange);

                dom.count15m.innerText = results15M.length;
                dom.count1h.innerText = results1H.length;
                dom.count4h.innerText = results4H.length;
                dom.count1d.innerText = results1D.length;
                dom.countMulti.innerText = resultsMulti.length;

                dom.scanBtn.disabled = false;
                dom.scanBtn.innerText = "啟動極速掃描";
                
                generateTopPicks(allMatches);
                renderList();
            }
        };
    }

    function generateTopPicks(allMatches) {
        const sorted = [...allMatches].sort((a, b) => {
            if (b.entryScore !== a.entryScore) return b.entryScore - a.entryScore;
            return Math.abs(a.bestDist) - Math.abs(b.bestDist);
        });

        topPickSymbols = sorted.slice(0, 5);
        if (topPickSymbols.length === 0) {
            dom.topPickSection.style.display = 'none';
            return;
        }

        dom.topPickList.innerHTML = '';

    function renderCanvasChart(canvas, wrapper, ctx, klinesRaw, showCount, periodType) {
        const totalLen = klinesRaw.length;
        const closesAll = new Float64Array(totalLen);
        const volumesAll = new Float64Array(totalLen);
        for(let i=0; i<totalLen; i++) {
            closesAll[i] = parseFloat(klinesRaw[i][4]);
            volumesAll[i] = parseFloat(klinesRaw[i][5]);
        }

        const ma5All = calculateSMA(closesAll, P0);
        const ma30All = calculateSMA(closesAll, P1);
        const ma45All = calculateSMA(closesAll, P2);
        const ma60All = calculateSMA(closesAll, P3);
        const vm5All = calculateSMA(volumesAll, 5);
        const vm20All = calculateSMA(volumesAll, 20);

        const actualShowCount = Math.min(showCount, totalLen);
        const showStartIndex = totalLen - actualShowCount;

        const rect = wrapper.getBoundingClientRect();
        if (rect.width === 0 || rect.height === 0) return;

        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);

        const width = rect.width;
        const height = rect.height;

        const padding = { top: 18, bottom: 4, left: 6, right: 55 };
        const totalH = height - padding.top - padding.bottom;
        const priceH = totalH * 0.65;
        const volH = totalH * 0.25;
        const volTop = padding.top + priceH + totalH * 0.10;
        const chartW = width - padding.left - padding.right;

        let minP = Infinity, maxP = -Infinity, maxVol = -Infinity;
        for(let i = showStartIndex; i < totalLen; i++) {
            const l = parseFloat(klinesRaw[i][3]), h = parseFloat(klinesRaw[i][2]);
            if (l < minP) minP = l;
            if (h > maxP) maxP = h;
            const v = volumesAll[i];
            if (v > maxVol) maxVol = v;
        }

        const priceRange = maxP - minP || 1;
        const getYPrice = (p) => padding.top + priceH - ((p - minP) / priceRange) * priceH;
        const getYVol = (v) => volTop + volH - (v / (maxVol || 1)) * volH;
        const barWidth = chartW / actualShowCount;

        ctx.fillStyle = '#060911';
        ctx.fillRect(0, 0, width, height);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
        ctx.fillStyle = '#64748b';
        ctx.font = '8px JetBrains Mono';
        ctx.textAlign = 'left';
        ctx.lineWidth = 1;

        const y = padding.top;
        const pVal = maxP;
        ctx.beginPath();
        ctx.moveTo(padding.left, y);
        ctx.lineTo(width - padding.right, y);
        ctx.stroke();
        ctx.fillText(pVal.toFixed(1), width - padding.right + 3, y + 3);

        ctx.beginPath();
        ctx.moveTo(padding.left, volTop);
        ctx.lineTo(width - padding.right, volTop);
        ctx.stroke();

        const formatVol = (v) => v >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : (v / 1e3).toFixed(0) + 'K';
        ctx.fillText(formatVol(maxVol), width - padding.right + 3, volTop + 6);

        const dayNames = ['日', '一', '二', '三', '四', '五', '六'];

        for (let i = 0; i < actualShowCount; i++) {
            const absoluteIdx = showStartIndex + i;
            const timestamp = parseInt(klinesRaw[absoluteIdx][0]);
            const date = new Date(timestamp);
            const utcDay = date.getUTCDay();
            const utcHour = date.getUTCHours();
            const utcMin = date.getUTCMinutes();

            const isMondayStart = (utcDay === 1 && utcHour === 0);
            const isDailyStart = (utcHour === 0 && utcMin === 0);

            if (periodType !== '1d' && isMondayStart) {
                const x = padding.left + i * barWidth + barWidth / 2;
                ctx.strokeStyle = 'rgba(157, 78, 221, 0.75)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([3, 3]);
                ctx.beginPath();
                ctx.moveTo(x, padding.top);
                ctx.lineTo(x, padding.top + totalH);
                ctx.stroke();

                ctx.save();
                ctx.font = 'bold 8px JetBrains Mono';
                ctx.fillStyle = '#9d4edd';
                ctx.textAlign = 'center';
                ctx.fillText('週一', x, padding.top - 5);
                ctx.restore();
            } else if (periodType !== '1d' && isDailyStart) {
                const x = padding.left + i * barWidth + barWidth / 2;
                ctx.strokeStyle = 'rgba(0, 240, 255, 0.45)';
                ctx.lineWidth = 1.2;
                ctx.setLineDash([3, 3]);
                ctx.beginPath();
                ctx.moveTo(x, padding.top);
                ctx.lineTo(x, padding.top + totalH);
                ctx.stroke();

                ctx.save();
                ctx.font = '7px JetBrains Mono';
                ctx.fillStyle = '#00f0ff';
                ctx.textAlign = 'center';
                ctx.fillText(`週${dayNames[utcDay]}`, x, padding.top - 5);
                ctx.restore();
            }
        }

        ctx.setLineDash([]);
        ctx.lineWidth = 1;

        for (let i = 0; i < actualShowCount; i++) {
            const absoluteIdx = showStartIndex + i;
            const k = klinesRaw[absoluteIdx];
            const open = parseFloat(k[1]), high = parseFloat(k[2]), low = parseFloat(k[3]), close = parseFloat(k[4]), vol = parseFloat(k[5]);
            const x = padding.left + i * barWidth + barWidth / 2;
            const isUp = close >= open;
            const color = isUp ? '#00ff66' : '#ff2a6d';

            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x, getYPrice(high));
            ctx.lineTo(x, getYPrice(low));
            ctx.stroke();

            const yOpen = getYPrice(open);
            const yClose = getYPrice(close);
            const bodyTop = Math.min(yOpen, yClose);
            const bodyH = Math.max(Math.abs(yOpen - yClose), 1);
            const bw = Math.max(barWidth * 0.7, 1);
            ctx.fillRect(x - bw / 2, bodyTop, bw, bodyH);

            ctx.fillStyle = isUp ? 'rgba(0, 255, 102, 0.4)' : 'rgba(255, 42, 109, 0.4)';
            const vY = getYVol(vol);
            ctx.fillRect(x - bw / 2, vY, bw, volTop + volH - vY);

            const checkAboveMAs5_30_45_60 = (closes, ma5, ma30, ma45, ma60, idx) => {
                if (idx < 0 || idx >= closes.length) return false;
                const price = closes[idx];
                return (ma5[idx] !== null && price >= ma5[idx]) &&
                       (ma30[idx] !== null && price >= ma30[idx]) &&
                       (ma45[idx] !== null && price >= ma45[idx]) &&
                       (ma60[idx] !== null && price >= ma60[idx]);
            };

            const checkAboveMAs30_45_60 = (closes, ma30, ma45, ma60, idx) => {
                if (idx < 0 || idx >= closes.length) return false;
                const price = closes[idx];
                return (ma30[idx] !== null && price >= ma30[idx]) &&
                       (ma45[idx] !== null && price >= ma45[idx]) &&
                       (ma60[idx] !== null && price >= ma60[idx]);
            };

            let isNowAbove = false;
            let isPrevAbove = false;
            if (periodType === '4h' || periodType === '1d') {
                isNowAbove = checkAboveMAs5_30_45_60(closesAll, ma5All, ma30All, ma45All, ma60All, absoluteIdx);
                isPrevAbove = checkAboveMAs5_30_45_60(closesAll, ma5All, ma30All, ma45All, ma60All, absoluteIdx - 1);
            } else {
                isNowAbove = checkAboveMAs30_45_60(closesAll, ma30All, ma45All, ma60All, absoluteIdx);
                isPrevAbove = checkAboveMAs30_45_60(closesAll, ma30All, ma45All, ma60All, absoluteIdx - 1);
            }

            if (isNowAbove && !isPrevAbove) {
                ctx.save();
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillStyle = '#ffea00';
                ctx.shadowColor = '#ffea00';
                ctx.shadowBlur = 5;
                const highY = getYPrice(high);
                ctx.fillText('⚡', x, highY - 2);
                ctx.restore();
            }
        }

        const drawLine = (dataArray, color, getYFunc, width = 1) => {
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.beginPath();
            let started = false;
            for (let i = 0; i < actualShowCount; i++) {
                const absoluteIdx = showStartIndex + i;
                const val = dataArray[absoluteIdx];
                if (val === null || isNaN(val)) continue;
                const x = padding.left + i * barWidth + barWidth / 2;
                const y = getYFunc(val);
                if (!started) {
                    ctx.moveTo(x, y);
                    started = true;
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();
        };

        drawLine(ma5All, '#00ff66', getYPrice);
        drawLine(ma30All, '#ffea00', getYPrice);
        drawLine(ma45All, '#ff9100', getYPrice);
        drawLine(ma60All, '#ff007f', getYPrice);
        drawLine(vm5All, '#00f0ff', getYVol, 0.9);
        drawLine(vm20All, '#9d4edd', getYVol, 0.9);
    }

    function closeChartModal() {
        dom.chartModal.classList.remove('active');
        dom.chartModal.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('modal-open');
        currentIndex = -1;
    }

    function navigateSymbol(direction) {
        const currentList = getCurrentList();
        if (currentIndex === -1 || currentList.length === 0) return;
        let newIndex = currentIndex + direction;
        if (newIndex < 0) newIndex = currentList.length - 1;
        if (newIndex >= currentList.length) newIndex = 0;
        openChartModal(newIndex);
    }

    let touchStartX = 0, touchStartY = 0;
    let touchEndX = 0, touchEndY = 0;

    dom.chartModal.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    dom.chartModal.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        touchEndY = e.changedTouches[0].screenY;
        handleSwipe();
    }, { passive: true });

    function handleSwipe() {
        const deltaX = touchEndX - touchStartX;
        const deltaY = touchEndY - touchStartY;
        if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 40) {
            if (deltaX < 0) navigateSymbol(1);
            else navigateSymbol(-1);
        }
    }

    function switchTab(tabKey, targetBtn) {
        activeTab = tabKey;
        [dom.tab15m, dom.tab1h, dom.tab4h, dom.tab1d, dom.tabMulti].forEach(b => b.classList.remove('active'));
        targetBtn.classList.add('active');
        renderList();
    }

    dom.tab15m.addEventListener('click', () => switchTab('15m', dom.tab15m));
    dom.tab1h.addEventListener('click', () => switchTab('1h', dom.tab1h));
    dom.tab4h.addEventListener('click', () => switchTab('4h', dom.tab4h));
    dom.tab1d.addEventListener('click', () => switchTab('1d', dom.tab1d));
    dom.tabMulti.addEventListener('click', () => switchTab('multi', dom.tabMulti));

    dom.scanBtn.addEventListener('click', startScan);
    dom.closeModalBtn.addEventListener('click', closeChartModal);
    dom.prevBtn.addEventListener('click', (e) => { e.stopPropagation(); navigateSymbol(-1); });
    dom.nextBtn.addEventListener('click', (e) => { e.stopPropagation(); navigateSymbol(1); });

    dom.chartModal.addEventListener('click', (e) => {
        if (e.target === dom.chartModal) closeChartModal();
    });

    window.addEventListener('keydown', (e) => {
        if (!dom.chartModal.classList.contains('active')) return;
        if (e.key === 'Escape') closeChartModal();
        else if (e.key === 'ArrowLeft') navigateSymbol(-1);
        else if (e.key === 'ArrowRight') navigateSymbol(1);
    });

    let resizeRaf = null;
    window.addEventListener('resize', () => {
        if (resizeRaf) cancelAnimationFrame(resizeRaf);
        resizeRaf = requestAnimationFrame(() => {
            if (dom.chartModal.classList.contains('active') && currentIndex !== -1) {
                const currentList = getCurrentList();
                if (currentList[currentIndex]) {
                    loadAndDrawCharts(currentList[currentIndex].symbol);
                }
            }
        });
    });

    // 初始化 IndexedDB
    initDB();
})();
</script>
</body>
</html>
