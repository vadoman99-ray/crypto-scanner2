<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ 超速研判！多頭+觸上軌 漫畫極速雷達</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Noto+Sans+TC:wght@700;900&family=JetBrains+Mono:wght@800&display=swap');

        :root {
            --manga-black: #121212;
            --manga-white: #fefefe;
            --manga-yellow: #ffde59;
            --manga-pink: #ff66c4;
            --manga-cyan: #00f0ff;
            --manga-green: #00e676;
            --manga-red: #ff3366;
            --card-border: 2.5px solid var(--manga-black);
            --pop-shadow: 4px 4px 0px var(--manga-black);
            --pop-shadow-lg: 6px 6px 0px var(--manga-black);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #f0f3f8; 
            /* 漫畫網點背景 Screentone Pattern */
            background-image: radial-gradient(var(--manga-black) 15%, transparent 16%);
            background-size: 12px 12px;
            color: var(--manga-black); 
            margin: 0; 
            padding-bottom: 40px; 
            overflow-x: hidden;
        }

        /* 頁首漫畫 Header */
        .app-header { 
            position: sticky; top: 0; z-index: 100; 
            background: var(--manga-yellow); 
            border-bottom: var(--card-border); 
            padding: 12px 16px; 
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 4px 0 var(--manga-black);
        }
        .header-title { 
            font-family: 'Bangers', 'Noto Sans TC', cursive;
            font-size: 1.3rem; 
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #fff, -2px -2px 0px #fff, 2px -2px 0px #fff, -2px 2px 0px #fff, 3px 3px 0px var(--manga-black);
            display: flex; align-items: center; gap: 6px;
        }
        
        .scan-btn { 
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--manga-pink); 
            color: var(--manga-white); 
            border: var(--card-border); 
            padding: 8px 18px; border-radius: 12px; 
            font-weight: 900; font-size: 0.95rem; cursor: pointer; 
            box-shadow: var(--pop-shadow);
            transition: all 0.15s ease;
            text-shadow: 1.5px 1.5px 0px var(--manga-black);
        }
        .scan-btn:hover { transform: translate(-2px, -2px); box-shadow: var(--pop-shadow-lg); background: #ff47b5; }
        .scan-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px var(--manga-black); }
        .scan-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: var(--pop-shadow); }

        /* 漫畫風格進度條 */
        .progress-container { 
            height: 10px; background: #fff; width: 100%; 
            border-bottom: var(--card-border); position: relative; overflow: hidden;
        }
        .progress-fill { 
            height: 100%; width: 0%; 
            background: var(--manga-cyan); 
            border-right: var(--card-border);
            transition: width 0.1s linear; 
        }

        /* 策略頁籤 Tab */
        .strategy-selector { display: flex; gap: 10px; padding: 14px 16px 0 16px; }
        .tab-btn {
            flex: 1; padding: 10px 4px; border-radius: 10px; font-size: 0.85rem; font-weight: 900;
            background: #fff; border: var(--card-border); color: var(--manga-black);
            cursor: pointer; text-align: center; box-shadow: var(--pop-shadow);
            transition: all 0.15s ease;
        }
        .tab-btn.active { background: var(--manga-yellow); transform: translate(-2px, -2px); box-shadow: var(--pop-shadow-lg); }
        .tab-btn.active-entry { background: var(--manga-green); color: #000; transform: translate(-2px, -2px); box-shadow: var(--pop-shadow-lg); }
        .tab-btn.active-exit { background: var(--manga-red); color: #fff; text-shadow: 1px 1px 0 #000; transform: translate(-2px, -2px); box-shadow: var(--pop-shadow-lg); }

        /* 漫畫儀表板 Dashboard */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px 16px 4px 16px; }
        .stat-card {
            background: #fff; border: var(--card-border);
            border-radius: 12px; padding: 10px 4px; text-align: center;
            box-shadow: var(--pop-shadow);
        }
        .stat-card .val { font-family: 'JetBrains Mono', monospace; font-size: 1.3rem; font-weight: 900; }
        .stat-card .lbl { font-size: 0.7rem; font-weight: 900; margin-top: 2px; }
        .stat-card.entry { background: rgba(0, 230, 118, 0.2); }
        .stat-card.exit { background: rgba(255, 51, 102, 0.2); }

        /* 工具列與搜尋 */
        .toolbar { padding: 10px 16px; display: flex; gap: 8px; align-items: center; }
        .search-wrapper { position: relative; flex: 1; display: flex; align-items: center; }
        .search-input { 
            width: 100%; background: #fff; border: var(--card-border); 
            color: var(--manga-black); padding: 9px 30px 9px 12px; border-radius: 10px; 
            font-size: 0.85rem; font-weight: 700; box-shadow: var(--pop-shadow);
        }
        .clear-btn { position: absolute; right: 10px; background: none; border: none; font-weight: 900; cursor: pointer; font-size: 1rem; display: none; }
        
        .tool-btn { 
            background: var(--manga-cyan); border: var(--card-border); 
            color: var(--manga-black); padding: 9px 12px; border-radius: 10px; 
            font-size: 0.8rem; cursor: pointer; font-weight: 900; white-space: nowrap;
            box-shadow: var(--pop-shadow);
        }

        .status-bar { padding: 0 16px 8px 16px; font-size: 0.75rem; font-weight: 900; color: #555; display: flex; justify-content: space-between; }
        .container { padding: 0 16px; }
        
        /* 漫畫卡片動畫與樣式 */
        .symbol-card { 
            background: #fff; border: var(--card-border); 
            border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; 
            display: flex; justify-content: space-between; align-items: center; 
            text-decoration: none; color: inherit; box-shadow: var(--pop-shadow);
            transition: all 0.15s ease;
            position: relative; overflow: hidden;
        }
        .symbol-card:hover { 
            transform: translate(-3px, -3px); 
            box-shadow: var(--pop-shadow-lg); 
            background: #fffde7;
        }

        .symbol-info .name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .symbol-info .name { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: 900; }
        
        .symbol-metrics { text-align: right; }
        .symbol-metrics .price { font-size: 1.15rem; font-weight: 900; font-family: 'JetBrains Mono', monospace; }
        
        /* 漫畫對話框 / 對比標籤 */
        .badge-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
        .badge { 
            font-size: 0.7rem; padding: 3px 8px; border-radius: 6px; font-weight: 900; 
            border: 1.5px solid #000; box-shadow: 2px 2px 0px #000;
        }
        .badge-entry { background-color: var(--manga-green); color: #000; }
        .badge-exit { background-color: var(--manga-red); color: #fff; text-shadow: 1px 1px 0 #000; }

        .change-badge { font-size: 0.75rem; font-weight: 900; padding: 2px 6px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; border: 1.5px solid #000; }
        .change-up { color: #000; background-color: var(--manga-green); }
        .change-down { color: #fff; background-color: var(--manga-red); }

        .empty-tip { text-align: center; padding: 50px 0; font-weight: 900; font-size: 1rem; color: #666; }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="header-title">⚡ 觸上軌+多頭 漫畫極速雷達</div>
        <button id="scanBtn" class="scan-btn" onclick="startScan()">極速發動</button>
    </div>

    <div class="progress-container"><div id="progress" class="progress-fill"></div></div>

    <div class="strategy-selector">
        <div id="tabAll" class="tab-btn active" onclick="switchTab('ALL')">全部標的</div>
        <div id="tabEntry" class="tab-btn" onclick="switchTab('ENTRY')">🎯 入場訊號</div>
        <div id="tabExit" class="tab-btn" onclick="switchTab('EXIT')">🚨 出場訊號</div>
    </div>

    <div class="dashboard">
        <div class="stat-card">
            <div class="val" id="statTotal">0</div>
            <div class="lbl">掃描總數</div>
        </div>
        <div class="stat-card entry">
            <div class="val" id="statEntry">0</div>
            <div class="lbl">買入入場</div>
        </div>
        <div class="stat-card exit">
            <div class="val" id="statExit">0</div>
            <div class="lbl">爆量離場</div>
        </div>
    </div>

    <div class="toolbar">
        <div class="search-wrapper">
            <input type="text" id="searchInput" class="search-input" placeholder="搜尋幣種 (例: BTC)..." oninput="onSearchInput()">
            <button id="clearBtn" class="clear-btn" onclick="clearSearch()">✕</button>
        </div>
        <button class="tool-btn" id="sortBtn" onclick="toggleSort()">漲幅 ⬇</button>
    </div>

    <div class="status-bar">
        <span id="statusText">準備就緒，按下「極速發動」！</span>
        <span id="countText">顯示 0 筆</span>
    </div>

    <div class="container" id="symbolList"></div>

<script>
    const API_ENDPOINTS = [
        'https://fapi.binance.com',
        'https://fapi1.binance.com',
        'https://fapi2.binance.com'
    ];
    let currentEndpointIdx = 0;

    let rawResults = [];
    let ticker24hMap = {};
    let sortDesc = true;
    let isScanning = false;
    let totalSymbolCount = 0;
    let currentFilter = 'ALL';

    // 網路請求優化 (帶節流與自動切換)
    async function fetchWithFallback(path, timeoutMs = 1000) {
        for (let i = 0; i < API_ENDPOINTS.length; i++) {
            const endpoint = API_ENDPOINTS[(currentEndpointIdx + i) % API_ENDPOINTS.length];
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const response = await fetch(`${endpoint}${path}`, { signal: controller.signal });
                clearTimeout(id);
                if (response.ok) {
                    currentEndpointIdx = (currentEndpointIdx + i) % API_ENDPOINTS.length;
                    return await response.json();
                }
            } catch (e) { clearTimeout(id); }
        }
        return null;
    }

    function calculateSMA(array, period) {
        const len = array.length;
        if (len < period) return 0;
        let sum = 0;
        for (let i = len - period; i < len; i++) sum += array[i];
        return sum / period;
    }

    function calculateBollingerBands(closes, period = 20, multiplier = 2) {
        const len = closes.length;
        if (len < period) return null;

        const mb = calculateSMA(closes, period);
        let varianceSum = 0;
        for (let i = len - period; i < len; i++) {
            varianceSum += Math.pow(closes[i] - mb, 2);
        }
        const stdDev = Math.sqrt(varianceSum / period);
        return { upperBand: mb + (multiplier * stdDev), mb };
    }

    async function fetch24hTickers() { 
        const data = await fetchWithFallback('/fapi/v1/ticker/24hr', 1800); 
        if (!data || !Array.isArray(data)) return {};
        const map = {}; 
        for (let i = 0; i < data.length; i++) {
            map[data[i].symbol] = parseFloat(data[i].priceChangePercent);
        }
        return map; 
    }

    async function getUSDTFuturesSymbols() { 
        const data = await fetchWithFallback('/fapi/v1/exchangeInfo', 1800); 
        if (!data || !data.symbols) return [];
        return data.symbols
            .filter(s => s.quoteAsset === 'USDT' && s.contractType === 'PERPETUAL' && s.status === 'TRADING')
            .map(s => s.symbol); 
    }

    // 單個幣種高敏運算
    async function processSymbol(symbol) {
        try {
            const res1h = await fetchWithFallback(`/fapi/v1/klines?symbol=${symbol}&interval=1h&limit=70`, 900);
            if (!res1h || res1h.length < 60) return null;

            const len = res1h.length;
            const closes = new Float64Array(len);
            const opens = new Float64Array(len);
            const highs = new Float64Array(len);
            const volumes = new Float64Array(len);

            for (let i = 0; i < len; i++) {
                opens[i] = parseFloat(res1h[i][1]);
                highs[i] = parseFloat(res1h[i][2]);
                closes[i] = parseFloat(res1h[i][4]);
                volumes[i] = parseFloat(res1h[i][5]);
            }

            const currentPrice = closes[len - 1];
            const currentHigh = highs[len - 1];
            const currentOpen = opens[len - 1];
            const currentVol = volumes[len - 1];

            // 多頭排列 (30MA > 45MA > 60MA)
            const ma30 = calculateSMA(closes, 30);
            const ma45 = calculateSMA(closes, 45);
            const ma60 = calculateSMA(closes, 60);

            if (!(ma30 > ma45 && ma45 > ma60)) return null;

            // 成交量指標
            const volMa5 = calculateSMA(volumes, 5);
            const volMa15 = calculateSMA(volumes, 15);

            // 布林通道 BOLL(20, 2)
            const boll = calculateBollingerBands(closes, 20, 2);
            if (!boll) return null;

            // 條件判斷
            const isTouchingUpperBand = currentHigh >= boll.upperBand || currentPrice >= boll.upperBand;
            const isEntrySignal = (volMa5 > volMa15) && isTouchingUpperBand;
            const isExitSignal = (currentPrice < currentOpen) && (currentVol > volMa15 * 1.5);

            if (isEntrySignal || isExitSignal) {
                return { 
                    symbol, 
                    price: currentPrice, 
                    priceChange24h: ticker24hMap[symbol] || 0, 
                    isEntrySignal, 
                    isExitSignal 
                };
            }
            return null;
        } catch (e) { return null; }
    }

    // 高併發池加速執行器
    async function runFastScanner(symbols, poolLimit = 80, onProgress) {
        let completed = 0;
        const results = [];
        let index = 0;

        async function worker() {
            while (index < symbols.length) {
                const currentIndex = index++;
                const symbol = symbols[currentIndex];
                const res = await processSymbol(symbol);
                if (res) results.push(res);
                completed++;
                if (completed % 10 === 0 || completed === symbols.length) {
                    onProgress(completed, symbols.length);
                }
            }
        }

        const workers = Array(poolLimit).fill(0).map(() => worker());
        await Promise.all(workers);
        return results;
    }

    function updateDashboard() {
        document.getElementById('statTotal').innerText = totalSymbolCount;
        document.getElementById('statEntry').innerText = rawResults.filter(r => r.isEntrySignal).length;
        document.getElementById('statExit').innerText = rawResults.filter(r => r.isExitSignal).length;
    }

    async function startScan() {
        if (isScanning) return;
        isScanning = true;

        const btn = document.getElementById('scanBtn');
        const statusText = document.getElementById('statusText');
        btn.disabled = true; btn.innerText = "連擊中..."; 
        statusText.innerText = "極速抓取全網行情中...";
        rawResults = [];

        const [tickers, symbols] = await Promise.all([fetch24hTickers(), getUSDTFuturesSymbols()]);
        ticker24hMap = tickers;
        totalSymbolCount = symbols.length;
        
        if (symbols.length === 0) {
            statusText.innerText = "連線失敗，請重試！";
            btn.disabled = false; btn.innerText = "極速發動";
            isScanning = false;
            return;
        }

        let lastRenderTime = Date.now();

        rawResults = await runFastScanner(symbols, 80, (completed, total) => {
            const pct = Math.floor((completed / total) * 100);
            document.getElementById('progress').style.width = `${pct}%`;
            statusText.innerText = `超速掃描中 (${completed}/${total})...`;

            const now = Date.now();
            if (now - lastRenderTime > 120) {
                lastRenderTime = now;
                updateDashboard();
                renderList();
            }
        });

        updateDashboard();
        statusText.innerText = "掃描完成！";
        btn.disabled = false; btn.innerText = "極速發動";
        isScanning = false;
        renderList();
    }

    function switchTab(type) {
        currentFilter = type;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.className = 'tab-btn');
        if (type === 'ALL') document.getElementById('tabAll').classList.add('active');
        if (type === 'ENTRY') document.getElementById('tabEntry').classList.add('active-entry');
        if (type === 'EXIT') document.getElementById('tabExit').classList.add('active-exit');
        renderList();
    }

    function toggleSort() { 
        sortDesc = !sortDesc; 
        document.getElementById('sortBtn').innerText = sortDesc ? "漲幅 ⬇" : "漲幅 ⬆";
        renderList(); 
    }

    function onSearchInput() {
        const input = document.getElementById('searchInput');
        document.getElementById('clearBtn').style.display = input.value ? 'block' : 'none';
        renderList();
    }

    function clearSearch() {
        const input = document.getElementById('searchInput');
        input.value = '';
        document.getElementById('clearBtn').style.display = 'none';
        renderList();
    }

    function getFilteredData() {
        const query = document.getElementById('searchInput').value.toUpperCase().trim();
        return rawResults.filter(item => {
            const matchesQuery = item.symbol.includes(query);
            if (currentFilter === 'ENTRY') return matchesQuery && item.isEntrySignal;
            if (currentFilter === 'EXIT') return matchesQuery && item.isExitSignal;
            return matchesQuery;
        });
    }

    function renderList() {
        const container = document.getElementById('symbolList');
        let data = getFilteredData();
        data.sort((a, b) => sortDesc ? b.priceChange24h - a.priceChange24h : a.priceChange24h - b.priceChange24h);
        
        document.getElementById('countText').innerText = `顯示 ${data.length} / 符合 ${rawResults.length} 筆`;

        if (data.length === 0) {
            container.innerHTML = `<div class="empty-tip">${rawResults.length === 0 && !isScanning ? '點擊右上角「極速發動」開始掃描' : '尚無符合條件標的'}</div>`;
            return;
        }

        container.innerHTML = data.map((item) => `
            <a class="symbol-card" href="https://www.binance.com/zh-TC/futures/${item.symbol}" target="_blank">
                <div class="symbol-info">
                    <div class="name-row">
                        <span class="name">${item.symbol.replace('USDT', '')}</span>
                        <span class="change-badge ${item.priceChange24h >= 0 ? 'change-up' : 'change-down'}">
                            ${item.priceChange24h >= 0 ? '+' : ''}${item.priceChange24h.toFixed(2)}%
                        </span>
                    </div>
                    <div class="badge-list">
                        ${item.isEntrySignal ? `<span class="badge badge-entry">💥 買入 (多頭+觸上軌+5Vol>15Vol)</span>` : ''}
                        ${item.isExitSignal ? `<span class="badge badge-exit">💣 爆量離場 (高位陰線)</span>` : ''}
                    </div>
                </div>
                <div class="symbol-metrics">
                    <div class="price">${item.price}</div>
                </div>
            </a>
        `).join('');
    }
</script>
</body>
</html>
