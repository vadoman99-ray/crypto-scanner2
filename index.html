<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幣安合約掃描 (專業版)</title>
    <style>
        :root {
            --bg-color: #12161c;
            --card-bg: #1e2329;
            --card-border: #2b313a;
            --text-main: #eaecef;
            --text-sub: #848e9c;
            --yellow: #f0b90b;
            --green: #0ecb81;
            --red: #f6465d;
            --fire: #ff6d00;
            --breakout: #e040fb;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding-bottom: 80px; }
        
        .app-header { position: sticky; top: 0; z-index: 100; background-color: var(--card-bg); padding: 12px 16px; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
        .scan-btn { background-color: var(--yellow); color: #000; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; }
        
        .progress-bar { height: 3px; background: var(--card-border); width: 100%; }
        .progress-fill { height: 100%; width: 0%; background: var(--yellow); transition: width 0.2s; }
        
        .container { padding: 12px 16px; }
        .symbol-card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        .badge { font-size: 0.7rem; padding: 3px 6px; border-radius: 4px; font-weight: 600; display: inline-block; margin-right: 4px; }
        .badge-breakout { background-color: rgba(156, 39, 176, 0.2); color: var(--breakout); border: 1px solid var(--breakout); }
        .badge-fire { background-color: rgba(255, 109, 0, 0.15); color: var(--fire); border: 1px solid var(--fire); }
        
        /* 水平滾動導覽列 */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background-color: var(--card-bg); border-top: 1px solid var(--card-border); display: flex; overflow-x: auto; white-space: nowrap; z-index: 100; padding: 0 10px; }
        .nav-item { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-sub); font-size: 0.7rem; padding: 0 15px; cursor: pointer; border: none; background: none; }
        .nav-item.active { color: var(--yellow); font-weight: bold; }
        .nav-icon { font-size: 1.2rem; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="app-header">
        <div style="font-weight:bold;">⚡ 1H 20MA 掃描器</div>
        <button id="scanBtn" class="scan-btn" onclick="startScan()">開始掃描</button>
    </div>
    <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>

    <div class="container" id="symbolList">
        <div style="text-align:center; margin-top:50px; color:var(--text-sub);">點擊「開始掃描」以啟動</div>
    </div>

    <!-- 底部滾動導覽列 -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="setFilter('ALL', this)"><div class="nav-icon">🌐</div><div>全部</div></button>
        <button class="nav-item" onclick="setFilter('ABOVE_5MA', this)"><div class="nav-icon">🟢</div><div>5MA 上</div></button>
        <button class="nav-item" onclick="setFilter('BELOW_5MA', this)"><div class="nav-icon">🟡</div><div>5MA 下</div></button>
        <button class="nav-item" onclick="setFilter('BREAKOUT', this)"><div class="nav-icon">⚡</div><div>剛突破</div></button>
        <button class="nav-item" onclick="setFilter('ABOVE_BB', this)"><div class="nav-icon">🔥</div><div>上軌之上</div></button>
    </div>

<script>
    let rawResults = [];
    let currentFilter = 'ALL';
    let ticker24hMap = {};

    // [函數庫維持不變]
    function calculateSMA(data, count) { return data.slice(-count).reduce((sum, val) => sum + val, 0) / count; }
    function calculateBBAt(prices, index, period = 20) {
        if (index < period - 1) return Infinity;
        const slice = prices.slice(index - period + 1, index + 1);
        const sma = slice.reduce((a, b) => a + b, 0) / period;
        const stdDev = Math.sqrt(slice.reduce((a, b) => a + Math.pow(b - sma, 2), 0) / period);
        return sma + (2 * stdDev);
    }

    async function processSymbol(symbol) {
        try {
            const res1h = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=1h&limit=30`);
            const data1h = await res1h.json();
            const closes1h = data1h.map(k => parseFloat(k[4]));
            const currentClose1h = closes1h[closes1h.length - 1];
            
            const ma20 = calculateSMA(closes1h, 20);
            const ma5 = calculateSMA(closes1h, 5);

            if (currentClose1h > ma20) {
                const res15m = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=15m&limit=35`);
                const data15m = await res15m.json();
                const closes15m = data15m.map(k => parseFloat(k[4]));
                const currIdx = closes15m.length - 1;
                const prevIdx = currIdx - 1;

                const currClose = closes15m[currIdx];
                const prevClose = closes15m[prevIdx];
                const currUpperBB = calculateBBAt(closes15m, currIdx);
                const prevUpperBB = calculateBBAt(closes15m, prevIdx);

                return {
                    symbol, price: currentClose1h, ma20,
                    isAboveMa5: currentClose1h >= ma5,
                    isAbove15mBB: currClose >= currUpperBB,
                    isJustBreakout15mBB: (prevClose < prevUpperBB && currClose >= currUpperBB),
                    priceChange24h: ticker24hMap[symbol] || 0
                };
            }
            return null;
        } catch (e) { return null; }
    }

    async function startScan() {
        const btn = document.getElementById('scanBtn');
        btn.disabled = true; rawResults = [];
        
        const t24 = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
        const tData = await t24.json();
        tData.forEach(t => ticker24hMap[t.symbol] = parseFloat(t.priceChangePercent));

        const info = await fetch('https://fapi.binance.com/fapi/v1/exchangeInfo');
        const infoData = await info.json();
        const symbols = infoData.symbols.filter(s => s.quoteAsset === 'USDT' && s.contractType === 'PERPETUAL').map(s => s.symbol);

        for (let i = 0; i < symbols.length; i += 10) {
            const batch = symbols.slice(i, i + 10);
            const results = await Promise.all(batch.map(sym => processSymbol(sym)));
            results.forEach(r => { if (r) rawResults.push(r); });
            document.getElementById('progress').style.width = `${(i/symbols.length)*100}%`;
            renderList();
        }
        btn.disabled = false;
    }

    function setFilter(filter, el) {
        currentFilter = filter;
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        renderList();
    }

    function renderList() {
        const container = document.getElementById('symbolList');
        let filtered = rawResults.filter(item => {
            if (currentFilter === 'ABOVE_5MA') return item.isAboveMa5;
            if (currentFilter === 'BELOW_5MA') return !item.isAboveMa5;
            if (currentFilter === 'BREAKOUT') return item.isJustBreakout15mBB;
            if (currentFilter === 'ABOVE_BB') return item.isAbove15mBB;
            return true;
        });
        filtered.sort((a, b) => b.priceChange24h - a.priceChange24h);

        container.innerHTML = filtered.map(item => `
            <a class="symbol-card" href="https://www.binance.com/zh-TC/futures/${item.symbol}" target="_blank">
                <div>
                    <div style="font-weight:bold; font-size:1.1rem;">${item.symbol.replace('USDT','')}</div>
                    <div style="margin-top:4px;">
                        ${item.isJustBreakout15mBB ? '<span class="badge badge-breakout">⚡ 剛突破</span>' : ''}
                        ${!item.isJustBreakout15mBB && item.isAbove15mBB ? '<span class="badge badge-fire">🔥 上軌上</span>' : ''}
                    </div>
                </div>
                <div style="text-align:right;">
                    <div style="font-weight:bold;">${item.price}</div>
                    <div style="color:${item.priceChange24h>=0?'var(--green)':'var(--red)'}; font-size:0.8rem;">${item.priceChange24h.toFixed(2)}%</div>
                </div>
            </a>
        `).join('');
    }
</script>
</body>
</html>
