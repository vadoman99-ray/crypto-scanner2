<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ 高效多週期策略 (極速優化版)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=JetBrains+Mono:wght@800&display=swap');

        :root {
            --manga-dark: #0a0e1a;
            --manga-navy: #121b2d;
            --manga-pink: #ff007f;
            --manga-cyan: #00f0ff;
            --manga-yellow: #ffe600;
            --manga-green: #00ff66;
            --manga-red: #ff3366;
            --pop-shadow: 4px 4px 0px #000;
        }

        * { box-sizing: border-box; outline: none; }
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: var(--manga-dark); 
            background-image: radial-gradient(rgba(0, 240, 255, 0.15) 15%, transparent 16%);
            background-size: 16px 16px;
            color: #fff; margin: 0; padding-bottom: 40px; 
        }

        .app-header { 
            position: sticky; top: 0; z-index: 100; 
            background: #101424; border-bottom: 3px solid var(--manga-cyan); 
            padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.3);
        }
        .header-title { font-size: 1.1rem; font-weight: 900; color: #fff; text-shadow: 0 0 8px var(--manga-cyan); }
        .scan-btn { 
            background: linear-gradient(135deg, #ff007f 0%, #ff5500 100%); 
            color: #fff; border: 2px solid #fff; padding: 8px 16px; border-radius: 6px; 
            font-weight: 900; font-size: 0.9rem; cursor: pointer; box-shadow: var(--pop-shadow);
        }
        .scan-btn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }

        .param-panel {
            background: var(--manga-navy); border: 2px solid var(--manga-cyan);
            margin: 14px 16px 0 16px; padding: 12px; border-radius: 8px; box-shadow: var(--pop-shadow);
        }
        .param-panel h3 { margin: 0 0 10px 0; font-size: 0.95rem; color: var(--manga-yellow); }
        .param-row { display: flex; gap: 12px; font-size: 0.85rem; }
        .param-row input { background: #070a12; border: 1px solid #2a3a5c; color: var(--manga-yellow); padding: 4px 6px; border-radius: 4px; width: 60px; text-align: center; font-family: 'JetBrains Mono'; }

        .progress-container { height: 6px; background: #090d16; width: 100%; margin-top: 10px; }
        .progress-fill { height: 100%; width: 0%; background: var(--manga-cyan); transition: width 0.05s ease-out; }

        .dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 14px 16px; }
        .stat-card {
            background: rgba(18, 27, 45, 0.85); border: 2px solid var(--manga-cyan);
            border-radius: 8px; padding: 10px; text-align: center; box-shadow: var(--pop-shadow);
        }
        .stat-card .val { font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; font-weight: 900; }
        .stat-card.entry { border-color: var(--manga-pink); }
        .stat-card.entry .val { color: var(--manga-pink); }

        .container { padding: 0 16px; }
        .symbol-card { 
            background: rgba(20, 30, 50, 0.9); border: 2px solid #2a3a5c; 
            border-left: 6px solid var(--manga-pink); border-radius: 8px; 
            padding: 12px 14px; margin-bottom: 12px; 
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: var(--pop-shadow); cursor: pointer; transition: transform 0.1s;
        }
        .symbol-card:hover { transform: translateY(-2px); border-color: var(--manga-cyan); }
        .symbol-name { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: 900; }
        .symbol-price { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; color: var(--manga-yellow); }
        .detail-row { font-size: 0.78rem; font-family: 'JetBrains Mono', monospace; color: #a0aec0; margin-top: 4px; }
        .badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: 900; background: var(--manga-pink); color: #fff; }

        .modal-backdrop {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 8, 17, 0.85); backdrop-filter: blur(8px);
            z-index: 999; display: none; justify-content: center; align-items: center; padding: 16px;
        }
        .modal-card {
            background: var(--manga-navy); border: 2px solid var(--manga-cyan);
            border-radius: 12px; width: 100%; max-width: 480px; padding: 18px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
        .input-group input {
            background: #070a12; border: 1px solid var(--manga-cyan); color: #fff;
            padding: 8px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
        }
        .info-box { background: #070a12; border: 1px solid #2a3a5c; padding: 10px; border-radius: 6px; margin-bottom: 12px; }
        .info-row { display: flex; justify-content: space-between; font-size: 0.8rem; font-family: 'JetBrains Mono', monospace; margin-bottom: 4px; }
        .action-btn {
            width: 100%; padding: 10px; background: var(--manga-green); color: #000;
            border: none; border-radius: 6px; font-weight: 900; font-size: 1rem; cursor: pointer; box-shadow: var(--pop-shadow);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>

    <div class="app-header">
        <div class="header-title">⚡ 多週期策略 (極速閃電版)</div>
        <button id="scanBtn" class="scan-btn" onclick="startScan()">啟動極速掃描</button>
    </div>

    <div class="param-panel">
        <h3>⚙️ 移動止損試算參數</h3>
        <div class="param-row">
            <span>啟動門檻 (ATR倍數): <input type="number" id="trailTrigger" value="1.0" step="0.1"></span>
            <span>追蹤距離 (ATR倍數): <input type="number" id="trailOffset" value="1.0" step="0.1"></span>
        </div>
    </div>

    <div class="progress-container"><div id="progress" class="progress-fill"></div></div>

    <div class="dashboard">
        <div class="stat-card">
            <div class="val" id="statTotal">0</div>
            <div style="font-size:0.75rem;">掃描目標數</div>
        </div>
        <div class="stat-card entry">
            <div class="val" id="statEntry">0</div>
            <div style="font-size:0.75rem;">符合條件標的</div>
        </div>
    </div>

    <div class="container" id="symbolList"></div>

    <div class="modal-backdrop" id="tradeModal" onclick="if(event.target.id==='tradeModal') closeModal()">
        <div class="modal-card">
            <div class="modal-header">
                <span id="modalSymbol" style="font-family:'JetBrains Mono'; font-weight:900; font-size:1.2rem;">BTCUSDT</span>
                <button onclick="closeModal()" style="background:var(--manga-pink); color:#fff; border:none; border-radius:4px; font-weight:900; cursor:pointer;">✕</button>
            </div>
            
            <div class="info-box">
                <div class="info-row"><span>當前現價:</span><b id="valPrice" style="color:var(--manga-yellow);">0</b></div>
                <div class="info-row"><span>初始止損:</span><b id="valStop" style="color:var(--manga-red);">0</b></div>
                <div class="info-row"><span>移動啟動點:</span><b id="valTrigger" style="color:var(--manga-cyan);">0</b></div>
                <div class="info-row"><span>盈虧比止盈:</span><b id="valTake" style="color:var(--manga-green);">0</b></div>
            </div>

            <div class="input-group">
                <input type="password" id="apiKey" placeholder="Binance API Key">
                <input type="password" id="apiSecret" placeholder="Binance API Secret">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
                    <span style="font-size:0.8rem;">下單金額 (USDT):</span>
                    <input type="number" id="tradeUsdt" value="100" style="width:100px; text-align:center;">
                </div>
            </div>

            <button class="action-btn" onclick="executeTrade()">確認市價買進並掛載移動止損</button>
        </div>
    </div>

<script>
    const API_BASE = 'https://fapi.binance.com';
    let rawResults = [];
    let currentItem = null;

    // 提高併發上限至 20
    async function asyncPool(poolLimit, array, iteratorFn) {
        const ret = [];
        const executing = [];
        for (const item of array) {
            const p = Promise.resolve().then(() => iteratorFn(item));
            ret.push(p);
            if (poolLimit <= array.length) {
                const e = p.then(() => executing.splice(executing.indexOf(e), 1));
                executing.push(e);
                if (executing.length >= poolLimit) {
                    await Promise.race(executing);
                }
            }
        }
        return Promise.all(ret);
    }

    async function fetchKlinesOptimized(symbol) {
        try {
            const [r5m, r15m, r1h] = await Promise.all([
                fetch(`${API_BASE}/fapi/v1/klines?symbol=${symbol}&interval=5m&limit=25`),
                fetch(`${API_BASE}/fapi/v1/klines?symbol=${symbol}&interval=15m&limit=25`),
                fetch(`${API_BASE}/fapi/v1/klines?symbol=${symbol}&interval=1h&limit=20`)
            ]);

            if (!r5m.ok || !r15m.ok || !r1h.ok) return null;
            return { k5m: await r5m.json(), k15m: await r15m.json(), k1h: await r1h.json() };
        } catch { return null; }
    }

    function calcBollingerUpper(closes, period = 20, mult = 2.0) {
        let sum = 0;
        for(let i = closes.length - period; i < closes.length; i++) sum += closes[i];
        const mean = sum / period;
        let variance = 0;
        for(let i = closes.length - period; i < closes.length; i++) variance += Math.pow(closes[i] - mean, 2);
        return mean + (mult * Math.sqrt(variance / period));
    }

    function calcSMA(closes, period) {
        let sum = 0;
        for(let i = closes.length - period; i < closes.length; i++) sum += closes[i];
        return sum / period;
    }

    function calcATR(klines, period = 14) {
        let trSum = 0;
        const len = klines.length;
        for (let i = len - period; i < len; i++) {
            const h = parseFloat(klines[i][2]), l = parseFloat(klines[i][3]), pc = parseFloat(klines[i-1][4]);
            trSum += Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc));
        }
        return trSum / period;
    }

    async function evaluateSymbolOptimized(symbol, updateProgress) {
        const data = await fetchKlinesOptimized(symbol);
        updateProgress();
        if (!data) return null;

        const { k5m, k15m, k1h } = data;

        const c5m = k5m.map(k => parseFloat(k[4]));
        const h5m = parseFloat(k5m[k5m.length - 1][2]);
        if (h5m < calcBollingerUpper(c5m)) return null;

        const c15m = k15m.map(k => parseFloat(k[4]));
        const h15m = parseFloat(k15m[k15m.length - 1][2]);
        if (h15m < calcBollingerUpper(c15m)) return null;

        const c1h = k1h.map(k => parseFloat(k[4]));
        if (c1h[c1h.length - 1] <= calcSMA(c1h, 5)) return null;

        const price = c5m[c5m.length - 1];
        const atr = calcATR(k5m, 14);
        const triggerMult = parseFloat(document.getElementById('trailTrigger').value) || 1.0;
        const offsetMult = parseFloat(document.getElementById('trailOffset').value) || 1.0;

        const stopDist = atr * 1.5;
        const initialStop = price - stopDist;
        const trailTrigger = price + (atr * triggerMult);
        const takeProfit = price + (stopDist * 2.5);

        let dynamicStop = initialStop;
        let highestP = price;

        for (let i = k5m.length - 5; i < k5m.length; i++) {
            const h = parseFloat(k5m[i][2]);
            if (h > highestP) highestP = h;
            if (highestP >= trailTrigger) {
                const trailedStop = highestP - (atr * offsetMult);
                if (trailedStop > dynamicStop) dynamicStop = trailedStop;
            }
        }

        return { symbol, price, atr, initialStop, dynamicStop, trailTrigger, takeProfit, traded: false };
    }

    async function startScan() {
        const btn = document.getElementById('scanBtn');
        btn.disabled = true; btn.innerText = "⚡ 極速全網快照中...";
        rawResults = [];
        document.getElementById('symbolList').innerHTML = '';

        // 【極速關鍵 1】一次性下載全市場 24小時 數據進記憶體快照
        const tickers = await fetch(`${API_BASE}/fapi/v1/ticker/24hr`).then(r => r.json());
        
        // 【極速關鍵 2】初篩：只挑選當天上漲且交易量大的 USDT 永續合約標的，直接淘汰 70% 無效標的
        const candidateSymbols = tickers.filter(t => 
            t.symbol.endsWith('USDT') && 
            parseFloat(t.priceChangePercent) > 0 && 
            parseFloat(t.quoteVolume) > 10000000
        ).map(t => t.symbol);

        document.getElementById('statTotal').innerText = candidateSymbols.length;

        let completed = 0;
        const updateProgress = () => {
            completed++;
            document.getElementById('progress').style.width = `${(completed / candidateSymbols.length) * 100}%`;
        };

        // 【極速關鍵 3】提高併發數至 20 進行精確多週期驗證
        btn.innerText = "🔍 閃電驗證多週期中...";
        const results = await asyncPool(20, candidateSymbols, sym => evaluateSymbolOptimized(sym, updateProgress));

        rawResults = results.filter(Boolean);
        document.getElementById('statEntry').innerText = rawResults.length;

        btn.disabled = false; btn.innerText = "啟動極速掃描";
        renderList();
    }

    function renderList() {
        const container = document.getElementById('symbolList');
        if (rawResults.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:40px; color:#5a7094; font-weight:900;">無符合標的</div>`;
            return;
        }

        container.innerHTML = rawResults.map(item => `
            <div class="symbol-card" onclick="openModal('${item.symbol}')">
                <div style="flex: 1;">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span class="symbol-name">${item.symbol.replace('USDT','')}</span>
                        <span class="badge">🎯 點擊下單</span>
                    </div>
                    <div class="detail-row">
                        初始止損: <span style="color:var(--manga-red);">${item.initialStop.toFixed(4)}</span> | 
                        啟動點: <span style="color:var(--manga-cyan);">${item.trailTrigger.toFixed(4)}</span> | 
                        止盈: <span style="color:var(--manga-green);">${item.takeProfit.toFixed(4)}</span>
                    </div>
                </div>
                <div style="text-align:right;">
                    <div class="symbol-price">${item.price}</div>
                    <div style="font-size:0.75rem; color:var(--manga-red); margin-top:2px;">
                        動態止損: ${item.dynamicStop.toFixed(4)}
                    </div>
                </div>
            </div>
        `).join('');
    }

    function openModal(symbol) {
        currentItem = rawResults.find(r => r.symbol === symbol);
        if (!currentItem) return;

        document.getElementById('modalSymbol').innerText = symbol;
        document.getElementById('valPrice').innerText = currentItem.price.toFixed(4);
        document.getElementById('valStop').innerText = currentItem.dynamicStop.toFixed(4);
        document.getElementById('valTrigger').innerText = currentItem.trailTrigger.toFixed(4);
        document.getElementById('valTake').innerText = currentItem.takeProfit.toFixed(4);

        document.getElementById('tradeModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('tradeModal').style.display = 'none';
    }

    function sendSignedRequest(endpoint, method, params = {}) {
        const key = document.getElementById('apiKey').value;
        const secret = document.getElementById('apiSecret').value;

        if (!key || !secret) {
            alert('請輸入 API Key 與 Secret！');
            return null;
        }

        params.timestamp = Date.now();
        const queryString = Object.keys(params).map(k => `${k}=${encodeURIComponent(params[k])}`).join('&');
        const signature = CryptoJS.HmacSHA256(queryString, secret).toString();

        return fetch(`${API_BASE}${endpoint}?${queryString}&signature=${signature}`, {
            method: method,
            headers: { 'X-MBX-APIKEY': key }
        }).then(r => r.json());
    }

    async function executeTrade() {
        if (!currentItem) return;

        const usdtAmount = parseFloat(document.getElementById('tradeUsdt').value) || 100;
        const qty = (usdtAmount / currentItem.price).toFixed(3);
        const offsetMult = parseFloat(document.getElementById('trailOffset').value) || 1.0;

        try {
            const buyOrder = await sendSignedRequest('/fapi/v1/order', 'POST', {
                symbol: currentItem.symbol, side: 'BUY', type: 'MARKET', quantity: qty
            });

            if (buyOrder.code) {
                alert(`下單失敗: ${buyOrder.msg}`);
                return;
            }

            const callbackRate = ((currentItem.atr * offsetMult) / currentItem.price * 100).toFixed(1);
            await sendSignedRequest('/fapi/v1/order', 'POST', {
                symbol: currentItem.symbol, side: 'SELL', type: 'TRAILING_STOP_MARKET',
                callbackRate: Math.max(0.1, Math.min(5.0, callbackRate)), closePosition: 'true'
            });

            await sendSignedRequest('/fapi/v1/order', 'POST', {
                symbol: currentItem.symbol, side: 'SELL', type: 'TAKE_PROFIT_MARKET',
                stopPrice: currentItem.takeProfit.toFixed(4), closePosition: 'true'
            });

            closeModal();
            alert(`✅ ${currentItem.symbol} 下單與風控掛單成功！`);
        } catch (err) {
            alert(`下單異常: ${err}`);
        }
    }
</script>
</body>
</html>
