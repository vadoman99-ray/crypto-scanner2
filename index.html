<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ 1H MA 多頭篩選器</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=JetBrains+Mono:wght@700;800&display=swap');

        :root {
            --bg-dark: #0a0e17;
            --card-bg: #131b2e;
            --cyan: #00f0ff;
            --yellow: #ffe600;
            --pink: #ff007f;
            --purple: #a855f7;
            --orange: #ff9900;
            --green: #00ff66;
            --red: #ff3366;
            --border: #233048;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: var(--bg-dark); 
            color: #fff; margin: 0; padding: 0;
            user-select: none;
        }

        /* 頂部 Header */
        .app-header { 
            position: sticky; top: 0; z-index: 100; 
            background: #0f1524; border-bottom: 2px solid var(--cyan); 
            padding: 8px 12px; display: flex; flex-direction: column; gap: 6px;
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .header-title { font-size: 0.95rem; font-weight: 900; color: #fff; }
        
        .scan-btn { 
            background: linear-gradient(135deg, var(--pink), #ff5500); 
            color: #fff; border: none; padding: 5px 12px; border-radius: 6px; 
            font-weight: 900; font-size: 0.8rem; cursor: pointer;
        }
        .scan-btn:disabled { opacity: 0.5; filter: grayscale(1); }

        /* BTC & ETH 頂部看板 */
        .crypto-ticker-bar {
            display: flex; background: #070a12; border: 1px solid var(--border);
            padding: 4px 8px; border-radius: 4px; justify-content: space-around;
            font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
        }
        .ticker-item { display: flex; align-items: center; gap: 4px; cursor: pointer; padding: 2px 4px; }
        .ticker-name { color: var(--yellow); font-weight: 800; }

        .progress-container { height: 3px; background: #090d16; width: 100%; }
        .progress-fill { height: 100%; width: 0%; background: var(--cyan); transition: width 0.05s ease-out; }

        /* 計數欄 */
        .stats-bar {
            display: flex; justify-content: space-between; padding: 6px 12px;
            font-size: 0.75rem; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border);
            font-family: 'JetBrains Mono', monospace; color: #8a9bbd;
        }
        .stats-bar b { color: #fff; }

        /* 清單列表 */
        .container { padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
        .symbol-card { 
            background: var(--card-bg); border: 1px solid var(--border); 
            border-left: 4px solid var(--green); border-radius: 6px; 
            padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; 
            cursor: pointer;
        }
        .symbol-card:active { background: #1a253e; }
        .symbol-left { display: flex; align-items: center; gap: 8px; }
        .symbol-rank { font-size: 0.7rem; color: var(--yellow); font-family: 'JetBrains Mono'; font-weight: 800; width: 22px; }
        .symbol-name { font-family: 'JetBrains Mono', monospace; font-size: 0.95rem; font-weight: 800; }
        .symbol-price { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: #e0e6ed; }
        .symbol-dist { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; font-weight: 800; }

        /* 100% 滿版 App 視窗 Modal */
        .modal-backdrop {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg-dark); z-index: 999; display: none;
            flex-direction: column; justify-content: space-between;
        }
        .modal-card {
            background: var(--bg-dark); width: 100%; height: 100%;
            display: flex; flex-direction: column; padding: 12px;
            box-sizing: border-box; overflow: hidden;
        }
        .modal-header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding-bottom: 8px; border-bottom: 1px solid var(--border);
        }

        .modal-body {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 8px;
        }
        
        .chart-container {
            background: #070a12; border: 1px solid var(--border); border-radius: 6px;
            padding: 6px; flex-shrink: 0;
        }
        .chart-title { font-size: 0.65rem; color: #8a9bbd; margin-bottom: 4px; display: flex; justify-content: space-between; }
        canvas { width: 100%; height: 320px; display: block; }

        .info-grid { 
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 12px;
            background: #070a12; border: 1px solid var(--border); padding: 10px; border-radius: 6px;
            font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; flex-shrink: 0;
        }
        .info-item { display: flex; justify-content: space-between; }
        .info-item span { color: #8a9bbd; }

        .modal-footer {
            padding-top: 8px; flex-shrink: 0;
        }

        .binance-btn {
            width: 100%; background: var(--yellow); color: #000; border: none;
            padding: 12px; border-radius: 6px; font-weight: 900; font-size: 0.9rem;
            text-align: center; text-decoration: none; display: block;
        }

        .val-up { color: var(--green); }
        .val-down { color: var(--red); }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="header-top">
            <div class="header-title">⚡ 1H MA 多頭篩選</div>
            <button id="scanBtn" class="scan-btn" onclick="startScan()">開始掃描</button>
        </div>
        <div class="crypto-ticker-bar">
            <div class="ticker-item" onclick="openModalForSymbol('BTCUSDT')">
                <span class="ticker-name">BTC</span>
                <span id="btcPrice">--</span>
                <span id="btcChange">--</span>
            </div>
            <div style="color: var(--border);">|</div>
            <div class="ticker-item" onclick="openModalForSymbol('ETHUSDT')">
                <span class="ticker-name">ETH</span>
                <span id="ethPrice">--</span>
                <span id="ethChange">--</span>
            </div>
        </div>
    </div>

    <div class="progress-container"><div id="progress" class="progress-fill"></div></div>

    <div class="stats-bar">
        <span>目標: <b id="statTotal">0</b></span>
        <span>符合條件: <b id="statEntry" style="color: var(--green);">0</b></span>
    </div>

    <div class="container" id="symbolList"></div>

    <!-- 100% 滿版 Modal 彈窗 -->
    <div class="modal-backdrop" id="tradeModal">
        <div class="modal-card">
            <div class="modal-header">
                <span id="modalSymbol" style="font-family:'JetBrains Mono'; font-weight:900; font-size:1.2rem; color: var(--cyan);">BTCUSDT</span>
                <button onclick="closeModal()" style="background:var(--pink); color:#fff; border:none; border-radius:6px; font-weight:900; padding:6px 12px; font-size:0.9rem; cursor:pointer;">關閉 ✕</button>
            </div>
            
            <div class="modal-body">
                <div class="chart-container">
                    <div class="chart-title">
                        <span>1H 近 100 根 K 線 & 量均線</span>
                        <span>
                            <span style="color:var(--orange);">●5</span> 
                            <span style="color:var(--pink);">●30</span> 
                            <span style="color:var(--purple);">●45</span> 
                            <span style="color:var(--green);">●60</span> | 
                            <span style="color:var(--yellow);">●5VM</span> 
                            <span style="color:var(--purple);">●20VM</span>
                        </span>
                    </div>
                    <canvas id="klineCanvas" width="480" height="320"></canvas>
                </div>

                <div class="info-grid">
                    <div class="info-item"><span>現價</span><b id="valPrice" style="color:var(--yellow);">0</b></div>
                    <div class="info-item"><span>距慢線</span><b id="valMa3Dist" class="val-up">0%</b></div>
                    <div class="info-item"><span>5MA</span><b id="valMA5">0</b></div>
                    <div class="info-item"><span>24H漲跌</span><b id="val24hChange">0%</b></div>
                    <div class="info-item"><span>快(30)</span><b id="valMA1">0</b></div>
                    <div class="info-item"><span>中(45)</span><b id="valMA2">0</b></div>
                    <div class="info-item"><span>慢(60)</span><b id="valMA3">0</b></div>
                    <div class="info-item"><span>5VM</span><b id="valVM5" style="color:var(--yellow);">0</b></div>
                    <div class="info-item"><span>20VM</span><b id="valVM20" style="color:var(--purple);">0</b></div>
                </div>
            </div>

            <div class="modal-footer">
                <a id="binanceLink" href="#" target="_blank" class="binance-btn">🚀 前往幣安合約交易</a>
            </div>
        </div>
    </div>

<script>
    const API_BASE = 'https://fapi.binance.com';
    let rawResults = [];
    let tickerMap = {};

    const P0 = 5, P1 = 30, P2 = 45, P3 = 60;
    const VM1 = 5, VM2 = 20;
    const DISPLAY_COUNT = 100;

    window.addEventListener('DOMContentLoaded', updateHeaderTickers);

    async function updateHeaderTickers() {
        try {
            const res = await fetch(`${API_BASE}/fapi/v1/ticker/24hr`);
            const data = await res.json();
            data.forEach(t => { tickerMap[t.symbol] = t; });

            const btc = tickerMap['BTCUSDT'], eth = tickerMap['ETHUSDT'];
            if (btc) {
                document.getElementById('btcPrice').innerText = parseFloat(btc.lastPrice).toLocaleString();
                const chg = parseFloat(btc.priceChangePercent);
                const el = document.getElementById('btcChange');
                el.innerText = `${chg >= 0 ? '+' : ''}${chg.toFixed(1)}%`;
                el.className = chg >= 0 ? 'val-up' : 'val-down';
            }
            if (eth) {
                document.getElementById('ethPrice').innerText = parseFloat(eth.lastPrice).toLocaleString();
                const chg = parseFloat(eth.priceChangePercent);
                const el = document.getElementById('ethChange');
                el.innerText = `${chg >= 0 ? '+' : ''}${chg.toFixed(1)}%`;
                el.className = chg >= 0 ? 'val-up' : 'val-down';
            }
        } catch (e) {}
    }

    async function asyncPool(poolLimit, array, iteratorFn) {
        const ret = [], executing = new Set();
        for (const item of array) {
            const p = Promise.resolve().then(() => iteratorFn(item));
            ret.push(p); executing.add(p);
            const clean = () => executing.delete(p);
            p.then(clean, clean);
            if (executing.size >= poolLimit) await Promise.race(executing);
        }
        return Promise.all(ret);
    }

    function calculateSMA(dataArray, period) {
        const len = dataArray.length;
        if (len < period) return new Array(len).fill(null);
        const ma = new Array(len).fill(null);
        let sum = 0;
        for (let i = 0; i < period; i++) sum += dataArray[i];
        ma[period - 1] = sum / period;
        for (let i = period; i < len; i++) {
            sum += dataArray[i] - dataArray[i - period];
            ma[i] = sum / period;
        }
        return ma;
    }

    function formatVol(val) {
        if (!val) return '0';
        if (val >= 1e6) return (val / 1e6).toFixed(2) + 'M';
        if (val >= 1e3) return (val / 1e3).toFixed(1) + 'K';
        return val.toFixed(1);
    }

    async function fetchSymbolDetailsData(symbol) {
        const fetchLimit = DISPLAY_COUNT + P3;
        const res = await fetch(`${API_BASE}/fapi/v1/klines?symbol=${symbol}&interval=1h&limit=${fetchLimit}`);
        if (!res.ok) return null;

        const klinesRaw = await res.json(), totalLen = klinesRaw.length;
        if (totalLen < P3) return null;

        const closes = klinesRaw.map(k => parseFloat(k[4]));
        const volumes = klinesRaw.map(k => parseFloat(k[5]));
        const price = closes[totalLen - 1];

        const ma5Arr = calculateSMA(closes, P0);
        const ma1Arr = calculateSMA(closes, P1);
        const ma2Arr = calculateSMA(closes, P2);
        const ma3Arr = calculateSMA(closes, P3);

        const vm5Arr = calculateSMA(volumes, VM1);
        const vm20Arr = calculateSMA(volumes, VM2);

        const ma5 = ma5Arr[totalLen - 1];
        const ma1 = ma1Arr[totalLen - 1];
        const ma2 = ma2Arr[totalLen - 1];
        const ma3 = ma3Arr[totalLen - 1];

        const vm5 = vm5Arr[totalLen - 1];
        const vm20 = vm20Arr[totalLen - 1];

        const ma3DistPercent = ((price - ma3) / ma3) * 100;
        const priceChange24h = tickerMap[symbol] ? parseFloat(tickerMap[symbol].priceChangePercent) : 0;

        return { 
            symbol, price, ma5, ma1, ma2, ma3, vm5, vm20, ma3DistPercent, priceChange24h, 
            klines: klinesRaw.slice(-DISPLAY_COUNT), 
            maSeries: {
                [P0]: ma5Arr.slice(-DISPLAY_COUNT),
                [P1]: ma1Arr.slice(-DISPLAY_COUNT),
                [P2]: ma2Arr.slice(-DISPLAY_COUNT),
                [P3]: ma3Arr.slice(-DISPLAY_COUNT)
            },
            vmSeries: {
                [VM1]: vm5Arr.slice(-DISPLAY_COUNT),
                [VM2]: vm20Arr.slice(-DISPLAY_COUNT)
            },
            isBullish: (ma1 > ma2 && ma2 > ma3 && price >= ma3)
        };
    }

    async function startScan() {
        const btn = document.getElementById('scanBtn');
        btn.disabled = true; btn.innerText = "掃描中...";
        rawResults = []; tickerMap = {};
        document.getElementById('symbolList').innerHTML = '';

        await updateHeaderTickers();

        const candidateSymbols = Object.keys(tickerMap).filter(sym => 
            sym.endsWith('USDT') && parseFloat(tickerMap[sym].priceChangePercent) > 0 && parseFloat(tickerMap[sym].quoteVolume) > 10000000
        );

        document.getElementById('statTotal').innerText = candidateSymbols.length;

        let completed = 0;
        const updateProgress = () => {
            completed++;
            document.getElementById('progress').style.width = `${(completed / candidateSymbols.length) * 100}%`;
        };

        const results = await asyncPool(40, candidateSymbols, async (sym) => {
            try {
                const data = await fetchSymbolDetailsData(sym);
                updateProgress();
                return (data && data.isBullish) ? data : null;
            } catch { updateProgress(); return null; }
        });

        rawResults = results.filter(Boolean).sort((a, b) => b.ma3DistPercent - a.ma3DistPercent);
        document.getElementById('statEntry').innerText = rawResults.length;

        btn.disabled = false; btn.innerText = "開始掃描";
        renderList();
    }

    function renderList() {
        const container = document.getElementById('symbolList');
        if (rawResults.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:30px; color:#5a7094; font-size:0.85rem;">無符合資料</div>`;
            return;
        }

        const fragment = document.createDocumentFragment();
        rawResults.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'symbol-card';
            card.onclick = () => openModal(item);

            const distClass = item.ma3DistPercent >= 0 ? 'val-up' : 'val-down';

            card.innerHTML = `
                <div class="symbol-left">
                    <span class="symbol-rank">#${index + 1}</span>
                    <span class="symbol-name">${item.symbol.replace('USDT','')}</span>
                </div>
                <div class="symbol-price">${item.price}</div>
                <div class="symbol-dist ${distClass}">${item.ma3DistPercent >= 0 ? '+' : ''}${item.ma3DistPercent.toFixed(1)}%</div>
            `;
            fragment.appendChild(card);
        });

        container.innerHTML = '';
        container.appendChild(fragment);
    }

    function drawChart(item) {
        const canvas = document.getElementById('klineCanvas');
        const ctx = canvas.getContext('2d'), width = canvas.width, height = canvas.height;
        ctx.clearRect(0, 0, width, height);

        const klines = item.klines, displayCount = klines.length;
        
        const priceChartHeight = height * 0.70;
        const volChartHeight = height * 0.25;
        const volAreaTop = height - volChartHeight;

        let minPrice = Infinity, maxPrice = -Infinity;
        let maxVol = -Infinity;

        for (let i = 0; i < displayCount; i++) {
            const high = parseFloat(klines[i][2]), low = parseFloat(klines[i][3]);
            const vol = parseFloat(klines[i][5]);
            if (high > maxPrice) maxPrice = high;
            if (low < minPrice) minPrice = low;
            if (vol > maxVol) maxVol = vol;
        }

        const padding = 8;
        const priceRange = maxPrice - minPrice || 1;
        const getYPrice = (price) => priceChartHeight - padding - ((price - minPrice) / priceRange) * (priceChartHeight - padding * 2);
        const getYVol = (vol) => height - ((vol / (maxVol || 1)) * (volChartHeight - 4));

        const candleWidth = (width / displayCount) * 0.65, stepX = width / displayCount;

        // 1. K線 & 成交量柱狀圖
        klines.forEach((k, idx) => {
            const open = parseFloat(k[1]), high = parseFloat(k[2]), low = parseFloat(k[3]), close = parseFloat(k[4]);
            const vol = parseFloat(k[5]);
            const x = idx * stepX + stepX / 2, isUp = close >= open;

            ctx.strokeStyle = isUp ? '#00ff66' : '#ff3366';
            ctx.fillStyle = isUp ? '#00ff66' : '#ff3366';

            ctx.beginPath();
            ctx.moveTo(x, getYPrice(high)); ctx.lineTo(x, getYPrice(low));
            ctx.stroke();

            const topY = getYPrice(Math.max(open, close)), bottomY = getYPrice(Math.min(open, close));
            ctx.fillRect(x - candleWidth / 2, topY, candleWidth, Math.max(1, bottomY - topY));

            const vY = getYVol(vol);
            ctx.globalAlpha = 0.4;
            ctx.fillRect(x - candleWidth / 2, vY, candleWidth, height - vY);
            ctx.globalAlpha = 1.0;
        });

        ctx.strokeStyle = '#233048';
        ctx.setLineDash([2, 2]);
        ctx.beginPath(); ctx.moveTo(0, volAreaTop); ctx.lineTo(width, volAreaTop); ctx.stroke();
        ctx.setLineDash([]);

        // 2. 價格 MA 均線
        const drawLine = (series, color, getYFunc, width = 1.2) => {
            ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = width;
            let started = false;
            for (let i = 0; i < displayCount; i++) {
                if (series[i] !== null) {
                    const x = i * stepX + stepX / 2, y = getYFunc(series[i]);
                    if (!started) { ctx.moveTo(x, y); started = true; } else { ctx.lineTo(x, y); }
                }
            }
            ctx.stroke();
        };

        drawLine(item.maSeries[P0], '#ff9900', getYPrice, 1.5);
        drawLine(item.maSeries[P1], '#ff007f', getYPrice);
        drawLine(item.maSeries[P2], '#a855f7', getYPrice);
        drawLine(item.maSeries[P3], '#00ff66', getYPrice);

        // 3. 成交量均線 (5VM & 20VM)
        drawLine(item.vmSeries[VM1], '#ffe600', getYVol, 1.0);
        drawLine(item.vmSeries[VM2], '#a855f7', getYVol, 1.0);
    }

    async function openModalForSymbol(symbol) {
        let item = rawResults.find(r => r.symbol === symbol);
        if (!item) item = await fetchSymbolDetailsData(symbol);
        if (item) openModal(item);
    }

    function openModal(item) {
        document.getElementById('modalSymbol').innerText = item.symbol;
        document.getElementById('valPrice').innerText = item.price.toFixed(4);
        document.getElementById('valMA5').innerText = item.ma5.toFixed(4);

        const dist3El = document.getElementById('valMa3Dist');
        dist3El.innerText = `${item.ma3DistPercent >= 0 ? '+' : ''}${item.ma3DistPercent.toFixed(2)}%`;

        const chgEl = document.getElementById('val24hChange');
        chgEl.innerText = `${item.priceChange24h >= 0 ? '+' : ''}${item.priceChange24h.toFixed(2)}%`;
        chgEl.className = item.priceChange24h >= 0 ? 'val-up' : 'val-down';

        document.getElementById('valMA1').innerText = item.ma1.toFixed(4);
        document.getElementById('valMA2').innerText = item.ma2.toFixed(4);
        document.getElementById('valMA3').innerText = item.ma3.toFixed(4);

        document.getElementById('valVM5').innerText = formatVol(item.vm5);
        document.getElementById('valVM20').innerText = formatVol(item.vm20);

        document.getElementById('binanceLink').href = `https://www.binance.com/zh-TC/futures/${item.symbol}`;
        document.getElementById('tradeModal').style.display = 'flex';

        requestAnimationFrame(() => drawChart(item));
    }

    function closeModal() {
        document.getElementById('tradeModal').style.display = 'none';
    }
</script>
</body>
</html>
