<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幣安 1H 20MA 合約掃描器</title>
    <style>
        :root {
            --bg-color: #12161c;
            --card-bg: #1e2329;
            --card-border: #2b313a;
            --text-main: #eaecef;
            --text-sub: #848e9c;
            --yellow: #f0b90b;
            --green: #0ecb81;
            --green-bg: rgba(14, 203, 129, 0.12);
            --orange: #f6465d;
            --orange-bg: rgba(246, 70, 93, 0.12);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            padding-bottom: 70px; /* 預留底部導覽列空間 */
        }

        /* 頂部固定標題列 */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--card-border);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-title {
            font-size: 1.05rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .scan-btn {
            background-color: var(--yellow);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .scan-btn:disabled {
            opacity: 0.5;
        }

        /* 進度條 */
        .progress-bar {
            height: 3px;
            background: var(--card-border);
            width: 100%;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--yellow);
            transition: width 0.2s;
        }

        /* 狀態與統計資訊 */
        .status-bar {
            padding: 10px 16px;
            font-size: 0.8rem;
            color: var(--text-sub);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 35, 41, 0.5);
        }

        /* 內容容器 */
        .container {
            padding: 12px 16px;
        }

        /* 列表卡片樣式 (手機最佳化) */
        .symbol-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: inherit;
        }

        .symbol-card:active {
            background-color: #2b313a;
        }

        .symbol-info .name {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .symbol-info .price-sub {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .symbol-metrics {
            text-align: right;
        }

        .symbol-metrics .price {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 4px;
            font-family: monospace;
        }

        /* 標籤元件 */
        .badge {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
            display: inline-block;
        }

        .badge-above {
            background-color: var(--green-bg);
            color: var(--green);
        }

        .badge-below {
            background-color: var(--yellow);
            color: #000;
        }

        /* 空狀態 */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        /* 底部分頁導覽列 (Mobile Bottom Nav) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: var(--card-bg);
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
            font-size: 0.75rem;
            border: none;
            background: none;
            padding: 6px 0;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--yellow);
            font-weight: bold;
        }

        .nav-icon {
            font-size: 1.2rem;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <!-- 頂部列 -->
    <div class="app-header">
        <div class="app-title">⚡ 1H 20MA 掃描器</div>
        <button id="scanBtn" class="scan-btn" onclick="startScan()">開始掃描</button>
    </div>

    <!-- 進度條 -->
    <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>

    <!-- 狀態列 -->
    <div class="status-bar">
        <span id="statusText">請點擊右上方「開始掃描」</span>
        <span id="countText">共 0 筆標的</span>
    </div>

    <!-- 幣種卡片列表區塊 -->
    <div class="container" id="symbolList">
        <div class="empty-state">點擊開始掃描，自動過濾幣安 USDT 永續合約</div>
    </div>

    <!-- 底部導覽選單 -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="setFilter('ALL', this)">
            <div class="nav-icon">🌐</div>
            <div>全部 (20MA+)</div>
        </button>
        <button class="nav-item" onclick="setFilter('ABOVE_5MA', this)">
            <div class="nav-icon">🟢</div>
            <div>5MA 上方</div>
        </button>
        <button class="nav-item" onclick="setFilter('BELOW_5MA', this)">
            <div class="nav-icon">🟡</div>
            <div>5MA 下方 (回踩)</div>
        </button>
    </div>

<script>
    let rawResults = [];
    let currentFilter = 'ALL';

    function calculateSMA(data, count) {
        return data.slice(-count).reduce((sum, val) => sum + val, 0) / count;
    }

    async function getUSDTFuturesSymbols() {
        const res = await fetch('https://fapi.binance.com/fapi/v1/exchangeInfo');
        const data = await res.json();
        return data.symbols
            .filter(s => s.quoteAsset === 'USDT' && s.contractType === 'PERPETUAL' && s.status === 'TRADING')
            .map(s => s.symbol);
    }

    async function fetchKlineData(symbol) {
        try {
            const res = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=1h&limit=30`);
            const data = await res.json();
            
            const closes = data.map(k => parseFloat(k[4]));
            const currentClose = closes[closes.length - 1];
            
            const ma20 = calculateSMA(closes, 20);
            const ma5 = calculateSMA(closes, 5);

            // 核心條件：1H 收盤價在 20MA 上方
            if (currentClose > ma20) {
                return {
                    symbol: symbol,
                    price: currentClose,
                    ma20: ma20,
                    ma5: ma5,
                    isAboveMa5: currentClose >= ma5
                };
            }
            return null;
        } catch (e) {
            return null;
        }
    }

    async function startScan() {
        const scanBtn = document.getElementById('scanBtn');
        const statusText = document.getElementById('statusText');
        const progressEl = document.getElementById('progress');
        
        scanBtn.disabled = true;
        scanBtn.innerText = "掃描中...";
        rawResults = [];
        renderList();

        statusText.innerText = "正在取得標的清單...";
        const symbols = await getUSDTFuturesSymbols();
        
        const batchSize = 12; // 併發控制
        let processed = 0;

        for (let i = 0; i < symbols.length; i += batchSize) {
            const batch = symbols.slice(i, i + batchSize);
            const promises = batch.map(sym => fetchKlineData(sym));
            const results = await Promise.all(promises);

            results.forEach(res => {
                if (res) rawResults.push(res);
            });

            processed += batch.length;
            const pct = Math.floor((processed / symbols.length) * 100);
            progressEl.style.width = `${pct}%`;
            statusText.innerText = `掃描進度: ${processed}/${symbols.length}`;
            renderList(); // 即時渲染
        }

        statusText.innerText = `掃描完成！`;
        scanBtn.disabled = false;
        scanBtn.innerText = "重新掃描";
    }

    function setFilter(filter, el) {
        currentFilter = filter;
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        el.classList.add('active');
        renderList();
    }

    function renderList() {
        const container = document.getElementById('symbolList');
        const countText = document.getElementById('countText');
        
        let filtered = rawResults.filter(item => {
            if (currentFilter === 'ABOVE_5MA') return item.isAboveMa5;
            if (currentFilter === 'BELOW_5MA') return !item.isAboveMa5;
            return true;
        });

        // 排序：以溢價率或狀態排序
        filtered.sort((a, b) => (b.price / b.ma20) - (a.price / a.ma20));

        countText.innerText = `符合: ${filtered.length} 筆`;

        if (filtered.length === 0) {
            container.innerHTML = `<div class="empty-state">尚無符合條件的標的</div>`;
            return;
        }

        container.innerHTML = filtered.map(item => `
            <a class="symbol-card" href="https://www.binance.com/zh-TC/futures/${item.symbol}" target="_blank">
                <div class="symbol-info">
                    <div class="name">
                        ${item.symbol.replace('USDT', '')}
                        <span style="font-size: 0.7rem; color: var(--text-sub);">/USDT</span>
                    </div>
                    <div>
                        ${item.isAboveMa5 
                            ? `<span class="badge badge-above">5MA 上方 (強勢)</span>` 
                            : `<span class="badge badge-below">5MA 下方 (回踩)</span>`}
                    </div>
                </div>
                <div class="symbol-metrics">
                    <div class="price">${item.price}</div>
                    <div class="price-sub">20MA: ${item.ma20.toFixed(4)}</div>
                </div>
            </a>
        `).join('');
    }
</script>

</body>
</html>
