<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TrendFlow | 幣安趨勢掃描</title>
    <style>
        :root {
            --bg-body: #0b0e11;
            --bg-card: #161a1e;
            --bg-card-hover: #1e2329;
            --border: #2b3139;
            --text-primary: #eaecef;
            --text-secondary: #848e9c;
            --accent-yellow: #f0b90b;
            --accent-green: #0ecb81;
            --accent-red: #f6465d;
            --accent-fire: #ff6d00;
            --accent-breakout: #e040fb;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-body); color: var(--text-primary); margin: 0; padding-bottom: 80px; }
        
        /* Header */
        .app-header { background: var(--bg-card); padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px; }
        .logo span { color: var(--accent-yellow); }
        .scan-btn { background: var(--accent-yellow); color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: opacity 0.2s; }
        .scan-btn:disabled { opacity: 0.5; }
        
        /* Progress & Status */
        .progress-container { height: 2px; width: 100%; background: var(--border); }
        .progress-fill { height: 100%; width: 0%; background: var(--accent-yellow); transition: width 0.3s ease; }
        .meta-bar { padding: 10px 16px; display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-secondary); background: var(--bg-body); }
        
        /* Symbol Cards */
        .list-container { padding: 0 12px; }
        .symbol-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; display: grid; grid-template-columns: 1fr auto; align-items: center; transition: background 0.2s; text-decoration: none; color: inherit; }
        .symbol-card:active { background: var(--bg-card-hover); }
        .card-left .name { font-size: 1.05rem; font-weight: 700; margin-bottom: 2px; }
        .card-left .tags { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
        .card-right { text-align: right; }
        .card-right .price { font-family: 'Courier New', monospace; font-weight: 600; }
        .card-right .change { font-size: 0.85rem; font-weight: 600; margin-top: 4px; }
        
        /* Badges */
        .badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
        .badge-above { background: rgba(14, 203, 129, 0.1); color: var(--accent-green); border: 1px solid rgba(14, 203, 129, 0.2); }
        .badge-below { background: rgba(240, 185, 11, 0.1); color: var(--accent-yellow); border: 1px solid rgba(240, 185, 11, 0.2); }
        .badge-fire { background: rgba(255, 109, 0, 0.1); color: var(--accent-fire); border: 1px solid rgba(255, 109, 0, 0.2); }
        .badge-breakout { background: rgba(224, 64, 251, 0.1); color: var(--accent-breakout); border: 1px solid var(--accent-breakout); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        /* Navigation */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: var(--bg-card); border-top: 1px solid var(--border); display: flex; overflow-x: auto; padding: 4px 0; z-index: 100; }
        .nav-item { flex: 0 0 auto; padding: 8px 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-secondary); cursor: pointer; border: none; background: none; font-size: 0.7rem; }
        .nav-item.active { color: var(--accent-yellow); font-weight: 600; }
        
        /* Info Page Styles */
        .info-container { padding: 20px; color: var(--text-secondary); line-height: 1.5; font-size: 0.9rem; }
        .info-card { background: var(--bg-card); padding: 16px; border-radius: 10px; margin-bottom: 16px; border: 1px solid var(--border); }
        .info-card h3 { color: var(--text-primary); margin-top: 0; margin-bottom: 10px; font-size: 1rem; }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="logo">Trend<span>Flow</span></div>
        <button id="scanBtn" class="scan-btn" onclick="startScan()">開始掃描</button>
    </header>

    <div class="progress-container"><div id="progress" class="progress-fill"></div></div>
    
    <div class="meta-bar">
        <span id="updateTime">最後更新: --:--</span>
        <span id="countText">0 筆資料</span>
    </div>

    <div id="content" class="list-container">
        <div style="text-align:center; margin-top:100px; color:var(--text-secondary);">點擊「開始掃描」以獲取即時數據</div>
    </div>

    <nav class="nav-bar">
        <button class="nav-item active" onclick="setFilter('ALL', this)">🌐 <span>全部</span></button>
        <button class="nav-item" onclick="setFilter('ABOVE_5MA', this)">🟢 <span>5MA 上</span></button>
        <button class="nav-item" onclick="setFilter('BELOW_5MA', this)">🟡 <span>5MA 下</span></button>
        <button class="nav-item" onclick="setFilter('BREAKOUT', this)">⚡ <span>剛突破</span></button>
        <button class="nav-item" onclick="setFilter('ABOVE_BB', this)">🔥 <span>上軌之上</span></button>
        <button class="nav-item" onclick="setFilter('INFO', this)">ℹ️ <span>說明</span></button>
    </nav>

<script>
    // --- Data Logic (Maintained) ---
    let rawResults = [];
    let currentFilter = 'ALL';
    let ticker24hMap = {};

    function calculateSMA(data, count) { return data.slice(-count).reduce((sum, val) => sum + val, 0) / count; }
    function calculateBBAt(prices, index, period = 20) {
        if (index < period - 1) return Infinity;
        const slice = prices.slice(index - period + 1, index + 1);
        const sma = slice.reduce((a, b) => a + b, 0) / period;
        const variance = slice.reduce((a, b) => a + Math.pow(b - sma, 2), 0) / period;
        return sma + (2 * Math.sqrt(variance));
    }

    async function processSymbol(symbol) {
        try {
            const res1h = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=1h&limit=30`);
            const data1h = await res1h.json();
            const closes1h = data1h.map(k => parseFloat(k[4]));
            const currentClose1h = closes1h[closes1h.length - 1];
            const ma20 = calculateSMA(closes1h, 20);
            const ma5 = calculateSMA(closes1h, 5);

            if (currentClose1h > ma20) {
                const res15m = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=15m&limit=35`);
                const data15m = await res15m.json();
                const closes15m = data15m.map(k => parseFloat(k[4]));
                const currIdx = closes15m.length - 1;
                const prevIdx = currIdx - 1;
                const currUpperBB = calculateBBAt(closes15m, currIdx);
                const prevUpperBB = calculateBBAt(closes15m, prevIdx);

                return {
                    symbol, price: currentClose1h, ma20,
                    isAboveMa5: currentClose1h >= ma5,
                    isAbove15mBB: closes15m[currIdx] >= currUpperBB,
                    isJustBreakout15mBB: (closes15m[prevIdx] < prevUpperBB && closes15m[currIdx] >= currUpperBB),
                    priceChange24h: ticker24hMap[symbol] || 0
                };
            }
            return null;
        } catch (e) { return null; }
    }

    async function startScan() {
        const btn = document.getElementById('scanBtn');
        btn.disabled = true;
        rawResults = [];
        
        const t24 = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
        const tData = await t24.json();
        tData.forEach(t => ticker24hMap[t.symbol] = parseFloat(t.priceChangePercent));

        const info = await fetch('https://fapi.binance.com/fapi/v1/exchangeInfo');
        const infoData = await info.json();
        const symbols = infoData.symbols.filter(s => s.quoteAsset === 'USDT' && s.contractType === 'PERPETUAL').map(s => s.symbol);

        for (let i = 0; i < symbols.length; i += 15) {
            const batch = symbols.slice(i, i + 15);
            const results = await Promise.all(batch.map(sym => processSymbol(sym)));
            results.forEach(r => { if (r) rawResults.push(r); });
            document.getElementById('progress').style.width = `${(i/symbols.length)*100}%`;
            if (currentFilter !== 'INFO') renderList();
        }
        
        btn.disabled = false;
        document.getElementById('updateTime').innerText = `最後更新: ${new Date().toLocaleTimeString('zh-TW', {hour: '2-digit', minute:'2-digit'})}`;
        renderList();
    }

    function setFilter(filter, el) {
        currentFilter = filter;
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        renderList();
    }

    function renderList() {
        const container = document.getElementById('content');
        if (currentFilter === 'INFO') {
            container.innerHTML = `
                <div class="info-container">
                    <div class="info-card"><h3>TrendFlow Scanner</h3><p>專為幣安合約交易者設計的自動化掃描系統。我們過濾掉雜訊，只呈現具備趨勢動能的潛力標的。</p></div>
                    <div class="info-card"><h3>策略邏輯</h3><p>以 1H 20MA 為多頭主基調，結合 15m 布林通道(BB)捕捉突破與動能，協助您快速定位資金熱點。</p></div>
                </div>`;
            return;
        }

        let filtered = rawResults.filter(item => {
            if (currentFilter === 'ABOVE_5MA') return item.isAboveMa5;
            if (currentFilter === 'BELOW_5MA') return !item.isAboveMa5;
            if (currentFilter === 'BREAKOUT') return item.isJustBreakout15mBB;
            if (currentFilter === 'ABOVE_BB') return item.isAbove15mBB;
            return true;
        });
        filtered.sort((a, b) => b.priceChange24h - a.priceChange24h);
        document.getElementById('countText').innerText = `${filtered.length} 筆資料`;

        container.innerHTML = filtered.map(item => `
            <a class="symbol-card" href="https://www.binance.com/zh-TC/futures/${item.symbol}" target="_blank">
                <div class="card-left">
                    <div class="name">${item.symbol.replace('USDT','')} <span style="color:var(--text-secondary); font-size:0.8rem;">/USDT</span></div>
                    <div class="tags">
                        ${item.isAboveMa5 ? '<span class="badge badge-above">5MA 上</span>' : '<span class="badge badge-below">5MA 下</span>'}
                        ${item.isJustBreakout15mBB ? '<span class="badge badge-breakout">⚡ 剛突破</span>' : (item.isAbove15mBB ? '<span class="badge badge-fire">🔥 上軌上</span>' : '')}
                    </div>
                </div>
                <div class="card-right">
                    <div class="price">${item.price}</div>
                    <div class="change" style="color:${item.priceChange24h>=0?'var(--accent-green)':'var(--accent-red)'}">
                        ${item.priceChange24h>=0?'+':''}${item.priceChange24h.toFixed(2)}%
                    </div>
                </div>
            </a>
        `).join('');
    }
</script>
</body>
</html>
